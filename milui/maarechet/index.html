<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בדיקת שינויים במערכת · כנפי רוח</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;400;500;600;700&display=swap">
<style>
:root{--ground:#eef1f5;--card:#fff;--muted:#f5f7fa;--line:#dfe4ea;--ink:#1f2a37;--ink2:#5b6878;--rail:#26323f;--brand:#2f7fd6;--brand2:#1f5fa6;
--green:#4f9a2a;--green-ink:#3f7d21;--orange:#c77700;--red:#c62a20;--red-bg:#fdecea;--green-bg:#ecf6e6;--blue:#4a8ec9;--r:10px;--shadow:0 1px 3px rgba(31,42,55,.10)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:Heebo,Assistant,system-ui,sans-serif;font-size:17px;line-height:1.5}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.top{background:var(--rail);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top b{font-size:18px}.top a{color:#c9d3de;font-size:15px}
main{max-width:1240px;margin:0 auto;padding:20px 20px 60px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.head{padding:18px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:26px;line-height:1.3}
h2{margin:0;font-size:20px}
.muted{color:var(--ink2)}.small{font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border:0;border-radius:var(--r);background:var(--brand);color:#fff;font-size:17px;font-weight:600;text-decoration:none}
.btn:hover{background:var(--brand2)}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid #c9d1db}.btn.sec:hover{background:var(--muted)}
.btn.ok{background:var(--green)}.btn.ok:hover{background:var(--green-ink)}
.btn.sm{min-height:44px;padding:0 16px;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.kpi{border:0;border-radius:14px;padding:18px 22px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:104px;text-align:right;cursor:pointer;transition:transform .12s,box-shadow .12s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(31,42,55,.18)}
.kpi b{display:block;font-size:20px}.kpi span{font-size:14px;opacity:.95}.kpi .go{display:block;text-decoration:underline;text-underline-offset:3px;margin-top:4px}
.kpi .n{font-size:58px;line-height:58px;font-weight:200}
.k-red{background:var(--red)}.k-green{background:var(--green)}.k-blue{background:var(--blue)}
.bar{height:10px;background:#dfe4ea;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border:1.5px solid #c9d1db;border-radius:999px;background:#fff;font-size:16px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip .cnt{min-width:24px;height:24px;border-radius:99px;background:var(--red);color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.chip .cnt.done{background:var(--green)}
.chip.quiet{color:var(--ink2);border-style:dashed}
.sec-pad{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.gridwrap{overflow-x:auto}
table.tt{border-collapse:separate;border-spacing:6px;width:100%;min-width:860px;table-layout:fixed}
.tt th{font-size:15px;color:var(--ink2);font-weight:600;padding:4px}
.tt th.h{width:64px}
.tt td{vertical-align:top;background:var(--muted);border-radius:8px;padding:8px 10px;font-size:14.5px;line-height:1.35;min-height:60px;height:64px;border:2px solid transparent}
.tt td.empty{background:transparent}
.tt td .s{font-weight:600;display:block}.tt td .t{color:var(--ink2);display:block}
.tt td .l+.l{margin-top:6px;padding-top:6px;border-top:1px dashed #cfd6de}
.tt td.chg{background:var(--red-bg);border-color:var(--red);cursor:pointer}
.tt td.chg .s,.tt td.chg .t{color:#8f1d16}
.tt td.chg.done{background:var(--green-bg);border-color:var(--green)}
.tt td.chg.done .s,.tt td.chg.done .t{color:var(--ink)}
.tt td .was{display:block;margin-top:4px;font-size:13px;color:var(--ink2);text-decoration:line-through}
.tt td .dec{display:inline-block;margin-top:5px;font-size:12.5px;font-weight:700;color:var(--green-ink)}
.tt td.chg:focus-visible,.item:focus-visible{outline:3px solid #9cc3ef}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--muted);border-radius:8px;border-right:6px solid var(--red);padding:12px 16px}
.item.done{border-right-color:var(--green)}
.item .w{flex:1 1 300px;display:flex;flex-direction:column;gap:3px}
.item .w b{font-size:17px}
.old{color:var(--ink2);text-decoration:line-through}.new{color:var(--red);font-weight:600}
.item.done .new{color:var(--ink)}
.tag{font-size:14px;font-weight:700}.tag.ok{color:var(--green-ink)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(31,42,55,.45);display:flex;align-items:center;justify-content:center;padding:14px}
.modal{width:100%;max-width:640px;max-height:94vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mhead{background:var(--brand);color:#fff;padding:16px 22px;font-size:20px;font-weight:600;position:sticky;top:0;z-index:1}
.mbody{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.mfoot{display:flex;flex-wrap:wrap;gap:10px;padding:0 22px 22px}.mfoot .btn{flex:1}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp>div{border-radius:8px;padding:10px 14px;background:var(--muted)}
.cmp>div.now{background:var(--red-bg)}
.cmp .lbl{font-size:13px;color:var(--ink2);font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:right;width:100%;border:1.5px solid #c9d1db;border-radius:var(--r);background:#fff;padding:12px 14px}
.opt .ic{flex:0 0 30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px}
.opt b{display:block;font-size:17px}.opt span{font-size:14.5px;color:var(--ink2)}
.opt[aria-pressed="true"]{border:2px solid var(--brand);background:#eaf3fc}
.more{display:flex;flex-direction:column;gap:10px;background:var(--muted);border-radius:8px;padding:12px 14px}
.more label{font-size:15px;font-weight:600;display:flex;flex-direction:column;gap:4px}
input[type=text],input[type=tel],textarea{min-height:48px;border:1.5px solid #c9d1db;border-radius:var(--r);padding:8px 12px;background:#fff;width:100%}
textarea{min-height:80px;resize:vertical}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{min-height:42px;padding:0 14px;border:1.5px solid #c9d1db;border-radius:999px;background:#fff;font-size:15px}
.pills button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.check{display:flex;gap:10px;align-items:center;font-size:16px;background:#fdf1dc;border-radius:8px;padding:10px 12px}
.check input{width:22px;height:22px}
.sum h3{margin:6px 0 4px;font-size:18px;display:flex;gap:8px;align-items:center}
.sum h3 .dot{width:12px;height:12px;border-radius:50%}
.sum ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.sum li{line-height:1.45}
.sum .none{color:var(--ink2)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:var(--r);z-index:60;font-size:16px}
.login{min-height:80vh;display:flex;align-items:center;justify-content:center}
.login form{width:100%;max-width:420px;padding:28px;display:flex;flex-direction:column;gap:14px}
.err{color:var(--red);font-weight:600}
@media (max-width:760px){main{padding:14px 12px 40px}.kpis{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.kpi{padding:10px 12px;min-height:84px;flex-direction:column-reverse;align-items:flex-start;justify-content:flex-end;gap:2px}.kpi .n{font-size:38px;line-height:38px}.kpi b{font-size:16px}.kpi div span:not(.go){display:none}.cmp{grid-template-columns:1fr}.head{padding:14px 16px}}
@media print{.top,.kpis,.chips,.mfoot,.noprint{display:none!important}body{background:#fff}.overlay{position:static;background:none;padding:0}.modal{box-shadow:none;max-height:none}}
</style>
</head>

  h+='<section class="card sec-pad"><h2>כיתה '+esc(C.name)+'</h2>'+(chs.length?'<div class="muted small">'+chs.length+' שינויים בכיתה הזו. אדום = מחכה להחלטה, ירוק = טופל.</div>':'<div class="muted">אין שינויים בכיתה הזו.</div>')+g+'</section>';
  if(chs.length)h+='<section class="card sec-pad"><h2>השינויים בכיתה, כרשימה</h2><div class="list">'+chs.map(c=>{const dn=S.dec[c.key];
    return '<div class="item'+(dn?' done':'')+'"><div class="w"><b>יום '+DAYS[c.day]+', שעה '+c.hour+'</b><span><span class="old">'+esc(lesList(c.old))+'</span> ← <span class="new">'+esc(lesList(c.new))+'</span></span>'+(dn?'<span class="tag ok">✓ '+esc(TYPES[dn.type].t)+(dn.note?' · '+esc(dn.note):'')+'</span>':'')+'</div><button class="btn sm'+(dn?' sec':'')+'" data-act="open" data-k="'+esc(c.key)+'">'+(dn?'שינוי החלטה':'להחליט')+'</button></div>'}).join('')+'</div></section>';
  h+='</main>';
  if(S.modal)h+=S.modal==='summary'?summaryHtml():modalHtml();
  root.innerHTML=h;
}

function similar(c){const o=c.old.map(x=>x[2]).sort().join('|'),n=c.new.map(x=>x[2]).sort().join('|');
  if(o===n)return [];return CH.filter(x=>x.key!==c.key&&!S.dec[x.key]&&x.old.map(y=>y[2]).sort().join('|')===o&&x.new.map(y=>y[2]).sort().join('|')===n)}
function modalHtml(){
  const c=byKey[S.modal],D=S.draft,sim=similar(c);
  let h='<div class="overlay" data-act="close"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mh"><div class="mhead" id="mh">'+esc(clsShort(c.cls))+' · יום '+DAYS[c.day]+' · שעה '+c.hour+'</div><div class="mbody">'+
   '<div class="cmp"><div><div class="lbl">היה בתחילת השנה</div>'+(c.old.length?c.old.map(x=>'<div><b>'+esc(x[0])+'</b> · '+esc(x[2])+'</div>').join(''):'<div class="muted">(שעה ריקה)</div>')+'</div>'+
   '<div class="now"><div class="lbl">במערכת עכשיו</div>'+(c.new.length?c.new.map(x=>'<div><b>'+esc(x[0])+'</b> · '+esc(x[2])+'</div>').join(''):'<div class="muted">(שעה ריקה)</div>')+'</div></div>'+
   '<h2 style="font-size:18px">מה עושים עם השינוי?</h2><div class="opts" role="radiogroup">'+Object.entries(TYPES).map(([k,v])=>'<button type="button" class="opt" role="radio" data-act="type" data-v="'+k+'" aria-pressed="'+(D.type===k)+'" aria-checked="'+(D.type===k)+'"><span class="ic" style="background:'+v.c+'">'+v.i+'</span><span><b>'+v.t+'</b><span>'+v.d+'</span></span></button>').join('')+'</div>';
  if(D.type==='temp')h+='<div class="more"><div style="font-weight:600;font-size:15px">למה המורה המקורי/ת לא מלמד/ת?</div><div class="pills">'+REASONS.map(r=>'<button type="button" data-act="reason" data-v="'+r+'" aria-pressed="'+(D.reason===r)+'">'+r+'</button>').join('')+'</div><label>עד מתי? (אם ידוע)<input type="text" data-f="until" value="'+esc(D.until||'')+'" placeholder="למשל: עד חנוכה, עד 10.12, לא ידוע"></label></div>';
  if(D.type==='fix')h+='<div class="more"><label>מה המקצוע הנכון?<input type="text" data-f="subj" value="'+esc(D.subj||'')+'"></label><label>מי המורה הנכון/ה?<input type="text" data-f="teacher" value="'+esc(D.teacher||'')+'"></label></div>';
  h+='<label style="font-weight:600;font-size:15px;display:flex;flex-direction:column;gap:4px">הערות (לא חובה)<textarea data-f="note">'+esc(D.note||'')+'</textarea></label>';
  if(sim.length&&D.type)h+='<label class="check"><input type="checkbox" data-f="all" '+(D.all?'checked':'')+'> להחיל את אותה החלטה גם על עוד '+sim.length+' שינויים דומים ('+esc(c.old.map(x=>x[2]).join(', ')||'ריק')+' ← '+esc(c.new.map(x=>x[2]).join(', ')||'ריק')+')</label>';
  h+='</div><div class="mfoot"><button class="btn ok" data-act="save"'+(D.type?'':' disabled style="opacity:.5"')+'>שמירה'+(S.dec[c.key]?'':' והבא בתור')+'</button><button class="btn sec" data-act="close2">ביטול</button>'+(S.dec[c.key]?'<button class="btn sec" data-act="clear">מחיקת ההחלטה</button>':'')+'</div></div></div>';
  return h;
}
function sumData(){
  const tal=[],smart=[],tool=[],check=[],keep=[],open=[];
  for(const c of CH){const d=S.dec[c.key],where=clsShort(c.cls)+' · '+DAYS[c.day]+' שעה '+c.hour;
    if(!d){open.push(where);continue}
    const note=d.note?' (הערה: '+d.note+')':'';
    if(d.type==='keep')keep.push(where+': '+lesList(c.new));
    if(d.type==='revert')tal.push(where+': להחזיר ל־'+lesList(c.old)+' (עכשיו: '+lesList(c.new)+')'+note);
    if(d.type==='fix')tal.push(where+': לשנות ל־'+(d.subj||'?')+' · '+(d.teacher||'?')+' (עכשיו: '+lesList(c.new)+')'+note);
    if(d.type==='temp'){
      tal.push(where+': להחזיר את המורה המקורי/ת: '+lesList(c.old)+' (עכשיו: '+lesList(c.new)+')'+note);
      const sub=c.new.map(x=>x[2]).join(', '),org=c.old.map(x=>x[2]).join(', ');
      const extra=[d.reason,d.until?'עד '+d.until:''].filter(Boolean).join(', ');
      smart.push(where+': לרשום מילוי מקום של '+sub+' במקום '+org+(extra?' ('+extra+')':''));
      tool.push(where+': '+sub+' ממלא/ת מקום קבוע של '+org+(extra?' ('+extra+')':''));}
    if(d.type==='check')check.push(where+': '+lesList(c.old)+' ← '+lesList(c.new)+note);}
  return {tal,smart,tool,check,keep,open};
}
function sumText(){const s=sumData(),sec=(t,a)=>a.length?['*'+t+'*',...a.map(x=>'• '+x),'']:[];
  return ['*בדיקת שינויים במערכת השעות* (בדקה: '+(S.me||'')+')','',...sec('לתקן בתלמ"ש',s.tal),...sec('לעדכן בסמארטסקול',s.smart.concat(s.tal.length?['אחרי התיקונים בתלמ"ש: לוודא שהמערכת בסמארטסקול התעדכנה']:[])),...sec('לרשום בכלי מילוי המקום',s.tool),...sec('לברר',s.check),
   ...(s.open.length?['*עדיין בלי החלטה:* '+s.open.length,'']:[]),'השינויים שנשארים כמו שהם: '+s.keep.length].join('\n')}
function summaryHtml(){const s=sumData();
  const sec=(t,col,a,empty)=>'<h3><span class="dot" style="background:'+col+'"></span>'+t+' ('+a.length+')</h3>'+(a.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<div class="none">'+empty+'</div>');
  return '<div class="overlay" data-act="close"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mh"><div class="mhead" id="mh">סיכום: מה לתקן</div><div class="mbody sum">'+
   (s.open.length?'<div class="check">עדיין '+s.open.length+' שינויים בלי החלטה. אפשר לשלוח עכשיו ולהשלים אחר כך.</div>':'<div class="check" style="background:var(--green-bg)">כל השינויים טופלו. כל הכבוד!</div>')+
   sec('לתקן בתלמ"ש','#c77700',s.tal,'אין מה לתקן')+
   sec('לעדכן בסמארטסקול','#2f7fd6',s.smart.concat(s.tal.length?['אחרי התיקונים בתלמ"ש: לוודא שהמערכת בסמארטסקול התעדכנה']:[]),'אין מה לעדכן')+
   sec('לרשום בכלי מילוי המקום (אריאל מטפל)','#4a8ec9',s.tool,'אין')+
   sec('לברר','#5b6878',s.check,'אין')+
   '<div class="muted">שינויים שנשארים כמו שהם: '+s.keep.length+'</div></div>'+
   '<div class="mfoot"><a class="btn ok" target="_blank" rel="noopener" href="https://wa.me/'+ARIEL+'?text='+encodeURIComponent(sumText())+'">שליחה לאריאל בוואטסאפ</a><button class="btn sec" data-act="copy">העתקה</button><button class="btn sec" data-act="print">הדפסה</button><button class="btn sec" data-act="close2">סגירה</button></div></div></div>'}

function open(k){S.modal=k;const d=S.dec[k]||{};S.draft={type:d.type||null,reason:d.reason||'',until:d.until||'',subj:d.subj||'',teacher:d.teacher||'',note:d.note||'',all:false};
  const c=byKey[k];if(c&&S.cls!==c.cls)S.cls=c.cls;render()}
function nextOpen(after){const i=after?CH.findIndex(c=>c.key===after):-1;const r=CH.slice(i+1).concat(CH.slice(0,i+1)).find(c=>!S.dec[c.key]);return r}
async function save(){const c=byKey[S.modal],D=S.draft;const v={type:D.type};
  if(D.type==='temp'){v.reason=D.reason;v.until=D.until}if(D.type==='fix'){v.subj=D.subj;v.teacher=D.teacher}if(D.note)v.note=D.note;
  const keys=[c.key].concat(D.all?similar(c).map(x=>x.key):[]);const was=!!S.dec[c.key];
  try{for(const k of keys){await rpc('milui_review_save',{p_phone:S.phone,p_review:REVIEW,p_key:k,p:v});S.dec[k]=v}}catch(e){return err(e)}
  toast(keys.length>1?'נשמר ל־'+keys.length+' שינויים':'נשמר');
  const n=!was&&nextOpen(c.key);if(n)open(n.key);else{S.modal=null;render()}}
function err(e){if(e.message==='no_access'){S.phone=null;try{localStorage.removeItem('milui_phone')}catch(x){};S.err='המספר הזה לא מורשה להיכנס.';render()}else toast('משהו לא הצליח. בדקו חיבור ונסו שוב.')}
async function load(){try{const r=await rpc('milui_review_get',{p_phone:S.phone,p_review:REVIEW});S.me=r.me;S.dec={};Object.entries(r.items||{}).forEach(([k,v])=>S.dec[k]=v);render()}catch(e){err(e)}}

root.addEventListener('submit',async e=>{e.preventDefault();const ph=root.querySelector('#ph').value;
  try{const n=await rpc('milui_login',{p_phone:ph});if(!n){S.err='המספר הזה לא מורשה להיכנס.';render();return}S.phone=ph;S.err='';try{localStorage.setItem('milui_phone',ph)}catch(x){};await load()}catch(x){S.err='אין חיבור לשרת. נסו שוב.';render()}});
root.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  switch(a){
   case 'cls':S.cls=b.dataset.c;render();break;
   case 'all':S.showAll=!S.showAll;render();break;
   case 'open':open(b.dataset.k);break;
   case 'next':{const n=nextOpen();if(n)open(n.key);else{S.modal='summary';render()}break}
   case 'first':{const f=CH[0];S.cls=f.cls;render();window.scrollTo({top:0,behavior:'smooth'});break}
   case 'summary':S.modal='summary';render();break;
   case 'close':if(e.target!==b)return;S.modal=null;render();break;
   case 'close2':S.modal=null;render();break;
   case 'type':S.draft.type=b.dataset.v;render();break;
   case 'reason':S.draft.reason=S.draft.reason===b.dataset.v?'':b.dataset.v;render();break;
   case 'save':if(S.draft.type)save();break;
   case 'clear':{const k=S.modal;try{await rpc('milui_review_save',{p_phone:S.phone,p_review:REVIEW,p_key:k,p:null});delete S.dec[k];S.modal=null;render();toast('ההחלטה נמחקה')}catch(x){err(x)}break}
   case 'copy':try{await navigator.clipboard.writeText(sumText());toast('הסיכום הועתק')}catch(x){toast('לא הצלחתי להעתיק')}break;
   case 'print':window.print();break;
  }});
root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('td.chg')){e.preventDefault();open(e.target.dataset.k)}if(e.key==='Escape'&&S.modal){S.modal=null;render()}});
root.addEventListener('input',e=>{const f=e.target.dataset.f;if(f&&S.draft&&f!=='all')S.draft[f]=e.target.value});
root.addEventListener('change',e=>{if(e.target.dataset.f==='all')S.draft.all=e.target.checked});
render();if(S.phone)load();
</script>
</body>
</html>
