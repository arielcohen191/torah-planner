<style>
:root{--ground:#eef1f5;--card:#fff;--card-muted:#f5f7fa;--line:#dfe4ea;--ink:#1f2a37;--ink-muted:#5b6878;--rail:#26323f;--rail-ink:#c9d3de;
--brand:#2f7fd6;--brand-dark:#1f5fa6;--blue:#4a8ec9;--green:#4f9a2a;--green-ink:#3f7d21;--orange:#c77700;--orange-ink:#a56300;--red:#c62a20;--purple:#7a5cc0;--active:#2fbf71;
--r-sm:6px;--r-md:10px;--r-lg:14px;--shadow:0 1px 3px rgba(31,42,55,.10)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:Heebo,Assistant,system-ui,sans-serif;font-size:17px;line-height:1.5}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}
.app{display:flex;min-height:100vh}
nav.rail{flex:0 0 112px;background:var(--rail);display:flex;flex-direction:column;gap:6px;padding:24px 8px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.rail .brand{color:#fff;font-weight:700;font-size:15px;text-align:center;padding-bottom:16px;border-bottom:1px solid #3a4756;margin-bottom:4px;line-height:1.3}
.rail button.brand{display:block;color:#fff;font-weight:700;font-size:15px;padding:0 0 16px;border-radius:0;cursor:pointer}.rail button.brand:hover{background:none;color:#cfe6fb}
.rail .brand small{display:block;font-weight:400;color:var(--rail-ink);font-size:13px}
/* לוגו כנפי רוח: בסרגל (מחשב), בכותרת העמוד (טלפון, שם הסרגל מוסתר) ובמסך הכניסה */
.rail .brand img{display:block;width:72px;height:72px;margin:0 auto 8px;background:#fff;border-radius:16px;padding:4px;box-sizing:border-box;object-fit:contain}
.tlogo{display:none;float:right;width:46px;height:46px;margin-left:10px;object-fit:contain}
.llogo{display:block;width:96px;height:96px;margin:0 auto 4px;object-fit:contain}
@media (max-width:760px){.tlogo{display:block}}
.rail button{background:none;border:0;font:inherit;width:100%}
.rail a,.rail button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 4px;border-radius:var(--r-md);color:var(--rail-ink);font-size:14px;text-decoration:none;text-align:center;line-height:1.25}
.rail a:hover,.rail button:hover{background:#31404f;color:#fff}
.rail button[aria-current="page"]{background:var(--active);color:#fff;font-weight:600}
.rail .spacer{flex:1}
.tls{display:flex;flex-wrap:wrap;gap:6px}.tl{display:inline-flex;align-items:center;min-height:32px;padding:3px 12px;border-radius:999px;font:inherit;font-size:14px;border:1.5px solid;line-height:1.3}
.tl.ok{background:#e7f4e1;border-color:#9cc98a;color:#2f5d22}.tl.pilot{background:#e3eefb;border-color:#8db4e6;color:#1d4f8c}.tl.off{background:#f2f4f7;border-color:#cfd6df;color:#5b6878;border-style:dashed}
button.tl{cursor:pointer}button.tl:hover{filter:brightness(.96)}
.lrow{display:flex;flex-direction:column;gap:10px;padding:12px 14px}.lh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.lh svg{width:22px;height:22px}.lh b{font-size:18px}.lh .small{flex:1}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;background:#fff;font:inherit;font-size:15px;padding:8px 14px;min-height:40px;cursor:pointer}.seg button+button{border-inline-start:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--active);color:#fff;font-weight:600}.seg button[disabled]{cursor:default;opacity:.7}
.lrow select{font:inherit;font-size:15px;padding:6px 10px;border:1.5px solid var(--line);border-radius:999px;min-height:34px}
.trail{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-bottom:-12px;font-size:15px}.trail button{border:0;background:none;font:inherit;color:var(--blue-ink,#1d5fa8);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 2px;min-height:36px}.trail .sep{color:var(--ink-muted)}.trail b{font-weight:600}
.tstrip{position:sticky;top:0;z-index:6;display:flex;gap:8px;overflow-x:auto;padding:10px 2px;margin:-10px 0 -12px;background:var(--ground);animation:tshrink .28s ease-out}
.tchip{flex:none;display:flex;align-items:center;gap:8px;border:0;border-radius:12px;color:#fff;font:inherit;font-size:15px;padding:6px 14px;min-height:46px;cursor:pointer;white-space:nowrap;opacity:.82}
.tchip b{font-size:24px;font-weight:300}.tchip[aria-pressed="true"]{opacity:1;font-weight:600;outline:3px solid #1f2a37;outline-offset:2px;order:-1}.tchip .x{font-size:13px;opacity:.85}
.tchip:hover{opacity:1}.wfocus{animation:wgrow .28s ease-out}.wfull .gotile{margin-top:10px}
@keyframes tshrink{from{transform:scaleY(1.6);opacity:.5}to{transform:none;opacity:1}}@keyframes wgrow{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.tstrip,.wfocus{animation:none}}
.tabbar,.sheet,.sheet-bg{display:none}
.navf{border-radius:var(--r-md)}.navf summary{list-style:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 4px;border-radius:var(--r-md);color:var(--rail-ink);font-size:14px;text-align:center;cursor:pointer;line-height:1.25}
.navf summary::-webkit-details-marker{display:none}.navf summary:hover{background:#31404f;color:#fff}.navf summary::after{content:'▾';font-size:11px;opacity:.7}.navf[open] summary::after{content:'▴'}
.navf[open]{background:#2b3846}.navf>button{font-size:13px;padding:8px 4px}
.navlist{display:flex;flex-direction:column;gap:6px}.navrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.navrow .nm{display:flex;align-items:center;gap:8px;flex:1;min-width:140px}.navrow .nm svg{width:20px;height:20px}.navrow.in{margin-inline-start:28px;background:#f7f9fc}.navrow select{font:inherit;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;min-height:36px}#navNewF{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;min-height:40px}
.rail .who{color:var(--rail-ink);font-size:13px;text-align:center}
main{flex:1;min-width:0;padding:24px 32px 48px;display:flex;flex-direction:column;gap:24px}
.card{background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow)}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px}
h1{margin:0;font-size:26px;line-height:34px;font-weight:700}

.muted{color:var(--ink-muted)}

.btn:hover{background:var(--brand-dark)}

.eform{padding:20px;display:flex;flex-direction:column;gap:14px;border:2px solid var(--brand)}
.rform{gap:10px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.frow label{display:flex;flex-direction:column;gap:4px;font-size:15px;font-weight:600}
.frow input,.frow select{min-height:46px;border:1.5px solid #c9d1db;border-radius:var(--r-md);padding:0 12px;font-size:16px;font-weight:400;background:#fff;width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}

.prow{gap:8px}

.whead>span:first-child{display:flex;flex-direction:column;gap:2px}.whead b{font-size:19px;font-weight:600}.whead .small{opacity:.9;text-decoration:underline;text-underline-offset:3px}

.wbody{padding:6px 16px 12px;display:flex;flex-direction:column}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}

.rail .cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:700;line-height:20px;text-align:center}
.rchips{display:flex;flex-wrap:wrap;gap:6px}

.ritem{padding:0}
.ritem>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;min-height:56px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}

.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(31,42,55,.18)}
.kpi[aria-pressed="true"]{outline:4px solid #1f2a37;outline-offset:2px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi:focus-visible,.gotile:focus-visible,.task:focus-visible,.rail button:focus-visible,.btn:focus-visible{outline:3px solid #1f2a37;outline-offset:2px}
.kpi b{display:block;font-size:20px;font-weight:600}.kpi span{display:block;font-size:15px}
.kpi .go{font-size:13px;opacity:.9;margin-top:6px;text-decoration:underline;text-underline-offset:3px}
.kpi .n{font-size:64px;line-height:64px;font-weight:200}
.k-red{background:var(--red)}.k-orange{background:var(--orange)}.k-green{background:var(--green)}.k-blue{background:var(--blue)}.k-purple{background:var(--purple)}
.banner{padding:14px 24px;border-right:6px solid var(--orange);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
.tool{display:flex;flex-direction:column;overflow:hidden}
.tool.span2{grid-column:1/-1}
.thead{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--brand);color:#fff;padding:12px 20px;text-decoration:none}

.tbody{padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px}

const isLesson=s=>s.kind==='שיעור'||s.kind==='שיעור משותף';
function absOn(date){return S.milui.absences.filter(a=>a.date_from<=date&&(!a.date_to||a.date_to>=date))}
function openItems(date){
  if(holiday(date))return[];
  const out=[],d=dow(date);
  for(const a of absOn(date))for(const s of (S.milui.byTD[a.teacher_id+'|'+d]||[])){
    if(!isLesson(s))continue;if(a.hours&&!a.hours.includes(s.hour))continue;if(!s.classes.some(clsIn))continue;
    const x=S.milui.assignments.find(x=>x.date===date&&x.slot_id===s.id);
    out.push({slot:s,abs:a,status:x?(x.status==='asking'?'asking':'done'):'open'});
  }
  return out.sort((p,q)=>p.slot.hour-q.slot.hour);
}
function absHouse(date){if(!H())return absOn(date);const it=openItems(date);return absOn(date).filter(a=>it.some(i=>i.abs.id===a.id))}
function payUndone(){
  if(H())return 0;
  const m=monthStart(S.date),e=monthEnd(S.date),t=today();

function torAbsent(date){
  const d=S.tor.data||{},out={};
  /* היעדרות יומית או חלקית: בכלי התורנויות ההחלפה שלה באחריות המורה הנעדר, ולכן היא מסומנת daily */
  (S.tor.abs||[]).filter(a=>a.from<=date&&(!a.to||a.to>=date)).forEach(a=>{
    const s=(d.staff||[]).find(x=>x.tt===a.name);if(!s)return;
    const v={key:'m'+a.id,hours:a.hours||null,daily:!!a.hours||(!!a.to&&a.to===a.from)};
    if(!out[s.id]||(out[s.id].daily&&!v.daily))out[s.id]=v});
  (d.absLocal||[]).forEach(a=>{if(a.from<=date&&(!a.to||a.to>=date))out[a.staffId]={key:'l'+a.id,hours:null,daily:!!a.to&&a.to===a.from}});
  return out;
}
function torDay(date){
  const T=window.Toranut,d=S.tor.data||{},plan=d.plan||{},A=plan.assign||{},subs=plan.subs||{},day=dow(date);
  const P={};(d.staff||[]).forEach(s=>P[s.id]=s);
  const abs=torAbsent(date),shifts=[],stIdx={},Y=d.yards||T.DEFAULT_CONFIG.yards||{},hs=H();
  T.DEFAULT_CONFIG.stations.forEach((s,i)=>stIdx[s.id]=i);
  let missing=0,missingLong=0,total=0;
  T.DEFAULT_CONFIG.shifts.forEach(sh=>{
    const rows=Object.keys(A).filter(k=>{const p=k.split('@');return p[0]===sh.id&&+p[1]===day}).sort((a,b)=>(stIdx[a.split('@')[2]]||0)-(stIdx[b.split('@')[2]]||0)).map(k=>{
      const st=T.DEFAULT_CONFIG.stations.find(x=>x.id===k.split('@')[2]),sid=A[k],p=P[sid];
      const row={station:st?st.name.split(' (')[0]:k.split('@')[2],name:p?p.name:'—',gone:false,sub:null};
      if(hs){const L=st?[...(st.layer?[st.layer]:[]),...(st.yard?layerLetters(((Y[sh.id]||{})[st.yard]||[])[day]):[])]:[];if(!L.some(x=>hs.layers.includes(x)))return null}
      total++;
      const ab=abs[sid],at=(day===5&&sh.fri)||sh.after;
      const need=sh.kind==='morning'?[1]:sh.kind==='break'?[at,at+1]:[at];
      if(ab&&(!ab.hours||need.every(x=>ab.hours.includes(x)))){const v=subs[k];row.gone=true;row.daily=!!ab.daily;if(v&&v.abs===ab.key&&P[v.id])row.sub=P[v.id].name;else{missing++;if(!ab.daily)missingLong++}}
      return row}).filter(Boolean);
    if(rows.length)shifts.push({label:sh.label,rows});
  });
  return {shifts,missing,missingLong,total,stale:!hs&&!!plan.stale,open:hs?0:(plan.stats||{}).open||0,ran:!!plan.at};
}

function navModel(){const vis=navViews(),keys=vis.map(v=>v[0]),lab=k=>(vis.find(v=>v[0]===k)||[])[1],used=new Set(),out=[];
  (pref().nav||[]).forEach(e=>{if(typeof e==='string'){if(keys.includes(e)&&!used.has(e)){used.add(e);out.push({k:e,l:lab(e)})}}
    else if(e&&e.f){const it=(e.items||[]).filter(k=>keys.includes(k)&&!used.has(k));it.forEach(k=>used.add(k));out.push({f:e.f,items:it.map(k=>({k,l:lab(k)}))})}});
  const fresh=keys.filter(k=>!used.has(k)).map(k=>({k,l:lab(k)})),fi=out.findIndex(e=>e.f);
  if(fi<0)out.push(...fresh);else out.splice(fi,0,...fresh);return out}
