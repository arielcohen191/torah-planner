.duty{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:15px;border-bottom:1px dashed var(--line)}

.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:8px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .card{width:100%;max-width:440px;padding:32px;display:flex;flex-direction:column;gap:16px}
input[type=tel]{min-height:56px;border:1.5px solid #c9d1db;border-radius:var(--r-md);padding:0 16px;font-size:18px;background:#fff;width:100%}

.tt td b{display:block;font-weight:600;font-size:14px}.tt td span{display:block;color:var(--ink-muted);font-size:12px}

.tl{display:flex;flex-direction:column;gap:8px}

.tli .when{font-weight:600;color:var(--ink-muted);font-size:15px}.tli .what b{font-size:17px;font-weight:600}
.tli.lesson{border-right-color:var(--blue)}.tli.duty{border-right-color:var(--purple)}.tli.cover{border-right-color:var(--orange)}.tli.off{opacity:.75}.tli.gone{border-right-color:var(--red)}
.mygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
 .app{flex-direction:column}
 nav.rail{flex:none;flex-direction:row;align-items:center;overflow-x:auto;padding:8px;padding-top:calc(8px + env(safe-area-inset-top,0px));gap:4px}
 .rail .brand{border:0;margin:0;padding:0 8px;white-space:nowrap}.rail .brand small{display:none}
 .rail button{flex:none;width:auto;flex-direction:row;padding:8px 12px;white-space:nowrap}.rail button svg{width:20px;height:20px}
 .rail .spacer{display:none}.rail .who{white-space:nowrap;padding:0 8px}.rail .who br{display:none}
 main{padding:16px 12px 40px;gap:16px}
 .topbar{padding:14px 16px}h1{font-size:22px;line-height:28px}
 .kpis{gap:10px}.kpi{min-height:96px;padding:14px 16px}.kpi .n{font-size:46px;line-height:46px}.kpi b{font-size:17px}
 .kpis.k3{grid-template-columns:minmax(0,1fr)}.kpis.k3 .kpi{min-height:76px}
 .gotile{padding:14px 16px}.gotile b{font-size:18px}.task{flex-direction:column;align-items:flex-start;gap:4px}
}
</style>

<script>
'use strict';
const CFG={url:'https://onocjgbtensczpdbeanf.supabase.co',key:'sb_publishable_JpV-E-qPnV9ZdnRnY9Kv8Q_TaRzCnyc'};
async function rpc(fn,args){
  const r=await fetch(CFG.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const m=(j&&j.message)||t;throw new Error(/no_access/.test(m)?'no_access':m)}
  return j;
}
const DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const dow=s=>parse(s).getDay();
const monthStart=s=>s.slice(0,8)+'01';
const monthEnd=s=>{const d=parse(s);return iso(new Date(d.getFullYear(),d.getMonth()+1,0))};
const fmtFull=d=>'יום '+DAYS[dow(d)]+', '+parse(d).getDate()+'.'+(parse(d).getMonth()+1)+'.'+parse(d).getFullYear();
const fmtWhen=t=>{if(!t)return '';const d=new Date(t);return d.getDate()+'.'+(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cls=c=>String(c).replace(/' /g,'׳');
const greet=n=>/^הרב\s/.test(n)?'שלום הרב '+String(n).replace(/^הרב\s+/,'').split(' ')[0]:'שלום '+String(n).split(' ')[0];
/* במערכת השעות השמות הם "משפחה פרטי" ("הרב רדלר נתנאל") */
const greetT=n=>{const r=/^הרב\s/.test(n),w=String(n).replace(/^הרב\s+/,'').split(/\s+/);return 'שלום '+(r?'הרב ':'')+(w[1]||w[0])};
const HOL=[['2026-12-06','2026-12-11','חופשת חנוכה'],['2027-03-23','2027-03-24','פורים'],['2027-04-13','2027-04-28','חופשת פסח'],['2027-05-12','2027-05-12','יום העצמאות'],['2027-05-25','2027-05-25','ל״ג בעומר'],['2027-06-10','2027-06-11','שבועות']];
function holiday(s){
  for(const h of HOL)if(s>=h[0]&&s<=h[1])return h[2];
  for(const h of (S.hol||[]))if(h&&h.from&&h.off!==false&&String(h.off)!=='false'&&s>=h.from&&s<=(h.to||h.from))return h.name||h.title||'חופשה';
  return dow(s)===6?'שבת':null;
}
/* בתים: כל שתי שכבות הן בית. מי שהתפקיד שלו "לפי שכבות" נכנס ישר לשכבות שלו, ויכול לעבור לבתים אחרים. */
const HOUSES=[{id:'ab',label:'בית א׳–ב׳',layers:['א','ב']},{id:'gd',label:'בית ג׳–ד׳',layers:['ג','ד']},{id:'hv',label:'בית ה׳–ו׳',layers:['ה','ו']}];
const sameSet=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
const myHouse=()=>{const L=(S.user&&S.user.layers)||[];if(!L.length)return 'all';const h=HOUSES.find(h=>sameSet(h.layers,L));return h?h.id:'mine'};
const H=()=>S.house==='mine'?{id:'mine',label:'השכבות שלי',layers:S.user.layers}:HOUSES.find(h=>h.id===S.house)||null;
const allowed=k=>!!(S.user&&S.user.tools.includes(k));
const isDev=()=>!!(S.user&&(S.user.roles||[]).some(r=>r.id==='sysadmin'));
const isStaff=()=>!!(S.user&&(S.user.staff||S.user.tools.length));
const canSee=v=>v==='my'||(v==='home'||v==='prefs'?isStaff():false)||(v==='perms'?!!(S.user&&S.user.can_manage):v==='feedback'?isDev():allowed(v));
const clsIn=c=>{const h=H();return !h||h.layers.includes(String(c).trim()[0])};
const layerLetters=t=>{t=String(t||'');const m=t.match(/\(([^)]+)\)/);return ((m?m[1]:t).match(/[א-ו]/g))||[]};
const SUBJ={torah:'חומש',navi:'נביא',mishna:'משנה',gemara:'גמרא',halacha:'הלכה',math:'מתמטיקה',hebrew:'עברית',science:'מדעים',other:'אחר'};
const hourNum=h=>{const m=String(h||'').match(/\d+/);return m?+m[0]:0};
const plural=(n,one,many)=>n===1?one:n+' '+many;

const S={view:'home',filter:0,house:null,phone:null,user:null,date:null,milui:null,dataMonth:null,tor:null,say:null,mk:null,plans:null,hol:null,classes:[],staffN:null,admin:null,edit:null,err:{},busy:false};
try{S.phone=localStorage.getItem('hanhala_phone')||localStorage.getItem('milui_phone')}catch(e){}
const root=document.getElementById('root');
function schoolDay(s){let d=s;for(let i=0;i<7&&dow(d)===6;i++)d=addDays(d,1);return d}
S.date=schoolDay(today());
const hashView=()=>{const k=location.hash.slice(1);return ['my','milui','toranut','sayarot','mapat','hespek','prefs','perms','feedback'].includes(k)?k:'home'};

/* ---------- טעינה: כל כלי בנפרד, כדי שתקלה באחד לא תפיל את הלוח ---------- */
async function part(key,fn){try{delete S.err[key];await fn()}catch(e){if(e.message==='no_access')throw e;console.error(key,e);S.err[key]=true}}
async function loadData(){
  const m=monthStart(S.date);
  if(S.user&&S.dataMonth===m)return;
  const r=await rpc('hanhala_data',{p_phone:S.phone,p_from:addDays(m,-7),p_to:addDays(monthEnd(S.date),7)});
  S.user=r.me;S.classes=r.classes||[];S.staffN=r.staff_n;
  if(r.milui){const d=r.milui;
    d.T={};d.teachers.forEach(t=>d.T[t.id]=t);
    d.slots=d.slots.map(a=>({id:a[0],tid:a[1],day:a[2],hour:a[3],kind:a[4],subject:a[5]||'',classes:a[6]||[]}));
    d.byTD={};d.SL={};d.slots.forEach(s=>{d.SL[s.id]=s;(d.byTD[s.tid+'|'+s.day]=d.byTD[s.tid+'|'+s.day]||[]).push(s)});
    S.milui=d}else S.milui=null;
  S.tor=r.tor?{data:{staff:r.tor.staff,plan:r.tor.plan,yards:r.tor.yards,absLocal:r.tor.absLocal},abs:r.tor.abs||[],updated_at:r.tor.updated_at,updated_by:r.tor.updated_by}:null;
  S.mk=r.mk||null;S.dataMonth=m;
  if(!S.house){const ph=pref().house;S.house=(ph==='all'||HOUSES.some(h=>h.id===ph)||(ph==='mine'&&S.user.layers.length))?ph:myHouse()}
  if(S.house==='mine'&&!S.user.layers.length)S.house='all';
  if(!canSee(S.view))S.view=isStaff()?'home':'my';
}
async function loadAll(force){
  if(force){S.dataMonth=null;S.say=null;S.plans=null;S.myMonth=null}
  try{delete S.err.milui;delete S.err.tor;delete S.err.mk;delete S.err.data;await loadData()}
  catch(e){if(e.message==='no_access')throw e;console.error('data',e);S.err.data=S.err.milui=S.err.tor=S.err.mk=true}
  await Promise.all([
    S.myMonth===monthStart(S.date)?null:part('my',async()=>{const m=monthStart(S.date);S.my=await rpc('hanhala_my',{p_phone:S.phone,p_from:addDays(m,-7),p_to:addDays(monthEnd(S.date),7)});S.myMonth=m}),
    S.say||!allowed('sayarot')?null:part('say',async()=>{const r=await rpc('get_sayarot');S.say=(r&&r.data)||{}}),
    S.plans||!allowed('hespek')?null:part('plans',async()=>{S.plans=await rpc('list_plans',{code:'x'})||[]}),
    S.hol?null:part('hol',async()=>{const r=await rpc('get_settings',{code:'x'});S.hol=(r&&r.holidays)||[]})
  ]);
  if(!allowed('sayarot'))S.say=null;if(!allowed('hespek'))S.plans=null;
  if(S.view==='perms'&&S.user&&S.user.can_manage&&!S.admin)await loadAdmin();
  if(isDev()){await part('fb',async()=>{S.fbOpen=await rpc('hanhala_feedback_open',{p_phone:S.phone})});if(S.view==='feedback')await loadFb()}
  S.loadedAt=new Date();
}

/* ---------- מילוי מקום (אותו חישוב כמו בלוח היום של הכלי) ---------- */
const isLesson=s=>s.kind==='שיעור'||s.kind==='שיעור משותף';
function absOn(date){return S.milui.absences.filter(a=>a.date_from<=date&&(!a.date_to||a.date_to>=date))}
function openItems(date){
  if(holiday(date))return[];
  const out=[],d=dow(date);
  for(const a of absOn(date))for(const s of (S.milui.byTD[a.teacher_id+'|'+d]||[])){
    if(!isLesson(s))continue;if(a.hours&&!a.hours.includes(s.hour))continue;if(!s.classes.some(clsIn))continue;
    const x=S.milui.assignments.find(x=>x.date===date&&x.slot_id===s.id);
    out.push({slot:s,abs:a,status:x?(x.status==='asking'?'asking':'done'):'open'});
  }
  return out.sort((p,q)=>p.slot.hour-q.slot.hour);
}
function absHouse(date){if(!H())return absOn(date);const it=openItems(date);return absOn(date).filter(a=>it.some(i=>i.abs.id===a.id))}
function payUndone(){
  if(H())return 0;
  const m=monthStart(S.date),e=monthEnd(S.date),t=today();
  return S.milui.assignments.filter(x=>x.status==='assigned'&&x.substitute_id&&x.date>=m&&x.date<=e&&x.date<=t&&!x.comp_done).length;
}

/* ---------- תורנויות חצר ---------- */
function torAbsent(date){
  const d=S.tor.data||{},out={};
  /* היעדרות יומית או חלקית: בכלי התורנויות ההחלפה שלה באחריות המורה הנעדר, ולכן היא מסומנת daily */
  (S.tor.abs||[]).filter(a=>a.from<=date&&(!a.to||a.to>=date)).forEach(a=>{
    const s=(d.staff||[]).find(x=>x.tt===a.name);if(!s)return;
    const v={key:'m'+a.id,hours:a.hours||null,daily:!!a.hours||(!!a.to&&a.to===a.from)};
    if(!out[s.id]||(out[s.id].daily&&!v.daily))out[s.id]=v});
  (d.absLocal||[]).forEach(a=>{if(a.from<=date&&(!a.to||a.to>=date))out[a.staffId]={key:'l'+a.id,hours:null,daily:!!a.to&&a.to===a.from}});
  return out;
}
function torDay(date){
  const T=window.Toranut,d=S.tor.data||{},plan=d.plan||{},A=plan.assign||{},subs=plan.subs||{},day=dow(date);
  const P={};(d.staff||[]).forEach(s=>P[s.id]=s);
  const abs=torAbsent(date),shifts=[],stIdx={},Y=d.yards||T.DEFAULT_CONFIG.yards||{},hs=H();
  T.DEFAULT_CONFIG.stations.forEach((s,i)=>stIdx[s.id]=i);
  let missing=0,missingLong=0,total=0;
  T.DEFAULT_CONFIG.shifts.forEach(sh=>{
    const rows=Object.keys(A).filter(k=>{const p=k.split('@');return p[0]===sh.id&&+p[1]===day}).sort((a,b)=>(stIdx[a.split('@')[2]]||0)-(stIdx[b.split('@')[2]]||0)).map(k=>{
      const st=T.DEFAULT_CONFIG.stations.find(x=>x.id===k.split('@')[2]),sid=A[k],p=P[sid];
      const row={station:st?st.name.split(' (')[0]:k.split('@')[2],name:p?p.name:'—',gone:false,sub:null};
      if(hs){const L=st?[...(st.layer?[st.layer]:[]),...(st.yard?layerLetters(((Y[sh.id]||{})[st.yard]||[])[day]):[])]:[];if(!L.some(x=>hs.layers.includes(x)))return null}
      total++;
      const ab=abs[sid],at=(day===5&&sh.fri)||sh.after;
      const need=sh.kind==='morning'?[1]:sh.kind==='break'?[at,at+1]:[at];
      if(ab&&(!ab.hours||need.every(x=>ab.hours.includes(x)))){const v=subs[k];row.gone=true;row.daily=!!ab.daily;if(v&&v.abs===ab.key&&P[v.id])row.sub=P[v.id].name;else{missing++;if(!ab.daily)missingLong++}}
      return row}).filter(Boolean);
    if(rows.length)shifts.push({label:sh.label,rows});
  });
  return {shifts,missing,missingLong,total,stale:!hs&&!!plan.stale,open:hs?0:(plan.stats||{}).open||0,ran:!!plan.at};
}

/* ---------- סיירות ---------- */
function sayDay(date){
  const d=S.say||{},stu={};(d.students||[]).forEach(s=>stu[s.id]=s.name);
  const pat=id=>(d.patrols||[]).find(p=>p.id===id)||{name:'סיירת',color:'#98a2b3'};
  return (d.outings||[]).filter(o=>o.date===date).sort((a,b)=>hourNum(a.hour)-hourNum(b.hour)).map(o=>{
    const p=pat(o.patrol),picks=o.picks||{};
    return {hour:o.hour||'',name:p.name,color:p.color,act:p.kind==='activity',done:!!o.done,
      groups:Object.keys(picks).filter(clsIn).map(c=>({cls:c,names:(picks[c]||[]).map(id=>stu[id]).filter(Boolean)}))};
  }).filter(o=>!H()||o.groups.length);
}

/* ---------- משימות לפי דחיפות (נגזרות אוטומטית מכל הכלים) ---------- */
const mkTotal=()=>S.classes.filter(clsIn).length;
function nextSchoolDay(d){let x=addDays(d,1);for(let i=0;i<30&&holiday(x);i++)x=addDays(x,1);return x}
function tasks(){
  const out=[],d=S.date,hol=holiday(d),add=(u,tool,title,sub)=>out.push({u,tool,title,sub});
  const dayWord=d===today()?'היום':'ביום '+DAYS[dow(d)];
  if(S.milui){
    const tn=i=>(S.milui.T[i.abs.teacher_id]||{}).name||'';
    const les=i=>'שעה '+i.slot.hour+' · '+(i.slot.subject||'שיעור')+' · '+i.slot.classes.map(cls).join(', ');
    openItems(d).forEach(i=>{
      if(i.status==='open')add(1,'milui','שיעור בלי מורה: '+les(i),'במקום '+tn(i)+' · צריך למצוא מחליף');
      else if(i.status==='asking')add(2,'milui','מחכים לתשובה ממחליף: '+les(i),'במקום '+tn(i));
    });
    const nd=nextSchoolDay(d),no=openItems(nd).filter(i=>i.status==='open');
    if(no.length){const names=[...new Set(no.map(tn))];add(2,'milui','ליום '+DAYS[dow(nd)]+' ('+shortDate(nd)+'): '+plural(no.length,'שיעור אחד','שיעורים')+' עדיין בלי מחליף','נעדרים: '+names.join(', '))}
    const pu=payUndone();if(pu)add(3,'milui',plural(pu,'מילוי מקום אחד מחכה','מילויי מקום מחכים')+' לתגמול','התחשבנות החודש עם ממלאי המקום');
  }
  if(S.tor&&window.Toranut){
    const td=torDay(d);
    if(!hol)td.shifts.forEach(sh=>sh.rows.forEach(r=>{if(r.gone&&!r.sub)add(r.daily?2:1,'toranut','תורנות בלי תורן: '+r.station,sh.label.split(' (')[0]+' · '+r.name+(r.daily?' נעדר/ת '+dayWord+' בלבד · ההחלפה באחריות המורה':' בהיעדרות ממושכת, אין מחליף רשום'))}));
    if(td.open)add(2,'toranut',plural(td.open,'עמדה אחת','עמדות')+' בלוח התורנויות השבועי בלי תורן','צריך לשבץ או להריץ שיבוץ מחדש');
    if(td.stale)add(3,'toranut','להריץ מחדש את שיבוץ התורנויות','הכללים או הצוות השתנו מאז ההרצה האחרונה');
    if(!td.ran&&!td.total)add(3,'toranut','עוד לא הורץ שיבוץ תורנויות','');
  }
  if(S.say&&!hol)sayDay(d).forEach(o=>{const e=o.groups.filter(g=>!g.names.length);
    if(e.length&&!o.done)add(2,'sayarot',o.name+' · '+o.hour+': עוד לא נבחרו תלמידים',e.map(g=>g.cls).join(', '))});
  if(S.mk){const m=S.mk,n=(m.classes_synced||[]).filter(c=>clsIn(c.name)).length,tot=mkTotal();
    if(n<tot)add(3,'mapat','מפת כיתה: יש נתונים רק ל־'+n+' מתוך '+tot+' כיתות','לקראת הישיבות הפדגוגיות · '+plural(m.q_filled,'שאלון צוות אחד מולא','שאלוני צוות מולאו'))}
  if(isDev()&&S.fbOpen)add(2,'feedback',plural(S.fbOpen,'משוב חדש אחד','משובים חדשים')+' מהצוות','תקלות, רעיונות ושאלות שנשלחו מכפתור המשוב');
  if(S.plans&&S.staffN&&!H()){const st=S.staffN;
    if(S.plans.length<st)add(3,'hespek','תוכניות הספק: '+S.plans.length+' מתוך '+st+' מורים שמרו תוכנית','')}
  return out.sort((a,b)=>a.u-b.u);
}
const URG={1:['דחוף','k-red','s-open','red'],2:['להיום','k-orange','s-asking','orange'],3:['למעקב','k-blue','s-info','grey']};

const WIDGETS=[['absent','מי נעדר היום','milui'],['open','שיעורים בלי מורה','milui'],['merged','שיעורים עם איחוד כיתות','milui'],['covered','מי מחליף את מי','milui'],
  ['duty','תורנים נעדרים','toranut'],['patrols','יציאות סיירות','sayarot'],['tasks','משימות לפי דחיפות',null]];

  return WIDGETS.filter(w=>ok(w)&&(w[0]==='tasks'||(['absent','open','merged'].includes(w[0]))))};
const slotTxt=s=>'שעה '+s.hour+' · '+s.classes.map(cls).join(', ')+(s.subject?' · '+s.subject:'');
const tName=id=>(S.milui&&S.milui.T[id]||{}).name||'';
function mergedItems(date){
  if(!S.milui||holiday(date))return[];const d=dow(date),out=[];
  S.milui.assignments.filter(x=>x.date===date).forEach(x=>{const s=S.milui.SL[x.slot_id];if(!s||!s.classes.some(clsIn))return;
    if(x.status==='other'&&/איחוד/.test(x.other_note||''))out.push({slot:s,with:'',who:'',note:x.other_note});
    else if(x.status==='assigned'&&x.substitute_id){const own=(S.milui.byTD[x.substitute_id+'|'+d]||[]).find(o=>o.hour===s.hour&&isLesson(o));
      if(own)out.push({slot:s,with:own.classes.map(cls).join(', '),who:tName(x.substitute_id)})}});
  return out.sort((a,b)=>a.slot.hour-b.slot.hour);

function widget(id){

  if(id==='merged'){const L=mergedItems(date);
    return wCard(id,'שיעורים עם איחוד כיתות','milui',L.length,L.length?'k-orange':'k-green',

function classToday(H,date){
  const day=dow(date),tabs=H.tabs||[];if(holiday(date))return[];
  return H.slots.filter(s=>s.day===day).map(s=>{const a=tabs.find(t=>t.name===s.teacher&&inRange(date,t)&&(!t.hours||t.hours.includes(s.hour)));if(!a)return null;
    const x=(H.absent||[]).find(x=>x.date===date&&x.slot_id===s.id);return {s,x}}).filter(Boolean);
}
const planName=p=>[SUBJ[p.subject]||p.subject,p.book].filter(Boolean).join(' · ');
const planCls=p=>{const c=String(p.cls||'');return c.length>1?cls(c):p.grade?p.grade+'׳'+c:''};
function viewMy(){
  if(S.err.my)return '<div class="note bad">הדף האישי לא נטען כרגע. נסו לרענן.</div>';
  if(!S.my)return panel('היום שלי',skel);
  const M=S.my,date=S.date,day=dow(date),hol=holiday(date);
  M.slots=(M.slots||[]).map(a=>Array.isArray(a)?{id:a[0],day:a[1],hour:a[2],kind:a[3],subject:a[4]||'',classes:a[5]||[],detail:a[6],room:a[7]}:a);
  (M.homeroom||[]).forEach(H=>H.slots=H.slots.map(a=>Array.isArray(a)?{day:a[0],hour:a[1],kind:a[2],subject:a[3]||'',teacher:a[4],id:a[5]}:a));
  const items=myDayItems(date),les=items.filter(i=>i.cls==='lesson'||i.cls==='gone'&&/^שעה/.test(i.when)).length;
  const wk0=addDays(date,-day),wk=d=>d>=wk0&&d<=addDays(wk0,6);
  const cov=(M.covering||[]).filter(c=>wk(c.date)).length+((M.duty&&M.duty.subs)||[]).filter(s=>s.mine&&s.from&&wk(s.from)).length;
  const dn=[0,1,2,3,4,5].reduce((n,d)=>n+myDuties(d).length,0);
  let h='<section class="kpis k3" aria-label="תמונת מצב אישית">'+
    kpiBtn('k-blue',hol?'אין לימודים':'שיעורים ביום הזה','לפי המערכת שלי',hol?0:les,'jump','my-day','ליום שלי')+
    kpiBtn(cov?'k-orange':'k-green','מילויי מקום שלי','השבוע (שיעורים ותורנויות)',cov,'jump','my-day','לפרטים')+
    kpiBtn('k-purple','תורנויות','בכל שבוע',dn,'jump','my-duty','לרשימה')+'</section>';
  if(!M.teacher)h+='<div class="note">לא מצאנו אותך במערכת השעות של מילוי מקום, ולכן אין כאן מערכת אישית. אם זו טעות, כתבו לנו דרך כפתור המשוב.</div>';
  const tl=hol?'<div class="empty">'+esc(hol)+'</div>':items.length?'<div class="tl">'+items.map(i=>'<div class="tli '+i.cls+'"><span class="when">'+i.when+'</span><span class="what"><b>'+i.main+'</b>'+(i.sub?'<div class="small muted">'+i.sub+'</div>':'')+(i.tag?'<div>'+i.tag+'</div>':'')+'</span></div>').join('')+'</div>':'<div class="empty">אין לך שיעורים או תורנויות ביום הזה.</div>';
  h+='<div id="my-day">'+panel('היום שלי · '+DAYS[day]+' '+shortDate(date),tl)+'</div>';
  if(M.teacher)h+=panel('המערכת השבועית שלי',ttGrid(M.slots,s=>MYLES(s.kind)?'<b>'+esc(s.subject||'שיעור')+'</b><span>'+esc(clsList(s.classes))+'</span>':'<span>'+esc(s.kind)+'</span>',day));
  const C=dutyDefs();
  const dl=[0,1,2,3,4,5].flatMap(d=>myDuties(d).map(r=>'<div class="duty"><span class="st">'+DAYS[d]+' · '+esc(r.label)+'</span><span class="nm">'+esc(r.station)+'</span></div>')).join('');
  h+='<div id="my-duty">'+panel('התורנויות שלי',(M.duty?dl||'<div class="empty">אין לך תורנויות בלוח השבועי.</div>':'<div class="empty">לא נמצאת בלוח התורנויות.</div>')+(C?'':'<div class="small muted">פרטי העמדות לא נטענו.</div>'))+'</div>';
  (M.homeroom||[]).forEach(H=>{
    const t=classToday(H,date);
    const tb=hol?'<div class="empty">'+esc(hol)+'</div>':t.length?t.map(({s,x})=>'<div class="duty"><span class="st">שעה '+s.hour+' · '+esc(s.subject)+' · '+esc(s.teacher)+'</span><span class="nm">'+(x&&x.status==='assigned'&&x.sub?'<span class="tag green">'+esc(x.sub)+'</span>':x&&x.status==='other'?'<span class="tag grey">'+esc(x.note||'טופל')+'</span>':x&&x.status==='asking'?'<span class="tag orange">מחפשים מחליף</span>':'<span class="tag red">עוד אין מחליף</span>')+'</span></div>').join(''):'<div class="empty">כל המורים של הכיתה במקום ביום הזה.</div>';
    h+='<h2 style="margin:8px 0 -8px">הכיתה שלי · '+esc(cls(H.class))+'</h2>'+
      '<div class="mygrid">'+panel('מורים נעדרים בכיתה ביום הזה',tb)+
      '<a class="gotile" href="/mapat-kita/">'+ICON.mapat+'<span><b>מפת הכיתה</b><span>נפתחת עם הקוד האישי שלך'+(H.synced_at?' · עודכנה מהגיליון '+fmtWhen(H.synced_at):'')+'</span></span><span class="arr" aria-hidden="true">←</span></a></div>'+
      panel('מערכת השעות של הכיתה',ttGrid(H.slots,s=>'<b>'+esc(s.subject||'שיעור')+'</b><span>'+esc(shortName(s.teacher))+'</span>',day))});
  const P=M.plans||[];
  h+=panel('תוכניות הלימודים שלי',(P.length?P.map(p=>{const m=p.summary||{};
    return '<div class="item '+(m.ok===false?'s-asking':'s-ok')+'"><div class="t"><b>'+esc(planName(p))+(planCls(p)?' · '+esc(planCls(p)):'')+'</b>'+(m.ok===false?'<span class="tag orange">צפוי לא להספיק</span>':m.finish?'<span class="tag green">בקצב · סיום '+shortDate(m.finish)+'</span>':'')+'</div>'+
      (m.from?'<div class="small muted">'+esc(m.from)+' ← '+esc(m.to||'')+(m.count?' · '+m.count+' '+esc(m.unit||''):'')+(p.end?' · יעד '+shortDate(p.end):'')+'</div>':'')+'</div>'}).join(''):'<div class="empty">עוד לא שמרת תוכנית הספק.</div>')+
    '<a class="note" href="/">למתכנן ההספק ←</a>');
  return h;
}
/* ---------- התאמה אישית של מסך הבית ---------- */
const pref=()=>Object.assign({hideTools:[],hideUrg:[],house:null,widgets:null},S.user&&S.user.prefs||{});
const toolViews=()=>VIEWS.filter(v=>v[0]!=='home'&&allowed(v[0]));
async function savePrefs(p){

}

    '<h3 class="sub">ברשימת המשימות: משימות מאילו כלים</h3>'+(tv.length?'<div class="opts">'+tv.map(v=>chk('tool',v[0],v[1],!p.hideTools.includes(v[0]))).join('')+'</div>':'<div class="empty">אין כלים פתוחים לתפקיד שלך כרגע.</div>');

  b+='<div class="small '+(S.saved==='err'?'err':'muted')+'" role="status">'+(S.saved==='saving'?'שומר…':S.saved==='ok'?'נשמר. ההעדפה תופיע בכל מכשיר שתיכנס ממנו.':S.saved==='err'?'השמירה נכשלה. נסו שוב.':'')+'</div>';

      '<div class="duty"><span class="st">כלים פתוחים</span><span class="nm" style="white-space:normal">'+(tv.length?tv.map(v=>v[1]+' ('+LV[(S.user.levels||{})[v[0]]||'view']+')').join(' · '):'—')+'</span></div>'+
      (S.user.layers.length?'<div class="duty"><span class="st">שכבות</span><span class="nm">'+S.user.layers.map(l=>l+'׳').join(' ')+'</span></div>':'')+

/* ---------- ניהול הרשאות (למורשים בלבד) ---------- */
/* תפקיד = משרה (כמו "מנהלת בית א׳–ב׳"): יש לו כלים ושכבות. לאדם יכולים להיות כמה תפקידים. */
const LAYERS=['א','ב','ג','ד','ה','ו'];
const TOOLS=['milui','toranut','sayarot','mapat','hespek'];
const ERR={phone_exists:'מספר הטלפון הזה כבר רשום.',bad_phone:'מספר הטלפון לא תקין.',bad_name:'חסר שם.',no_roles:'צריך לסמן לפחות תפקיד אחד.',bad_role:'אחד התפקידים לא קיים. רעננו ונסו שוב.',role_in_use:'אי אפשר למחוק תפקיד שמשויכים אליו אנשים.',
  cannot_delete_self:'אי אפשר להסיר את עצמך.',forbidden:'אין לך הרשאה לנהל הרשאות.',bad_label:'חסר שם לתפקיד.',not_found:'הרשומה לא נמצאה. רעננו ונסו שוב.'};
const errText=e=>{const k=Object.keys(ERR).find(k=>String(e&&e.message).includes(k));return k?ERR[k]:'הפעולה נכשלה. נסו שוב.'};
const LV={view:'צפייה',edit:'עריכה',admin:'מנהל'};
const lvOf=(x,k)=>(x.levels||{})[k]||((x.tools||[]).includes(k)?'view':'');
const toolsTxt=x=>(x.tools||[]).length?x.tools.map(k=>viewOf(k)[1]+' ('+LV[lvOf(x,k)]+')').join(' · '):'אין כלים פתוחים';
const layersTxt=L=>L&&L.length?L.map(l=>l+'׳').join(' '):'כל בית הספר';
async function loadAdmin(){try{S.admin=await rpc('hanhala_admin_list',{p_phone:S.phone});S.adminErr=null}catch(e){S.admin=null;S.adminErr=errText(e)}}
async function adminDo(fn,args,keep){
  S.adminErr=null;S.adminBusy=true;render();
  try{await rpc(fn,Object.assign({p_phone:S.phone},args));S.myMonth=null;if(!keep){S.edit=null;S.openRole=null}S.confirmDel=null;await loadAdmin();S.dataMonth=null;await loadAll(false);S.adminOk=true}
  catch(e){S.adminErr=errText(e);S.adminOk=false}
  S.adminBusy=false;render();
}

    b+=A.staff.map(x=>{

        '<div class="rchips">'+rs.map(r=>'<span class="rchip">'+esc(r.label)+'</span>').join('')+'</div>'+

  if(S.adminOk&&!S.openRole&&!S.adminErr)r+='<div class="small" style="color:var(--green-ink)" role="status">נשמר.</div>';

  return h+panel('תפקידים: מה כל תפקיד רואה ומי ממלא אותו',r);
}
/* ---------- משובים מהצוות (מנהל מערכת בלבד) ---------- */
const FBK={bug:['תקלה','red'],idea:['רעיון','green'],question:['שאלה','orange']};
const FBS={new:'חדש',doing:'בטיפול',done:'טופל'};
async function loadFb(){try{S.fb=await rpc('hanhala_feedback_list',{p_phone:S.phone});S.fbErr=null;S.fbOpen=S.fb.filter(x=>x.status==='new').length}catch(e){S.fbErr='המשובים לא נטענו. נסו לרענן.'}}
function viewFeedback(){
  if(!isDev())return '<div class="note bad">המסך הזה פתוח רק למנהל המערכת.</div>';
  if(!S.fb)return S.fbErr?'<div class="note bad">'+esc(S.fbErr)+'</div>':panel('משובים',skel);
  const c=k=>S.fb.filter(x=>x.status===k).length,f=S.fbFilter;
  let h='<section class="kpis k3" aria-label="משובים לפי מצב">'+kpiBtn('k-red','חדשים','עוד לא טופלו',c('new'),'fb-filter','new','הצג',f==='new')+
    kpiBtn('k-orange','בטיפול','בעבודה',c('doing'),'fb-filter','doing','הצג',f==='doing')+kpiBtn('k-green','טופלו','סגורים',c('done'),'fb-filter','done','הצג',f==='done')+'</section>';
  if(S.fbErr)h+='<div class="note bad" role="alert">'+esc(S.fbErr)+'</div>';
  const list=S.fb.filter(x=>f?x.status===f:x.status!=='done');
  const wa=ph=>'https://wa.me/972'+String(ph).replace(/^0/,'');
  const b=list.length?list.map(x=>{const k=FBK[x.kind]||FBK.bug,dt=new Date(x.created_at);
    return '<div class="item '+(x.status==='new'?'s-open':x.status==='doing'?'s-asking':'s-ok')+'"><div class="t"><b><span class="tag '+k[1]+'">'+k[0]+'</span> '+esc(x.tool)+'</b><span class="small muted">'+esc(x.name)+' · '+dt.getDate()+'.'+(dt.getMonth()+1)+' '+pad(dt.getHours())+':'+pad(dt.getMinutes())+'</span></div>'+
      '<div class="fbbody">'+esc(x.body)+'</div>'+(x.page?'<div class="small muted" dir="ltr" style="text-align:right">'+esc(x.page)+'</div>':'')+
      '<div class="chips">'+['new','doing','done'].filter(s=>s!==x.status).map(s=>'<button class="btn sec sm" data-act="fb-set" data-id="'+x.id+'" data-v="'+s+'">'+(s==='new'?'החזרה לחדש':s==='doing'?'סימון בטיפול':'סימון טופל')+'</button>').join('')+
      (x.phone?'<a class="btn sec sm" href="'+wa(x.phone)+'" target="_blank" rel="noopener">מענה בוואטסאפ</a>':'')+'</div></div>'}).join('')
    :'<div class="empty">'+(f?'אין משובים במצב הזה.':'אין משובים פתוחים.')+'</div>';
  return h+panel(f?'משובים: '+FBS[f]:'משובים פתוחים (חדשים ובטיפול)',b);
}
function shell(inner){
  return '<div class="app"><nav class="rail" aria-label="תפריט ראשי"><div class="brand">כנפי רוח<small>'+(isStaff()?'הנהלה':'צוות')+'</small></div>'+
   navViews().map(([k,l])=>'<button type="button" data-go="'+k+'"'+(S.view===k?' aria-current="page"':'')+'>'+ICON[k]+l+'</button>').join('')+
   '<div class="spacer"></div>'+
   (isStaff()?'<button type="button" data-go="prefs"'+(S.view==='prefs'?' aria-current="page"':'')+'>'+ICON.prefs+'התאמה אישית</button>':'')+
   (S.user&&S.user.can_manage?'<button type="button" data-go="perms"'+(S.view==='perms'?' aria-current="page"':'')+'>'+ICON.perms+'הרשאות</button>':'')+
   (isDev()?'<button type="button" data-go="feedback"'+(S.view==='feedback'?' aria-current="page"':'')+'>'+ICON.fb+'משובים'+(S.fbOpen?'<span class="cnt" aria-label="'+S.fbOpen+' חדשים">'+S.fbOpen+'</span>':'')+'</button>':'')+
   '<div class="who">'+esc(S.user?S.user.name:'')+'<br><button class="link" style="color:#c9d3de;font-size:13px" data-act="logout">יציאה</button></div></nav><main>'+inner+'</main></div>';
}
function render(){
  if(!S.phone)return renderLogin();
  if(!S.user){root.innerHTML=S.err.data?'<div class="login"><div class="card"><h1>לוח הנהלה</h1><div class="err">אין חיבור לשרת כרגע.</div><button class="btn wide" data-act="refresh">ניסיון נוסף</button></div></div>':'<div class="loading">טוען…</div>';return}
  const isToday=S.date===schoolDay(today()),hol=holiday(S.date),v=viewOf(S.view),setv=S.view==='prefs'||S.view==='perms'||S.view==='feedback';
  const title=S.view==='home'||S.view==='my'?(S.user.staff?greet(S.user.name):greetT(S.user.name)):S.view==='prefs'?'התאמה אישית':S.view==='perms'?'ניהול הרשאות':S.view==='feedback'?'משובים מהצוות':v[1];
  let h='<header class="card topbar"><div><h1>'+esc(title)+'</h1><div class="muted">'+(setv?esc(S.user.role_label):(S.view==='home'?esc(S.user.role_label)+' · ':S.view==='my'?'הדף שלי · ':'תמונת מצב · ')+fmtFull(S.date)+(isToday?' · היום':'')+(S.loadedAt?' · עודכן '+pad(S.loadedAt.getHours())+':'+pad(S.loadedAt.getMinutes()):''))+'</div></div>'+
    (setv?'':'<div class="chips"><button class="btn sec" data-act="day" data-n="-1">יום קודם</button><button class="btn sec" data-act="today" aria-pressed="'+isToday+'">היום</button><button class="btn sec" data-act="day" data-n="1">יום הבא</button><button class="btn" data-act="refresh">'+(S.busy?'מרענן…':'רענון')+'</button></div>')+'</header>';
  if(!setv&&S.view==='my'){if(hol)h+='<div class="card banner">'+esc(hol)+' — אין לימודים ביום הזה.</div>'}
  else if(!setv){
    const mine=myHouse();
    h+='<div class="pills" role="group" aria-label="תצוגה לפי שכבות"><button type="button" data-act="house" data-v="all" aria-pressed="'+(!H())+'">כל בית הספר</button>'+
      (mine==='mine'?'<button type="button" data-act="house" data-v="mine" aria-pressed="'+(S.house==='mine')+'">השכבות שלי ('+S.user.layers.map(l=>l+'׳').join(' ')+')</button>':'')+
      HOUSES.map(x=>'<button type="button" data-act="house" data-v="'+x.id+'" aria-pressed="'+(S.house===x.id)+'">'+x.label+(mine===x.id?' · הבית שלי':'')+'</button>').join('')+'</div>';
    if(hol)h+='<div class="card banner">'+esc(hol)+' — אין לימודים ביום הזה.</div>';
    if(S.view==='home'&&!S.user.tools.length)h+='<div class="note">לתפקיד שלך עדיין לא נפתחו כלים בלוח. פנו למנהל בית הספר.</div>';
  }
  h+=({my:viewMy,home:viewHome,milui:viewMilui,toranut:viewToranut,sayarot:viewSayarot,mapat:viewMapat,hespek:viewHespek,prefs:viewPrefs,perms:viewPerms,feedback:viewFeedback}[S.view]||viewHome)();
  root.innerHTML=shell(h);
}
function renderLogin(err){
  root.innerHTML='<div class="login"><form class="card" id="loginForm"><h1>כנפי רוח</h1><div class="muted">הדף האישי של אנשי הצוות ולוח ההנהלה · כניסה עם מספר הטלפון שלך</div>'+
   '<label for="ph" style="font-weight:600">מספר טלפון</label><input id="ph" name="tel" type="tel" inputmode="tel" autocomplete="tel" required autofocus>'+
   (err?'<div class="err" role="alert">'+esc(err)+'</div>':'')+'<button class="btn wide" type="submit">כניסה</button></form></div>';
  root.querySelector('#ph').focus();
}
function logout(msg){S.phone=null;S.user=null;S.house=null;S.milui=null;S.tor=null;S.mk=null;S.say=null;S.plans=null;S.admin=null;S.dataMonth=null;S.my=null;S.myMonth=null;try{localStorage.removeItem('hanhala_phone')}catch(e){};renderLogin(msg)}
async function refresh(force){
  S.busy=true;render();
  try{await loadAll(force)}catch(e){S.busy=false;if(e.message==='no_access')return logout('המספר הזה לא מורשה להיכנס.');console.error(e)}
  S.busy=false;if(S.phone)render();
}
root.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='loginForm'){
    const ph=f.querySelector('#ph').value;
    try{await rpc('hanhala_me',{p_phone:ph});S.phone=ph;try{localStorage.setItem('hanhala_phone',ph)}catch(x){}refresh(true)}
    catch(x){renderLogin(x.message==='no_access'?'המספר הזה לא מורשה להיכנס.':'אין חיבור לשרת. נסו שוב.')}
    return}
  const fd=new FormData(f);
  if(f.dataset.form==='staff'){
    const x={name:fd.get('name'),phone:fd.get('phone'),old_phone:fd.get('old_phone')||null,roles:fd.getAll('roles'),can_manage:fd.get('can_manage')==='on'};
    S.edit={kind:'staff',x:Object.assign({},x,{old:x.old_phone||'',self:!!(S.edit&&S.edit.x&&S.edit.x.self)})};
    if(S.edit.x.self)x.can_manage=true;
    return adminDo('hanhala_admin_save_staff',{p:x})}
  if(f.dataset.form==='role'){const lv={};TOOLS.forEach(k=>{const v=fd.get('lv_'+k);if(v)lv[k]=v});
    return adminDo('hanhala_admin_save_role',{p:{id:fd.get('id')||null,label:fd.get('label'),levels:lv,layers:fd.getAll('layers')}})}
});
root.addEventListener('click',e=>{
  const sm=e.target.closest('details.ritem > summary');if(!sm)return;e.preventDefault();
  const id=sm.parentElement.dataset.role;S.openRole=S.openRole===id?null:id;S.adminErr=null;S.adminOk=false;render();
  const el=root.querySelector('details.ritem[data-role="'+id+'"]');if(el&&S.openRole)el.scrollIntoView({block:'nearest'});
},true);
root.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.homeroom!=null)return adminDo('hanhala_admin_set_homeroom',{p_class:t.dataset.homeroom,p_teacher:t.value?+t.value:null},true);
  if(t.dataset.pref==='widget'){const p=pref(),cur=myWidgets().map(w=>w[0]),nx=t.checked?cur.concat([t.value]):cur.filter(x=>x!==t.value);
    p.widgets=WIDGETS.map(w=>w[0]).filter(x=>nx.includes(x));return savePrefs(p)}
  if(t.dataset.pref){const p=pref(),k=t.dataset.pref==='tool'?'hideTools':'hideUrg',v=t.dataset.pref==='tool'?t.value:+t.value;
    p[k]=t.checked?p[k].filter(x=>x!==v):p[k].concat([v]);return savePrefs(p)}
});
root.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){S.view=g.dataset.go;S.filter=0;S.saved=null;S.edit=null;S.confirmDel=null;S.adminErr=null;if(S.view==='perms'&&S.user.can_manage){loadAdmin().then(render)}if(S.view==='feedback'&&isDev()){loadFb().then(render)}history.pushState(null,'',S.view==='home'?location.pathname:'#'+S.view);render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='staff-new'){S.adminErr=null;S.edit={kind:'staff',x:{name:'',phone:'',roles:[],can_manage:false}};render();window.scrollTo(0,0);return}
  if(a==='staff-edit'){S.adminErr=null;const x=S.admin.staff.find(x=>x.phone===b.dataset.v);S.edit={kind:'staff',x:Object.assign({},x,{old:x.phone})};render();window.scrollTo(0,0);return}
  if(a==='edit-cancel'){S.edit=null;S.adminErr=null;return render()}
  if(a==='del-ask'){S.confirmDel=b.dataset.v;return render()}
  if(a==='del-cancel'){S.confirmDel=null;return render()}
  if(a==='staff-del')return adminDo('hanhala_admin_delete_staff',{p_target:b.dataset.v});
  if(a==='role-del')return adminDo('hanhala_admin_delete_role',{p_id:b.dataset.v});
  if(a==='house'){S.house=b.dataset.v;render();const p=Object.assign(pref(),{house:S.house});S.user.prefs=p;rpc('hanhala_save_prefs',{p_phone:S.phone,p_prefs:p}).catch(e=>console.error(e));return}
  if(a==='fb-filter'){S.fbFilter=S.fbFilter===b.dataset.v?null:b.dataset.v;return render()}
  if(a==='fb-set'){const id=+b.dataset.id,st=b.dataset.v,f=(S.fb||[]).find(x=>x.id===id);if(f){const was=f.status;f.status=st;S.fbErr=null;S.fbOpen=(S.fb||[]).filter(x=>x.status==='new').length;render();
    rpc('hanhala_feedback_set',{p_phone:S.phone,p_id:id,p_status:st}).catch(e=>{console.error(e);f.status=was;S.fbOpen=(S.fb||[]).filter(x=>x.status==='new').length;S.fbErr='העדכון לא נשמר. נסו שוב.';render()})}return}
  if(a==='perm-tab'){S.permTab=b.dataset.v;S.edit=null;S.openRole=null;S.adminErr=null;S.adminOk=false;return render()}
  if(a==='jump'){const el=document.getElementById(b.dataset.v);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(a==='filter'){const v=+b.dataset.v;S.filter=S.filter===v?0:v;return render()}
  if(a==='logout')return logout();
  if(a==='refresh')return refresh(true);
  if(a==='today'){S.date=schoolDay(today());return refresh(false)}
  if(a==='day'){let d=addDays(S.date,+b.dataset.n);while(dow(d)===6)d=addDays(d,+b.dataset.n);S.date=d;return refresh(false)}
});
/* רענון אוטומטי כשחוזרים ללשונית אחרי יותר מ־5 דקות */
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.phone&&S.loadedAt&&Date.now()-S.loadedAt>3e5)refresh(true)});
window.addEventListener('popstate',()=>{S.view=hashView();if(S.user&&!canSee(S.view))S.view='home';if(S.view==='feedback'&&S.user&&isDev())loadFb().then(render);if(S.phone){if(S.view==='perms'&&S.user&&S.user.can_manage&&!S.admin)loadAdmin().then(render);render()}});
if(S.phone)refresh(true);else renderLogin();
</script>
<script src="/feedback/badge.js" defer></script>
</body>
</html>
