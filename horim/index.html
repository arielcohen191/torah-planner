<style>
:root{--ground:#eef1f5;--card:#fff;--card-muted:#f5f7fa;--line:#dfe4ea;--ink:#1f2a37;--ink-muted:#5b6878;--rail:#26323f;--rail-ink:#c9d3de;
--brand:#2f7fd6;--brand-dark:#1f5fa6;--blue:#4a8ec9;--green:#4f9a2a;--green-ink:#3f7d21;--orange:#c77700;--orange-ink:#a56300;--red:#c62a20;--active:#2fbf71;
--r-sm:6px;--r-md:10px;--r-lg:14px;--shadow:0 1px 3px rgba(31,42,55,.10)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:Heebo,Assistant,system-ui,sans-serif;font-size:17px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.app{display:flex;min-height:100vh}
nav.rail{flex:0 0 104px;background:var(--rail);display:flex;flex-direction:column;gap:8px;padding:24px 8px}
.rail .brand{color:#fff;font-weight:700;font-size:15px;text-align:center;padding-bottom:16px;border-bottom:1px solid #3a4756;margin-bottom:4px}
.rail button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:var(--r-md);background:none;border:0;color:var(--rail-ink);font-size:14px}
.rail button[aria-current="page"]{background:var(--active);color:#fff;font-weight:600}
.rail .spacer{flex:1}
.rail .who{color:var(--rail-ink);font-size:13px;text-align:center}
main{flex:1;min-width:0;padding:24px 32px 80px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow)}

h2{margin:0;font-size:20px;font-weight:600}
h3{margin:0;font-size:18px;font-weight:600}
.muted{color:var(--ink-muted)}
.small{font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:var(--r-md);border:0;background:var(--brand);color:#fff;font-size:17px;font-weight:600;text-decoration:none}
.btn:hover{background:var(--brand-dark)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid #c9d1db}
.btn.sec:hover{background:var(--card-muted)}
.btn.ok{background:var(--green)}.btn.ok:hover{background:var(--green-ink)}
.btn.bad{background:#fff;color:var(--red);border:1.5px solid #e6b3ae}

.btn.sm{min-height:44px;padding:0 14px;font-size:16px}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{border:0;font:inherit;text-align:right;cursor:pointer;border-radius:var(--r-lg);padding:18px 22px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:104px;transition:transform .12s,box-shadow .12s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(31,42,55,.18)}
.kpi b{display:block;font-size:19px;font-weight:600}.kpi span{font-size:15px}
.kpi .n{font-size:52px;line-height:52px;font-weight:200}
.kpi .go{display:block;font-size:13px;opacity:.85;margin-top:4px;text-decoration:underline;text-underline-offset:3px}
.k-red{background:var(--red)}.k-orange{background:var(--orange)}.k-green{background:var(--green)}.k-blue{background:var(--blue)}
.box{padding:20px 24px;display:flex;flex-direction:column;gap:14px}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{min-height:52px;border:1.5px solid #c9d1db;border-radius:var(--r-md);padding:0 14px;font-size:17px;background:#fff;width:100%}
textarea{padding:12px 14px;min-height:90px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid #9cc3ef;outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.check{display:flex;align-items:flex-start;gap:12px;font-size:16px;min-height:44px}
.check input{width:24px;height:24px;flex:none;margin-top:2px}
.slots{display:flex;flex-direction:column;gap:8px}

.slot .tm{font-size:20px;font-weight:700;min-width:58px;font-variant-numeric:tabular-nums}
.slot .who{flex:1 1 220px;display:flex;flex-direction:column}
.slot .who b{font-size:17px}
.slot .acts{display:flex;flex-wrap:wrap;gap:6px}
.slot.free{border-right-color:#b9c4d0}.slot.taken{border-right-color:var(--brand)}.slot.brk{border-right-color:#8a96a4;opacity:.7}
.slot.now{border-right-color:var(--orange);background:#fdf3e2}.slot.done{border-right-color:var(--green);opacity:.75}.slot.ns{border-right-color:var(--red);opacity:.75}
.tag{font-size:14px;font-weight:600;border-radius:99px;padding:2px 10px;background:#e8edf3;color:var(--ink-muted)}
.tag.g{background:#e3f1da;color:var(--green-ink)}.tag.o{background:#fbe9cc;color:var(--orange-ink)}.tag.r{background:#f8dedb;color:var(--red)}.tag.b{background:#dceafa;color:var(--brand-dark)}
.times{display:flex;flex-wrap:wrap;gap:8px}
.times button{min-width:72px;min-height:48px;border:1.5px solid #c9d1db;border-radius:var(--r-md);background:#fff;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.times button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.times button[disabled]{background:#eef1f5;color:#a9b3bf;border-color:#e1e6ec;text-decoration:line-through;cursor:default}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(31,42,55,.45);display:flex;align-items:center;justify-content:center;padding:16px}

.modal .mbody{padding:22px;display:flex;flex-direction:column;gap:14px}
.modal .mfoot{display:flex;gap:10px;padding:0 22px 22px}.modal .mfoot .btn{flex:1}
.warn{background:#fdf1dc;border-right:6px solid var(--orange);border-radius:var(--r-sm);padding:10px 14px;font-size:16px}
.info{background:#eaf3fc;border-right:6px solid var(--brand);border-radius:var(--r-sm);padding:10px 14px;font-size:16px}
.okbox{background:#e9f5e2;border-right:6px solid var(--green);border-radius:var(--r-sm);padding:14px 16px}
.err{color:var(--red);font-weight:600}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 24px;border-radius:var(--r-md);font-size:17px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:92vw}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .card{width:100%;max-width:440px;padding:32px;display:flex;flex-direction:column;gap:16px}
.loading{padding:40px;text-align:center;color:var(--ink-muted)}
.credit{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink-muted);font-size:13px;padding:12px}
.credit img{height:28px}
.bar{height:10px;border-radius:99px;background:#e4e9ef;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.big{font-size:44px;font-weight:200;line-height:1}
/* הורים */
.pp{max-width:640px;margin:0 auto;padding:16px 14px 60px;display:flex;flex-direction:column;gap:16px}
.phead{display:flex;align-items:center;gap:14px;padding:16px 18px}
.phead img{height:52px;flex:none}
.step{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.tcard{border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:10px}
.tcard.picked{border-color:var(--green);background:#f6fbf3}
.meet{display:flex;flex-direction:column;gap:8px;padding:16px 18px;border-right:6px solid var(--brand)}
.meet .tm{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.meet.now{border-right-color:var(--orange);background:#fdf3e2}.meet.done{border-right-color:var(--green)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
 .app{flex-direction:column}
 nav.rail{flex:0 0 auto;flex-direction:row;padding:6px;gap:4px;position:sticky;bottom:0;order:2;justify-content:space-around;z-index:20}
 .rail .brand,.rail .spacer,.rail .who{display:none}
 .rail button{flex:1;padding:8px 2px;font-size:12.5px}
 main{padding:16px 12px 24px;order:1}
 .topbar{padding:14px 16px}.box{padding:16px}
 .kpi{min-height:88px;padding:14px}.kpi .n{font-size:40px;line-height:40px}
 .grid2{grid-template-columns:1fr}
}
@media print{nav.rail,.acts,.noprint,.kfb-btn{display:none!important}main{padding:0}}
</style>

<script>
'use strict';
const CFG={url:'https://onocjgbtensczpdbeanf.supabase.co',key:'sb_publishable_JpV-E-qPnV9ZdnRnY9Kv8Q_TaRzCnyc'};
async function rpc(fn,args){
  const r=await fetch(CFG.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const m=(j&&j.message)||t;throw new Error(m)}
  return j;
}
const ERR={taken:'השעה הזו נתפסה הרגע. בחרו שעה אחרת.',already:'כבר נקבעה פגישה לתלמיד הזה אצל המורה הזה.',overlap:'יש לכם כבר פגישה אחרת באותה שעה (אולי עם ילד נוסף). בחרו שעה אחרת.',
  closed:'ההרשמה סגורה כרגע.',bad_phone:'מספר הטלפון לא תקין.',no_parent:'נא לכתוב שם.',no_picks:'לא נבחרה אף שעה.',no_student:'התלמיד לא נמצא ברשימת הכיתה.',
  wrong_teacher:'המורה הזה לא נפגש עם הורי הכיתה.',bad_link:'הקישור לא תקין. בקשו מהמחנך קישור חדש.',forbidden:'אין לך הרשאה לפעולה הזו.',no_access:'המספר הזה לא מורשה להיכנס.',
  view_only:'מצב צפייה בלבד',two_same_teacher:'אפשר לבחור שעה אחת בלבד אצל כל מורה.'};
const errMsg=e=>{const m=String(e&&e.message||e);for(const k in ERR)if(m.includes(k))return ERR[k];return 'משהו השתבש. נסו שוב בעוד רגע.'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const parseD=s=>new Date(s+'T12:00');
function longDate(s){const d=parseD(s);let h='';try{h=new Intl.DateTimeFormat('he-u-ca-hebrew',{day:'numeric',month:'long'}).format(d)}catch(e){}
  return 'יום '+DAYS[d.getDay()]+', '+d.getDate()+'.'+(d.getMonth()+1)+(h?' · '+h:'')}
const todayIso=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const hm=t=>String(t||'').slice(0,5);
const mins=t=>{const [h,m]=hm(t).split(':').map(Number);return h*60+m};
const fmtMin=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.round(n%60)).padStart(2,'0');
function nameParts(n){const t=String(n).replace(/`/g,'׳').replace(/^הרב\s+/,'').split(' ');const k=['בן','בר','אבו','אל','דה'].includes(t[0])&&t.length>2?2:1;return{last:t.slice(0,k).join(' '),first:t.slice(k).join(' ')||t[0]}}
const tName=n=>{const p=nameParts(n);return (/^הרב\s/.test(n)?'הרב ':'')+p.first.split(' ')[0]+' '+p.last};
function intlPhone(p){let d=String(p||'').replace(/\D/g,'');if(d.startsWith('0'))d='972'+d.slice(1);return d}
const fold=s=>String(s||'').replace(/[`'׳"״\-]/g,'').replace(/\s+/g,' ').trim();
let toastT;function toast(m){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3600)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('הועתק')}catch(e){prompt('העתיקו:',t)}}
const ls=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const BASE=location.origin+'/horim/';
const classLink=tok=>BASE+'?k='+tok;
const myLink=tok=>BASE+'?p='+tok;
const LOGO='<img src="/icons/kanfei-ruach-logo.png" alt="כנפי רוח">';
const CREDIT='<div class="credit">'+LOGO+'<span>יום הורים · כנפי רוח · נבנה על ידי אריאל כהן</span></div>';
const root=document.getElementById('root');
const Q=new URLSearchParams(location.search);

/* ---------- קובץ יומן ---------- */
function icsFor(items,ev){
  const z=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//kanfei-ruach//yom-horim//HE','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  items.forEach(it=>{const s=new Date(ev.day+'T'+hm(it.t)+':00'),e=new Date(s.getTime()+ev.slot_min*60000);
    lines.push('BEGIN:VEVENT','UID:yh-'+it.id+'@kanfei-ruach','DTSTAMP:'+z(new Date()),'DTSTART:'+z(s),'DTEND:'+z(e),
      'SUMMARY:'+('יום הורים · '+tName(it.teacher)+' · '+it.stu).replace(/[,;]/g,' '),
      'LOCATION:'+('כנפי רוח'+(it.room?' · '+it.room:'')).replace(/[,;]/g,' '),
      'DESCRIPTION:'+('המקום בתור: '+(it.link||'')).replace(/[,;]/g,' '),
      'BEGIN:VALARM','TRIGGER:-PT60M','ACTION:DISPLAY','DESCRIPTION:תזכורת: יום הורים','END:VALARM','END:VEVENT')});
  lines.push('END:VCALENDAR');return lines.join('\r\n');
}
function downloadIcs(items,ev){const b=new Blob([icsFor(items,ev)],{type:'text/calendar'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='yom-horim.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function gcalLink(it,ev){const z=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');const s=new Date(ev.day+'T'+hm(it.t)+':00'),e=new Date(s.getTime()+ev.slot_min*60000);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('יום הורים · '+tName(it.teacher)+' · '+it.stu)+'&dates='+z(s)+'/'+z(e)+'&location='+encodeURIComponent('כנפי רוח'+(it.room?' · '+it.room:''))+'&details='+encodeURIComponent('המקום בתור: '+(it.link||''))}

/* ---------- תור חי: זמן משוער ---------- */
/* q: רשימת הפגישות של המורה לפי סדר (t, s=התחיל, e=הסתיים, n=לא הגיע). מחזיר את העיכוב בדקות ואת מצב הפגישה הנוכחית */
function liveInfo(q,slotMin,now){
  now=now||new Date();let delay=0,cur=null;
  q.forEach(x=>{if(x.s){const sched=mins(x.t),st=new Date(x.s);const stM=st.getHours()*60+st.getMinutes()+st.getSeconds()/60;delay=Math.max(0,stM-sched);if(!x.e)cur=x}});
  if(cur){const st=new Date(cur.s);const over=(now-st)/60000-slotMin;if(over>0)delay+=over}
  return {delay:Math.round(delay),cur};
}

/* =================================================================== */
/* ========================  מצב הורה  ================================ */
/* =================================================================== */
const P={tok:Q.get('k'),ptok:Q.get('p'),data:null,stu:null,picks:{},parent:ls('yh_parent')||'',phone:ls('yh_pphone')||'',consent:true,done:null,mine:null,q:'',busy:false,timer:null};
function myTokens(){try{return JSON.parse(ls('yh_ptokens')||'[]')}catch(e){return[]}}
function addMyToken(t){const a=myTokens();if(!a.includes(t)){a.push(t);lsSet('yh_ptokens',JSON.stringify(a))}}
async function loadMine(){const toks=[...new Set([...(P.ptok?[P.ptok]:[]),...myTokens()])];const all=[];let ev=null;
  for(const t of toks){try{const m=await rpc('yh_mine',{p_ptoken:t});if(m&&m.items&&m.items.length){ev=m.event;m.items.forEach(i=>{i.ptoken=t;i.link=myLink(t);all.push(i)})}}catch(e){}}
  all.sort((a,b)=>mins(a.t)-mins(b.t));P.mine={ev,items:all};}
function parentShell(inner){return '<div class="pp"><header class="card phead">'+LOGO+'<div><h1 style="font-size:22px;line-height:28px">'+esc(P.data?P.data.event.title:(P.mine&&P.mine.ev?P.mine.ev.title:'יום הורים'))+'</h1><div class="muted small">כנפי רוח'+
  (P.data?' · כיתה '+esc(P.data.cls)+' · '+esc(longDate(P.data.event.day)):P.mine&&P.mine.ev?' · '+esc(longDate(P.mine.ev.day)):'')+'</div></div></header>'+inner+CREDIT+'</div>'}

async function parentStart(){
  try{
    await loadMine();
    if(P.tok){P.data=await rpc('yh_class',{p_token:P.tok})}
  }catch(e){root.innerHTML=parentShell('<div class="card box"><div class="err">'+esc(errMsg(e))+'</div></div>');return}
  renderParent();
  if(P.mine&&P.mine.items.length){clearInterval(P.timer);P.timer=setInterval(async()=>{if(P.busy||document.hidden)return;await loadMine();if(!P.stu||P.done)renderParent()},30000)}
}
function mineHtml(){
  const m=P.mine;if(!m||!m.items.length)return '';
  const ev=m.ev,isDay=ev.day===todayIso(),now=new Date();
  const cards=m.items.map(it=>{
    const li=liveInfo(it.queue,ev.slot_min,now);const me=it.queue.find(x=>x.t===it.t)||{};
    let cls='',status='';
    if(it.no_show){cls='done';status='<span class="tag r">סומן שלא הגעתם. דברו עם המורה.</span>'}
    else if(it.ended){cls='done';status='<span class="tag g">הפגישה הסתיימה</span>'}
    else if(it.started){cls='now';status='<span class="tag o">עכשיו בפנים</span>'}
    else if(isDay){
      const ahead=it.queue.filter(x=>mins(x.t)<mins(it.t)&&!x.e&&!x.n).length;
      const est=mins(it.t)+li.delay;
      status='<div><b>'+(ahead===0?'אתם הבאים בתור':'לפניכם בתור: '+ahead)+'</b></div>'+
        (li.delay>=3?'<div class="warn small">המורה מאחר/ת בכ־'+li.delay+' דקות. כניסה משוערת: <b>'+fmtMin(est)+'</b></div>':'<div class="small muted">בזמן. כניסה משוערת: '+fmtMin(est)+'</div>');
    }
    return '<div class="card meet '+cls+'"><div class="row" style="justify-content:space-between"><span class="tm">'+esc(it.t)+'</span>'+(it.room?'<span class="tag">'+esc(it.room)+'</span>':'')+'</div>'+
      '<div><b>'+esc(tName(it.teacher))+'</b> · על '+esc(it.stu)+' ('+esc(it.cls)+')</div>'+status+
      (!it.started&&!it.ended&&ev.can_cancel?'<div class="row noprint"><a class="link" href="'+esc(gcalLink(it,ev))+'" target="_blank" rel="noopener">ליומן גוגל</a><button class="link" data-act="ics" data-id="'+it.id+'">ליומן בטלפון</button><button class="link" style="color:var(--red)" data-act="pcancel" data-id="'+it.id+'" data-tok="'+esc(it.ptoken)+'">ביטול הפגישה</button></div>':'')+'</div>'});
  return '<section style="display:flex;flex-direction:column;gap:10px"><h2>הפגישות שלי</h2>'+(isDay?'<div class="small muted">הדף מתעדכן לבד כל חצי דקה.</div>':'')+cards.join('')+'</section>';
}
function renderParent(){
  if(!P.tok){root.innerHTML=parentShell(P.mine&&P.mine.items.length?mineHtml():'<div class="card box">לא נמצאו פגישות בקישור הזה.</div>');return}
  const d=P.data,ev=d.event;
  if(P.done)return renderDone();
  let h=mineHtml();
  if(!ev.reg_open){root.innerHTML=parentShell(h+'<div class="card box"><h2>ההרשמה סגורה כרגע</h2><div class="muted">אם צריך לקבוע או לשנות פגישה, פנו למחנך/ת הכיתה.</div></div>');return}
  if(ev.note)h+='<div class="info">'+esc(ev.note)+'</div>';
  // שלב 1: הילד
  h+='<section class="card box"><div class="step"><span class="n">1</span>על איזה ילד הפגישה?</div>';
  if(P.stu){const s=d.students.find(x=>x.n===P.stu);h+='<button class="pick" aria-pressed="true" data-act="unstu"><b>'+esc(P.stu)+'</b><span class="link">החלפה</span></button>'}
  else{
    h+='<input type="search" id="sq" placeholder="חיפוש לפי שם" value="'+esc(P.q)+'" autocomplete="off"><div class="picklist" id="slist">'+stuList()+'</div>';
  }
  h+='</section>';
  if(P.stu){
    const s=d.students.find(x=>x.n===P.stu)||{done:[]};
    const left=d.teachers.filter(t=>!s.done.includes(t.tid));
    // שלב 2: פרטי ההורה
    h+='<section class="card box"><div class="step"><span class="n">2</span>פרטי ההורה</div><div class="grid2"><label class="f">שם ההורה<input type="text" id="pname" autocomplete="name" value="'+esc(P.parent)+'"></label>'+
      '<label class="f">טלפון נייד<input type="tel" id="pphone" inputmode="tel" autocomplete="tel" value="'+esc(P.phone)+'"></label></div>'+
      '<label class="check"><input type="checkbox" id="pcons"'+(P.consent?' checked':'')+'> מסכימים שהמחנך/ת ישלחו תזכורת בוואטסאפ למספר הזה</label></section>';
    // שלב 3: שעות
    h+='<section class="card box"><div class="step"><span class="n">3</span>בחירת שעה'+(d.teachers.length>1?' אצל כל מורה':'')+'</div>';
    if(!left.length)h+='<div class="okbox">כבר נקבעו כל הפגישות של '+esc(P.stu)+'. '+(P.mine&&P.mine.items.some(i=>i.stu===P.stu)?'הן מופיעות למעלה.':'אם קבע אותן הורה אחר במשפחה, הקישור האישי נמצא אצלו.')+'</div>';
    const busy=(P.mine&&P.mine.items||[]).map(i=>mins(i.t));
    left.forEach(t=>{const sel=P.picks[t.tid];
      const free=t.slots.filter(x=>x.free);
      h+='<div class="tcard'+(sel?' picked':'')+'"><div><b>'+esc(tName(t.name))+'</b>'+(t.homeroom?' <span class="tag b">מחנך/ת</span>':'')+(t.room?' <span class="tag">'+esc(t.room)+'</span>':'')+'</div>'+
        (free.length?'<div class="times" role="group" aria-label="שעות פנויות אצל '+esc(tName(t.name))+'">'+t.slots.map(x=>{
          const clash=busy.some(b=>Math.abs(b-mins(x.t))<ev.slot_min)||Object.entries(P.picks).some(([k,v])=>+k!==t.tid&&v&&Math.abs(mins(v.t)-mins(x.t))<ev.slot_min);
          return x.free?'<button type="button" data-act="ptime" data-tid="'+t.tid+'" data-id="'+x.id+'" data-t="'+x.t+'" aria-pressed="'+(sel&&sel.id===x.id)+'"'+(clash?' disabled title="יש לכם פגישה אחרת בשעה הזו"':'')+'>'+x.t+'</button>':''}).join('')+'</div>'
        :'<div class="warn small">אין יותר שעות פנויות אצל המורה הזה. פנו למחנך/ת.</div>')+
        (sel?'<button class="link" data-act="ptime" data-tid="'+t.tid+'" data-id="">בלי פגישה אצל המורה הזה</button>':'')+'</div>'});
    h+='</section>';
    const n=Object.values(P.picks).filter(Boolean).length;
    if(left.length)h+='<div id="perr" class="err" role="alert"></div><button class="btn wide ok" data-act="pbook"'+(n?'':' disabled')+'>'+(n?'קביעת '+(n===1?'הפגישה':n+' פגישות'):'בחרו שעה')+'</button>';
  }
  root.innerHTML=parentShell(h);
  const sq=document.getElementById('sq');if(sq){sq.addEventListener('input',()=>{P.q=sq.value;document.getElementById('slist').innerHTML=stuList()})}
}
function stuList(){const d=P.data,f=fold(P.q);const L=d.students.filter(s=>!f||fold(s.n).split(' ').some(w=>w.startsWith(f))||fold(s.n).includes(f));
  if(!L.length)return '<div class="muted">לא נמצא. נסו רק שם פרטי או רק שם משפחה.</div>';
  return L.map(s=>{const all=d.teachers.length&&d.teachers.every(t=>s.done.includes(t.tid));
    return '<button class="pick" data-act="stu" data-n="'+esc(s.n)+'"><span>'+esc(s.n)+'</span>'+(all?'<span class="tag g">נקבע</span>':s.done.length?'<span class="tag o">נקבע חלקית</span>':'')+'</button>'}).join('')}

  const r=P.done,ev=P.data.event;
  const items=r.items;
  let h='<section class="card box"><div class="okbox"><h2>נקבע!</h2><div>'+items.map(i=>'<div><b>'+esc(i.t)+'</b> · '+esc(tName(i.teacher))+' · על '+esc(i.stu)+'</div>').join('')+'</div></div>'+
    '<div>שמרו את הקישור האישי. בו תראו את המקום בתור ביום עצמו, ומשם אפשר גם לבטל:</div>'+
    '<div class="row"><a class="btn sm" href="'+esc(myLink(r.ptoken))+'">לקישור האישי</a><button class="btn sec sm" data-act="copylink" data-l="'+esc(myLink(r.ptoken))+'">העתקת הקישור</button></div>'+
    '<div class="row"><button class="btn sec sm" data-act="icsall">הוספה ליומן בטלפון (עם תזכורת שעה לפני)</button>'+items.map(i=>'<a class="link" target="_blank" rel="noopener" href="'+esc(gcalLink(i,ev))+'">ליומן גוגל · '+esc(i.t)+'</a>').join('')+'</div>'+
    '<button class="btn sec wide" data-act="another">קביעת פגישה לילד נוסף</button></section>';

async function parentBook(){
  const d=P.data,picks=Object.values(P.picks).filter(Boolean);const el=document.getElementById('perr');
  P.parent=document.getElementById('pname').value.trim();P.phone=document.getElementById('pphone').value.trim();P.consent=document.getElementById('pcons').checked;
  if(!P.parent){el.textContent='נא לכתוב את שם ההורה.';return}
  if(!/^0?5\d{8}$/.test(P.phone.replace(/\D/g,'').replace(/^972/,'0'))){el.textContent='נא לכתוב מספר נייד תקין (למשל 050-1234567).';return}
  lsSet('yh_parent',P.parent);lsSet('yh_pphone',P.phone);
  P.busy=true;el.textContent='';
  try{
    const prev=myTokens()[0]||null;
    const r=await rpc('yh_book',{p_token:P.tok,p_student:P.stu,p_parent:P.parent,p_pphone:P.phone,p_consent:P.consent,p_picks:picks.map(p=>p.id),p_ptoken:prev});
    addMyToken(r.ptoken);
    const items=picks.map(p=>{const t=d.teachers.find(x=>x.tid===p.tid);return {id:p.id,t:p.t,teacher:t.name,room:t.room,stu:P.stu,link:myLink(r.ptoken)}}).sort((a,b)=>mins(a.t)-mins(b.t));
    P.done={ptoken:r.ptoken,items};
    renderDone();
  }catch(e){el.textContent=errMsg(e);try{P.data=await rpc('yh_class',{p_token:P.tok})}catch(x){}const keep=el.textContent;P.picks={};renderParent();const e2=document.getElementById('perr');if(e2)e2.textContent=keep}
  P.busy=false;
}
function parentClick(e){
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  const keep=()=>{const n=document.getElementById('pname'),p=document.getElementById('pphone'),c=document.getElementById('pcons');if(n)P.parent=n.value;if(p)P.phone=p.value;if(c)P.consent=c.checked};
  if(a==='stu'){P.stu=b.dataset.n;P.picks={};renderParent();window.scrollTo({top:0,behavior:'smooth'})}
  else if(a==='unstu'){keep();P.stu=null;P.picks={};renderParent()}
  else if(a==='ptime'){keep();const tid=+b.dataset.tid;P.picks[tid]=b.dataset.id?{id:+b.dataset.id,t:b.dataset.t,tid}:null;renderParent()}
  else if(a==='pbook')parentBook();
  else if(a==='copylink')copy(b.dataset.l);
  else if(a==='icsall')downloadIcs(P.done.items,P.data.event);
  else if(a==='ics'){const it=P.mine.items.find(i=>i.id===+b.dataset.id);if(it)downloadIcs([it],P.mine.ev)}
  else if(a==='another'){P.done=null;P.stu=null;P.picks={};P.q='';parentStart()}
  else if(a==='pcancel'){if(!confirm('לבטל את הפגישה?'))return;rpc('yh_cancel',{p_ptoken:b.dataset.tok,p_booking:+b.dataset.id}).then(()=>{toast('הפגישה בוטלה');parentStart()}).catch(x=>toast(errMsg(x)))}
}

async function load(){
  const d=await rpc('yh_staff_load',{p_phone:S.phone});
  d.P={};(d.participants||[]).forEach(p=>d.P[p.tid]=p);
  d.byT={};(d.slots||[]).forEach(s=>{(d.byT[s.tid]=d.byT[s.tid]||[]).push(s)});
  d.C={};(d.classes||[]).forEach(c=>d.C[c.name]=c);
  S.d=d;
  if(S.tid==null)S.tid=d.P[d.tid]?d.tid:(d.participants&&d.participants[0]?d.participants[0].tid:null);
  if(!S.cls){const mine=(d.classes||[]).find(c=>c.homeroom===d.tid);S.cls=mine?mine.name:(d.classes[0]&&d.classes[0].name)}
  if(!S.view)S.view=d.P[d.tid]?'diary':d.admin?'overview':'myclass';
}

function shell(inner){

  if(d.event&&(d.P[d.tid]||d.admin))nav.push(['diary','היומן שלי'],['live','היום עצמו']);
  if(d.event&&d.classes.length)nav.push(['myclass',d.admin?'כיתות':'הכיתה שלי']);

function notBookedFor(tid){const d=S.d,p=d.P[tid];if(!p)return[];const have=new Set((d.byT[tid]||[]).filter(s=>s.b).map(s=>s.b.cls+'|'+s.b.stu));const out=[];

      '<label class="f">תלמיד<select id="m_stu">'+(C?C.students:[]).map(n=>'<option'+(n===m.stu?' selected':'')+'>'+esc(n)+'</option>').join('')+'</select></label>'+
      (slot?'':'<label class="f">מורה ושעה<select id="m_slot">'+tids.map(t=>{const p=d.P[t];if(!p)return '';const tk=takenFor(t);return '<optgroup label="'+esc(tName(p.name))+'">'+(d.byT[t]||[]).filter(s=>!s.b&&!s.brk).map(s=>'<option value="'+s.id+'">'+s.t+' · '+esc(tName(p.name))+'</option>').join('')+'</optgroup>'}).join('')+'</select></label>')+
      '<div class="grid2"><label class="f">שם ההורה<input type="text" id="m_par"></label><label class="f">טלפון (לתזכורת)<input type="tel" id="m_ph" inputmode="tel"></label></div><div id="m_err" class="err" role="alert"></div></div>'+
      '<div class="mfoot"><button class="btn ok" data-act="mdo">שיבוץ</button><button class="btn sec" data-act="close">ביטול</button></div></div></div>'}
  if(m.kind==='move'){
    const s0=d.slots.find(s=>s.b&&s.b.id===m.bid);const fr=(d.byT[s0.tid]||[]).filter(s=>!s.b&&!s.brk);
    return '<div class="overlay" data-act="close"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mh"><div class="mhead" id="mh">הזזת הפגישה של '+esc(s0.b.stu)+'</div><div class="mbody"><div>עכשיו: <b>'+s0.t+'</b>. לאיזו שעה?</div>'+
      '<div class="times">'+fr.map(s=>'<button data-act="mvto" data-id="'+s.id+'">'+s.t+'</button>').join('')+'</div><div class="small muted">כדאי לעדכן את ההורה. הקישור האישי שלו מתעדכן לבד.</div></div><div class="mfoot"><button class="btn sec" data-act="close">ביטול</button></div></div></div>'}
  return '';
}

/* ----- אירועים ----- */
async function act(fn,args,msg){if(S.busy)return;S.busy=true;try{await rpc(fn,args);if(msg)toast(msg);S.modal=null;await load()}catch(e){toast(errMsg(e))}S.busy=false;S.keepScroll=true;render()}
function staffClick(e){
  const g=e.target.closest('[data-go]');if(g){S.view=g.dataset.go;S.filter=null;render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='close'){if(e.target===b||b.tagName==='BUTTON'){S.modal=null;render()}return}
  if(a==='logout'){lsSet('hanhala_phone',null);S.phone=null;S.d=null;return renderLogin()}
  if(a==='print')return print();
  if(a==='filter'){S.filter=b.dataset.f;S.keepScroll=true;return render()}
  if(a==='kpi'){const k=b.dataset.k;
    if(['f-taken','f-free','f-brk'].includes(k)){S.filter=k;S.keepScroll=true;render()}
    const id={'f-nb':'nb','c-full':'ctab','c-none':'ctab','o-cls':'ocls','o-t':'ot'}[k];if(id){const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth'})}
    if(k==='c-reg'&&S.d.admin){S.view='settings';render()}
    if(k==='c-t'){S.view='overview';render()}
    return}
  if(a==='brk')return act('yh_slot_break',{p_phone:S.phone,p_slot:+b.dataset.id,p_break:b.dataset.v==='1'});
  if(a==='scancel'){if(!confirm('לבטל את הפגישה? כדאי לעדכן את ההורה.'))return;return act('yh_staff_cancel',{p_phone:S.phone,p_booking:+b.dataset.id},'הפגישה בוטלה')}
  if(a==='mbook'){const s=S.d.slots.find(x=>x.id===+b.dataset.id);S.modal={kind:'book',slot:s.id,cls:S.d.P[s.tid].classes[0]};return render()}
  if(a==='cbook'){S.modal={kind:'book',cls:S.cls,stu:b.dataset.n};return render()}
  if(a==='move'){S.modal={kind:'move',bid:+b.dataset.id};return render()}
  if(a==='mvto')return act('yh_staff_move',{p_phone:S.phone,p_booking:S.modal.bid,p_slot:+b.dataset.id},'הפגישה הוזזה');
  if(a==='mdo'){const m=S.modal,slot=m.slot||+(document.getElementById('m_slot')||{}).value;const cls=(document.getElementById('m_cls')||{}).value||m.cls;
    if(!slot){document.getElementById('m_err').textContent='אין שעה פנויה.';return}
    S.busy=true;rpc('yh_staff_book',{p_phone:S.phone,p_slot:slot,p_class:cls,p_student:document.getElementById('m_stu').value,p_parent:document.getElementById('m_par').value,p_pphone:document.getElementById('m_ph').value})
      .then(async()=>{S.modal=null;toast('שובץ');await load();S.busy=false;S.keepScroll=true;render()}).catch(x=>{S.busy=false;document.getElementById('m_err').textContent=errMsg(x)});return}
  if(a==='live')return act('yh_live',{p_phone:S.phone,p_booking:+b.dataset.id,p_action:b.dataset.a});
  if(a==='copytxt')return copy(b.dataset.t);
  if(a==='gocls'){S.cls=b.dataset.c;S.view='myclass';render();return window.scrollTo(0,0)}
  if(a==='gotid'){S.tid=+b.dataset.t;S.view='diary';render();return window.scrollTo(0,0)}
  if(a==='pcls'){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');return}
  if(a==='prem'){b.closest('tr').remove();return}
  if(a==='padd'){const sel=document.getElementById('addt'),tid=+sel.value;if(!tid)return;const t=S.d.teachers.find(x=>x.id===tid);
    const parts=collectParts();parts.push({tid,classes:[],t_start:'',t_end:'',room:''});S.d.participants=parts.map(p=>Object.assign({name:(S.d.P[p.tid]||{}).name||t.name},p));S.d.P={};S.d.participants.forEach(p=>S.d.P[p.tid]=p);S.keepScroll=true;render();toast('נוסף. בחרו לו כיתות ולחצו "שמירה ובניית הלוח".');return}
  if(a==='saveparts'){const parts=collectParts();const empty=parts.filter(p=>!p.classes.length);if(empty.length){toast('לכל מורה צריך לבחור לפחות כיתה אחת');return}
    S.busy=true;(async()=>{try{await rpc('yh_admin_set_participants',{p_phone:S.phone,p_list:parts});const r=await rpc('yh_admin_build',{p_phone:S.phone});toast('נשמר. נוספו '+r.added+' משבצות'+(r.removed?', הוסרו '+r.removed:''));await load()}catch(x){toast(errMsg(x))}S.busy=false;S.keepScroll=true;render()})();return}
  if(a==='saveev'){const v=id=>document.getElementById(id).value;const ev={day:v('e_day'),t_start:v('e_ts'),t_end:v('e_te'),slot_min:+v('e_sm'),gap_min:+v('e_gm'),reg_close:v('e_rc'),note:v('e_note').trim(),reg_open:document.getElementById('e_open').checked};
    if(!ev.day||!ev.t_start||!ev.t_end||ev.t_end<=ev.t_start){toast('בדקו את התאריך והשעות');return}
    S.busy=true;(async()=>{try{await rpc('yh_admin_save_event',{p_phone:S.phone,p_ev:ev});const r=await rpc('yh_admin_build',{p_phone:S.phone});toast('נשמר'+(r.added||r.removed?' · הלוח עודכן':''));await load()}catch(x){toast(errMsg(x))}S.busy=false;S.keepScroll=true;render()})();return}
}
function staffChange(e){const t=e.target;
  if(t.dataset.act==='tsel'){S.tid=+t.value;render()}
  else if(t.dataset.act==='csel'){S.cls=t.value;render()}
  else if(t.id==='m_cls'){S.modal.cls=t.value;S.modal.stu=null;render()}
}
async function staffStart(){
  root.addEventListener('click',staffClick);root.addEventListener('change',staffChange);
  root.addEventListener('submit',async e=>{if(e.target.id!=='loginForm')return;e.preventDefault();const ph=document.getElementById('ph').value;
    try{await rpc('yh_staff_load',{p_phone:ph});S.phone=ph;lsSet('hanhala_phone',ph);await refresh()}catch(x){renderLogin(/no_access/.test(x.message)?'המספר הזה לא מורשה להיכנס.':errMsg(x))}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render()}});
  if(!S.phone)return renderLogin();
  await refresh();
  // רענון אוטומטי (בעיקר ביום עצמו)
  S.timer=setInterval(()=>{if(document.hidden||S.busy||S.modal||!S.phone||document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;refresh(true)},S.d&&S.d.event&&S.d.event.day===todayIso()?20000:60000);
  const s=document.createElement('script');s.src='/feedback/badge.js';s.defer=true;document.body.appendChild(s);
}

if(P.tok||P.ptok){root.addEventListener('click',parentClick);parentStart()}else staffStart();
</script>
