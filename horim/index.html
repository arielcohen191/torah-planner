<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:Heebo,Assistant,system-ui,sans-serif;font-size:17px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}

.kpi .n{font-size:52px;line-height:52px;font-weight:200}
.kpi .go{display:block;font-size:13px;opacity:.85;margin-top:4px;text-decoration:underline;text-underline-offset:3px}
.k-red{background:var(--red)}.k-orange{background:var(--orange)}.k-green{background:var(--green)}.k-blue{background:var(--blue)}
.box{padding:20px 24px;display:flex;flex-direction:column;gap:14px}

textarea{padding:12px 14px;min-height:90px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid #9cc3ef;outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.check{display:flex;align-items:flex-start;gap:12px;font-size:16px;min-height:44px}

.slot.free{border-right-color:#b9c4d0}.slot.taken{border-right-color:var(--brand)}.slot.brk{border-right-color:#8a96a4;opacity:.7}

td{padding:10px;background:var(--card-muted);vertical-align:middle}

.tablewrap{overflow-x:auto}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(31,42,55,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:100%;max-width:540px;max-height:94vh;overflow:auto;background:#fff;border-radius:var(--r-lg);box-shadow:0 20px 50px rgba(0,0,0,.25)}

.modal .mbody{padding:22px;display:flex;flex-direction:column;gap:14px}
.modal .mfoot{display:flex;gap:10px;padding:0 22px 22px}.modal .mfoot .btn{flex:1}
.warn{background:#fdf1dc;border-right:6px solid var(--orange);border-radius:var(--r-sm);padding:10px 14px;font-size:16px}
.info{background:#eaf3fc;border-right:6px solid var(--brand);border-radius:var(--r-sm);padding:10px 14px;font-size:16px}
.okbox{background:#e9f5e2;border-right:6px solid var(--green);border-radius:var(--r-sm);padding:14px 16px}
.err{color:var(--red);font-weight:600}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 24px;border-radius:var(--r-md);font-size:17px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:92vw}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .card{width:100%;max-width:440px;padding:32px;display:flex;flex-direction:column;gap:16px}
.loading{padding:40px;text-align:center;color:var(--ink-muted)}
.credit{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink-muted);font-size:13px;padding:12px}
.credit img{height:28px}
.bar{height:10px;border-radius:99px;background:#e4e9ef;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.big{font-size:44px;font-weight:200;line-height:1}
/* הורים */
.pp{max-width:640px;margin:0 auto;padding:16px 14px 60px;display:flex;flex-direction:column;gap:16px}
.phead{display:flex;align-items:center;gap:14px;padding:16px 18px}
.phead img{height:52px;flex:none}
.step{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.tcard{border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:10px}
.tcard.picked{border-color:var(--green);background:#f6fbf3}
.meet{display:flex;flex-direction:column;gap:8px;padding:16px 18px;border-right:6px solid var(--brand)}
.meet .tm{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.meet.now{border-right-color:var(--orange);background:#fdf3e2}.meet.done{border-right-color:var(--green)}
/* דף ההורה: עיצוב */
.ppbg{min-height:100vh;background:radial-gradient(900px 420px at 85% -80px,#cfe3fa 0,transparent 70%),radial-gradient(700px 380px at 0 0,#fff1cf 0,transparent 65%),var(--ground)}
.pp .card{border-radius:18px;box-shadow:0 1px 2px rgba(31,42,55,.06),0 8px 24px rgba(31,42,55,.07)}
.phero{position:relative;overflow:hidden;border-radius:22px;padding:20px;color:#fff;background:linear-gradient(135deg,#17497f 0,#2f7fd6 62%,#5aaef0 100%);display:flex;align-items:center;gap:14px;box-shadow:0 12px 28px rgba(31,95,166,.30)}
.phero:before,.phero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.phero:before{width:220px;height:220px;left:-70px;top:-110px}.phero:after{width:150px;height:150px;left:70px;bottom:-100px}
.phero>*{position:relative}
.phero .lg{background:#fff;border-radius:16px;padding:8px 10px;display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.15)}.phero .lg img{height:40px;display:block}
.phero h1{font-size:24px;line-height:30px;color:#fff}.phero .sub{font-size:15px;opacity:.92}
.datechip{margin-inline-start:auto;flex:none;background:#fff;color:var(--ink);border-radius:14px;min-width:72px;text-align:center;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.datechip .m{background:#ffc94d;color:#553900;font-size:13px;font-weight:700;padding:2px 8px}
.datechip .d{font-size:28px;font-weight:700;line-height:34px;padding:0 6px}.datechip .w{line-height:1.25;padding:0 6px 5px}.datechip .w{font-size:12.5px;color:var(--ink-muted);padding-bottom:5px}
.psteps{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.psteps li{flex:1;min-width:0;display:flex;align-items:center;gap:7px;background:#fff;border-radius:99px;padding:6px 8px;font-size:14px;font-weight:600;color:var(--ink-muted);box-shadow:var(--shadow);white-space:nowrap}
.psteps li i{font-style:normal;width:24px;height:24px;border-radius:50%;background:#e4e9ef;display:grid;place-items:center;font-size:13px;flex:none}
.psteps li.on{color:var(--brand-dark);box-shadow:0 0 0 2px var(--brand)}.psteps li.on i{background:var(--brand);color:#fff}
.psteps li.dn{color:var(--green-ink)}.psteps li.dn i{background:var(--green);color:#fff}
.pp .step .n{width:32px;height:32px;box-shadow:0 3px 8px rgba(47,127,214,.35)}.pp .step.dn .n{background:var(--green);box-shadow:0 3px 8px rgba(79,154,42,.35)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;flex:none;color:#fff}

.pp .pick>.nm{flex:1;min-width:0}.pp .pick:hover{border-color:var(--brand);box-shadow:0 4px 12px rgba(47,127,214,.15);transform:translateY(-1px)}
.pp .tcard{border-radius:16px;gap:12px;transition:border-color .15s,background .15s}.pp .tcard.picked{border-color:var(--green);background:#f4faf0}
.thd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.thd b{font-size:18px}
.hrs{display:flex;flex-direction:column;gap:10px}
.hr{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px;align-items:start}
.hr .hl{font-size:26px;font-weight:200;line-height:48px;text-align:center;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.pp .times{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.pp .times button{min-width:0;border-radius:12px;transition:transform .1s,box-shadow .1s,border-color .1s}
.pp .times button:not([disabled]):hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:0 4px 10px rgba(47,127,214,.18)}
.pp .times button[aria-pressed="true"]{background:linear-gradient(135deg,#1f5fa6,#2f7fd6);border-color:#1f5fa6;box-shadow:0 6px 14px rgba(47,127,214,.40);transform:scale(1.05)}
.pcta{position:sticky;bottom:10px;z-index:5;background:#fff;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(31,42,55,.24)}
.pcta .sum{font-size:15px;text-align:center}.pcta .btn{border-radius:14px;min-height:56px;font-size:19px}
.pdone{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.pdone .ck{width:72px;height:72px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:40px;box-shadow:0 8px 20px rgba(79,154,42,.35);animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}

.tbanner{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 16px;box-shadow:var(--shadow)}.tbanner b{font-size:18px}
.subj{border:2px dashed #b9d2ee}.bubs{display:flex;flex-wrap:wrap;gap:10px}
.bub{display:inline-flex;align-items:center;gap:10px;background:#eef5fc;border:1.5px solid #b9d2ee;border-radius:999px;padding:6px 16px 6px 8px;text-decoration:none;color:var(--ink);min-height:52px;transition:transform .1s,box-shadow .1s}

.nowin{background:var(--soft,#eef4fb);border-radius:10px;padding:8px 12px;font-size:17px;margin:6px 0}
#htab tr.dirty td{background:#fff6d6}
.dhd{font-weight:700;color:var(--brand-dark);margin-top:6px;padding-bottom:2px;border-bottom:1.5px solid var(--line)}
.tkt{display:flex;align-items:center;gap:14px;background:var(--card-muted);border-radius:14px;padding:12px 16px;border-right:6px solid var(--green);text-align:right}
.tkt .tm{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.pp .meet{border-radius:16px}
@media (prefers-reduced-motion:reduce){.pdone .ck{animation:none}.pp .times button,.pp .pick{transition:none}}
@media (max-width:480px){.phero{padding:16px 14px;gap:10px}.phero h1{font-size:21px}.phero .lg img{height:32px}.psteps li{font-size:13px;padding:5px 6px;gap:5px}}

@media (max-width:760px){
 .app{flex-direction:column}
 nav.rail{flex:0 0 auto;flex-direction:row;padding:6px;gap:4px;position:sticky;bottom:0;order:2;justify-content:space-around;z-index:20}
 .rail .brand,.rail .spacer,.rail .who{display:none}

}
@media print{nav.rail,.acts,.noprint,.kfb-btn{display:none!important}main{padding:0}}

  let s='';n=n%1000;while(n>0){if(n===15){s+='טו';break}if(n===16){s+='טז';break}const x=L.find(p=>p[0]<=n);s+=x[1];n-=x[0]}
  return s.length>1?s.slice(0,-1)+'״'+s.slice(-1):s+'׳'}

function icsFor(items,ev){
  const z=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//kanfei-ruach//yom-horim//HE','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  items.forEach(it=>{const s=new Date((it.day||ev.day)+'T'+hm(it.t)+':00'),e=new Date(s.getTime()+(it.slot_min||ev.slot_min)*60000);
    lines.push('BEGIN:VEVENT','UID:yh-'+it.id+'@kanfei-ruach','DTSTAMP:'+z(new Date()),'DTSTART:'+z(s),'DTEND:'+z(e),
      'SUMMARY:'+('יום הורים · '+tName(it.teacher)+' · '+it.stu).replace(/[,;]/g,' '),
      'LOCATION:'+('כנפי רוח'+(it.room?' · '+it.room:'')).replace(/[,;]/g,' '),
      'DESCRIPTION:'+('המקום בתור: '+(it.link||'')).replace(/[,;]/g,' '),
      'BEGIN:VALARM','TRIGGER:-PT60M','ACTION:DISPLAY','DESCRIPTION:תזכורת: יום הורים','END:VALARM','END:VEVENT')});
  lines.push('END:VCALENDAR');return lines.join('\r\n');
}
function downloadIcs(items,ev){const b=new Blob([icsFor(items,ev)],{type:'text/calendar'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='yom-horim.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function gcalLink(it,ev){const z=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');const s=new Date((it.day||ev.day)+'T'+hm(it.t)+':00'),e=new Date(s.getTime()+(it.slot_min||ev.slot_min)*60000);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('יום הורים · '+tName(it.teacher)+' · '+it.stu)+'&dates='+z(s)+'/'+z(e)+'&location='+encodeURIComponent('כנפי רוח'+(it.room?' · '+it.room:''))+'&details='+encodeURIComponent('המקום בתור: '+(it.link||''))}

/* ---------- תור חי: זמן משוער ---------- */
/* q: רשימת הפגישות של המורה לפי סדר (t, s=התחיל, e=הסתיים, n=לא הגיע). מחזיר את העיכוב בדקות ואת מצב הפגישה הנוכחית */
function liveInfo(q,slotMin,now){
  now=now||new Date();let delay=0,cur=null;
  q.forEach(x=>{if(x.s){const sched=mins(x.t),st=new Date(x.s);const stM=st.getHours()*60+st.getMinutes()+st.getSeconds()/60;delay=Math.max(0,stM-sched);if(!x.e)cur=x}});
  if(cur){const st=new Date(cur.s);const over=(now-st)/60000-slotMin;if(over>0)delay+=over}
  return {delay:Math.round(delay),cur};
}

async function parentBook(){
  const d=P.data,picks=Object.values(P.picks).filter(Boolean);const el=document.getElementById('perr');
  P.parent=document.getElementById('pname').value.trim();P.phone=document.getElementById('pphone').value.trim();P.consent=document.getElementById('pcons').checked;

  lsSet('yh_parent',P.parent);lsSet('yh_pphone',P.phone);
  P.busy=true;el.textContent='';

    const prev=myTokens()[0]||null;

    P.done={ptoken:r.ptoken,items};

  }catch(e){el.textContent=errMsg(e);try{await reloadData()}catch(x){}const keep=el.textContent;P.picks={};renderParent();const e2=document.getElementById('perr');if(e2)e2.textContent=keep}

function parentClick(e){
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='demoreset')return demoReset();
  const keep=()=>{const n=document.getElementById('pname'),p=document.getElementById('pphone'),c=document.getElementById('pcons');if(n)P.parent=n.value;if(p)P.phone=p.value;if(c)P.consent=c.checked};
  if(a==='stu'){P.stu=b.dataset.n;P.picks={};renderParent();window.scrollTo({top:0,behavior:'smooth'})}
  else if(a==='unstu'){keep();P.stu=null;P.sep=false;P.picks={};renderParent()}
  else if(a==='ptime'){keep();const tid=+b.dataset.tid;P.picks[tid]=b.dataset.id?{id:+b.dataset.id,t:b.dataset.t,d:b.dataset.d||null,tid}:null;renderParent()}
  else if(a==='bub'){keep();if(P.parent)lsSet('yh_parent',P.parent);if(P.phone)lsSet('yh_pphone',P.phone)}
  else if(a==='pbook')parentBook();
  else if(a==='tcls'){P.tcls=b.dataset.c;P.data=tData(P.tdata.classes.find(c=>c.name===P.tcls));P.stu=null;P.picks={};renderParent();window.scrollTo(0,0)}
  else if(a==='untcls'){keep();P.tcls=null;P.data=null;P.stu=null;P.picks={};renderParent()}
  else if(a==='copylink')copy(b.dataset.l);
  else if(a==='icsall')downloadIcs(P.done.items,P.data.event);
  else if(a==='ics'){const it=P.mine.items.find(i=>i.id===+b.dataset.id);if(it)downloadIcs([it],P.mine.ev)}
  else if(a==='another'){P.done=null;P.stu=null;P.sep=false;P.picks={};P.q='';parentStart()}
  else if(a==='sep'){P.sep=true;P.picks={};P.parent='';P.phone='';renderParent()}

}

  d.edays=(d.event&&d.event.days)||(d.event?[d.event.day]:[]);d.multi=d.edays.length>1||(d.slots||[]).some(s=>s.d&&d.event&&s.d!==d.event.day);

/* ----- טיימר לפגישה: כמה זמן נשאר, וצפצוף לפני הסוף (משוב #50) ----- */
const BEEP=(()=>{try{return Object.assign({on:true,min:2},JSON.parse(localStorage.getItem('yh_beep')||'{}'))}catch(e){return {on:true,min:2}}})();

let ACX=null;const BEEPED={};
function beep(n){try{ACX=ACX||new (window.AudioContext||window.webkitAudioContext)();if(ACX.state==='suspended')ACX.resume();
  for(let i=0;i<(n||2);i++){const o=ACX.createOscillator(),g=ACX.createGain(),t=ACX.currentTime+i*0.35;o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.5,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);o.connect(g);g.connect(ACX.destination);o.start(t);o.stop(t+0.3)}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,120,200])}catch(e){}}
function lvTimer(id,start,len){return '<span class="lvt" id="lvt" data-id="'+id+'" data-s="'+start+'" data-l="'+len+'" style="font-size:22px;font-weight:800;font-variant-numeric:tabular-nums"></span>'}
setInterval(()=>{const el=document.getElementById('lvt');if(!el)return;const end=+el.dataset.s+(+el.dataset.l)*60000,left=Math.round((end-Date.now())/1000),id=el.dataset.id;
  const a=Math.abs(left),txt=(left<0?'+':'')+Math.floor(a/60)+':'+String(a%60).padStart(2,'0');
  el.textContent=left>=0?'נשארו '+txt:'חריגה '+txt;el.style.color=left<0?'var(--red)':left<=BEEP.min*60?'var(--orange)':'';
  if(!BEEP.on)return;
  if(left<=BEEP.min*60&&left>BEEP.min*60-5&&!BEEPED[id+'w']){BEEPED[id+'w']=1;beep(2)}
  if(left<=0&&left>-5&&!BEEPED[id+'e']){BEEPED[id+'e']=1;beep(3)}},1000);

/* ----- שעות ותאריכים: מנהל/ת בית ומנהל מערכת, ברמת כיתה ומורה ----- */
function canEditT(p){const d=S.d;if(d.admin)return true;const hg=d.house||[];return d.classes.some(c=>hg.includes(c.name[0])&&(c.homeroom===p.tid||p.classes.includes(c.name)))}
function viewHours(){
  const d=S.d,e=d.event,ed=d.edays,ps=d.participants.filter(canEditT);
  const cl=p=>{const c=d.classes.find(c=>c.homeroom===p.tid);return c?c.name:''};
  ps.sort((a,b)=>(cl(a)||'ת'+a.classes[0]||'').localeCompare(cl(b)||'ת'+b.classes[0]||'','he'));

const isHrT=tid=>!!(S.d&&S.d.classes.some(c=>c.homeroom===tid));
/* המשבצות כמו בשרת: רצף פגישות, וכשפגישה הייתה חוצה תחילת הפסקה היא מתחילה אחריה. n = כמה פגישות (למחנך), או עד שעת הסיום */
function simSlots(ts,te,sm,n){const p=S.d.P[S.tid]||{},g=S.d.event.gap_min||0,st=mins(ts),br=(p.breaks||[]).map(x=>[mins(x.at),+x.min]).filter(x=>x[1]>0&&x[0]+x[1]>st).sort((a,b)=>a[0]-b[0]);
  const out=[];let t=st,bi=0;for(;;){while(bi<br.length&&t+sm>br[bi][0]){t=Math.max(t,br[bi][0])+br[bi][1];bi++}
    if(n!=null&&out.length>=n)break;if(n==null&&t+sm>mins(te))break;if(t+sm>23*60+59||out.length>=300)break;out.push(t);t+=sm+g}return out}
const hhmm=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function autoEnd(){const p=S.d.P[S.tid]||{},ts=document.getElementById('h_ts').value,sm=+document.getElementById('h_sm').value;if(!ts||!sm)return '';
  const a=simSlots(ts,null,sm,Math.max(1,p.meet_n||p.students_n||0));return hhmm(a.length?a[a.length-1]+sm:mins(ts)+sm)}
/* שינוי שעלול להוציא פגישות שכבר נקבעו מהלוח (שעות, אורך, מספר פגישות, הפסקות, תאריך): קודם בודקים בשרת,
   ואם יש כאלה — שואלים מה לעשות איתן. run = הפעולה ששומרת (מחזירה promise). */

function hoursRow(tr){const ed=S.d.edays,q=c=>tr.querySelector('.'+c).value,tid=+tr.dataset.tid,p=S.d.P[tid];const k=q('hday');
  const gr=tr.querySelector('.hgr').checked,mn=tr.querySelector('.hmn'),mnv=mn?(mn.value===''||+mn.value===(p||{}).students_n?'':String(+mn.value)):undefined;
  const base={tid,t_start:q('hts')||null,t_end:q('hte')||null,slot_min:+q('hsm')||null,gradual:gr,...(mn?{meet_n:mnv}:{})};
  if(q('hts')&&q('hte')&&q('hte')<=q('hts'))return {bad:'בדקו את השעות של '+tName(p.name)};
  if(k==='pending')return {item:{...base,pending:true}};
  if(k==='keep')return {item:{...base,pending:false}};
  const days=k==='both'?ed.slice():k==='alt'?[q('halt')]:[k.slice(2)];
  if(k==='alt'&&!q('halt'))return {bad:'בחרו תאריך חלופי ל'+tName(p.name)};
  if(!S.d.classes.some(c=>c.homeroom===tid)&&days.length>1)return {bad:tName(p.name)+' מורה מקצועי, נפגש בתאריך אחד בלבד'};

  if(t.dataset.act==='tsel'){const v=t.value.trim(),ps=S.d.participants,p=ps.find(x=>tName(x.name)===v)||ps.find(x=>tName(x.name).includes(v)||x.name.includes(v));if(p){if(p.tid!==S.tid){S.tid=p.tid;setTimeout(render,0)}}else toast('לא נמצא מורה בשם הזה')}
  else if(t.dataset.act==='csel'){S.cls=t.value;render()}
  else if(t.id==='m_cls'){S.modal.cls=t.value;S.modal.stu=null;render()}
}
async function staffStart(){
  root.addEventListener('click',staffClick);root.addEventListener('change',staffChange);const markDirty=e=>{const tr=e.target.closest&&e.target.closest('#htab tr');if(tr)tr.classList.add('dirty')};root.addEventListener('change',markDirty);
  root.addEventListener('input',e=>{markDirty(e);if(e.target.classList.contains('tfind'))return applyFind(e.target);if(e.target.id==='lnote')S.lnote={id:+e.target.dataset.id,v:e.target.value}});
  root.addEventListener('submit',async e=>{if(e.target.id!=='loginForm')return;e.preventDefault();const ph=document.getElementById('ph').value;
    try{await rpc('yh_staff_load',{p_phone:ph});S.phone=ph;lsSet('hanhala_phone',ph);await refresh()}catch(x){renderLogin(/no_access/.test(x.message)?'המספר הזה לא מורשה להיכנס.':errMsg(x))}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render()}});
  if(!S.phone)return renderLogin();
  await refresh();
  // רענון אוטומטי (בעיקר ביום עצמו)
  S.timer=setInterval(()=>{if(document.hidden||S.busy||S.modal||!S.phone||document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;refresh(true)},S.d&&S.d.event&&S.d.event.day===todayIso()?20000:60000);
  const s=document.createElement('script');s.src='/feedback/badge.js';s.defer=true;document.body.appendChild(s);
}

if(P.tok||P.ptok||P.ttok){root.addEventListener('click',parentClick);parentStart()}else staffStart();
</script>
