<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>תורנויות חצר · כנפי רוח</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;400;500;600;700&display=swap">
<style>
:root{--ground:#eef1f5;--card:#fff;--card-muted:#f5f7fa;--line:#dfe4ea;--ink:#1f2a37;--ink-muted:#5b6878;--rail:#26323f;--rail-ink:#c9d3de;
--brand:#2f7fd6;--brand-dark:#1f5fa6;--blue:#4a8ec9;--green:#4f9a2a;--orange:#c77700;--red:#c62a20;--active:#2fbf71;--r-sm:6px;--r-md:10px;--r-lg:14px;--shadow:0 1px 3px rgba(31,42,55,.10)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:Heebo,system-ui,sans-serif;font-size:17px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.app{display:flex;min-height:100vh}
nav.rail{flex:0 0 104px;background:var(--rail);display:flex;flex-direction:column;gap:8px;padding:24px 8px}
.rail .brand{color:#fff;font-weight:700;font-size:15px;text-align:center;padding-bottom:16px;border-bottom:1px solid #3a4756;margin-bottom:4px}
.rail button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:var(--r-md);background:none;border:0;color:var(--rail-ink);font-size:14px}
.rail button svg{width:26px;height:26px}
.rail button[aria-current="page"]{background:var(--active);color:#fff;font-weight:600}
.rail .spacer{flex:1}.rail .who{color:var(--rail-ink);font-size:13px;text-align:center}
main{flex:1;min-width:0;padding:24px 32px 48px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow);padding:20px 24px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:26px;font-weight:700}h2{margin:0 0 12px;font-size:20px;font-weight:600}h3{margin:0 0 8px;font-size:17px;font-weight:600}
.muted{color:var(--ink-muted)}.small{font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 24px;border-radius:var(--r-md);border:0;background:var(--brand);color:#fff;font-size:18px;font-weight:600}
.btn:hover{background:var(--brand-dark)}.btn.sec{background:#fff;color:var(--ink);border:1.5px solid #c9d1db}.btn.sec:hover{background:var(--card-muted)}
.btn.sm{min-height:44px;padding:0 16px;font-size:16px}.btn[disabled]{opacity:.6;cursor:wait}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{border-radius:var(--r-lg);padding:18px 22px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:104px}
.kpi b{display:block;font-size:19px;font-weight:600}.kpi span{font-size:14px;opacity:.95}.kpi .n{font-size:56px;line-height:56px;font-weight:200}
.k-red{background:var(--red)}.k-orange{background:var(--orange)}.k-green{background:var(--green)}.k-blue{background:var(--blue)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card-muted);border-radius:var(--r-sm);border-right:6px solid var(--line);padding:12px 16px}
.item.red{border-right-color:var(--red)}.item.orange{border-right-color:var(--orange)}.item.green{border-right-color:var(--green)}
.item b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:14px}
.chip.warn{background:#fff4e0;border-color:#f0c27a}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:collapse;width:100%;font-size:15px;min-width:760px}
table.grid th,table.grid td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:right}
table.grid thead th{background:var(--rail);color:#fff;font-weight:600;position:sticky;top:0}
table.grid th.st{background:var(--card-muted);color:var(--ink);font-weight:500;min-width:170px}
td.cell{cursor:pointer;min-width:110px}
td.cell:hover{background:#eaf3fd}
td.cell.empty{background:#fdecea}
td.cell.empty::before{content:'חסר';color:var(--red);font-weight:600}
td.cell.off{background:repeating-linear-gradient(45deg,#f5f7fa,#f5f7fa 6px,#eceff3 6px,#eceff3 12px);cursor:default}
td.cell .lk{font-size:12px;color:var(--brand)}
td.cell.me{background:#fff1b8;font-weight:700;box-shadow:inset 0 0 0 2px #e0a800}
td.cell.can{box-shadow:inset 0 0 0 2px #4f9a2a;background:#f2f9ee}
.focusing td.cell:not(.me):not(.can):not(.off){opacity:.55}
.wk td{text-align:center;vertical-align:middle;min-width:96px;height:56px;font-size:14px}
.wk td.a{background:#fff1b8;font-weight:600;cursor:pointer}
.wk td.f{background:#eef7e8;color:var(--green);cursor:pointer;border:2px dashed #9fcf86}
.wk td.f:hover,.wk td.a:hover{filter:brightness(.96)}
.wk td.x{color:var(--ink-muted);font-size:12px;background:var(--card-muted)}
.focusbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.focusbar select{min-height:48px;border:1.5px solid #c9d1db;border-radius:var(--r-md);padding:0 12px;font-size:17px;background:#fff;min-width:260px}
.kv{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px}.kv span b{font-weight:600}
td.cell .ly{display:block;font-size:12px;color:var(--ink-muted)}
.lay{display:inline-block;min-width:22px;text-align:center;font-size:12px;border-radius:4px;background:#e8eef5;margin-inline-start:4px}
table.staff{border-collapse:collapse;width:100%;font-size:15px;min-width:980px}
table.staff th,table.staff td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:right;vertical-align:top}
table.staff th{font-weight:600;color:var(--ink-muted);font-size:14px}
table.staff tr.out td{opacity:.55}
table.staff select,table.staff input{min-height:38px;border:1.5px solid #c9d1db;border-radius:8px;padding:0 6px;font-size:15px;background:#fff}
table.staff input.n{width:56px}
.load{font-weight:600}.load.lo{color:var(--red)}.load.ok{color:var(--green)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{border:1.5px solid #c9d1db;background:#fff;border-radius:999px;padding:6px 16px;font-size:16px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
input[type=tel],input[type=search],textarea,.fsel{border:1.5px solid #c9d1db;border-radius:var(--r-md);padding:10px 14px;font-size:17px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #9cc3ef;outline-offset:1px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
.err{color:var(--red);font-weight:600}
.loading{padding:40px;text-align:center;color:var(--ink-muted)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:var(--r-md);z-index:60}
.overlay{position:fixed;inset:0;background:rgba(20,28,38,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;background:#fff;border-radius:var(--r-lg);overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .mhead{background:var(--brand);color:#fff;padding:16px 22px;font-size:19px;font-weight:600}
.modal .mbody{padding:18px 22px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.modal .mfoot{display:flex;gap:10px;padding:14px 22px;border-top:1px solid var(--line)}
.cand{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:right;background:var(--card-muted);border:1.5px solid transparent;border-radius:var(--r-sm);padding:10px 14px;font-size:16px}
.cand:hover{border-color:var(--brand)}.cand.cur{border-color:var(--green);background:#eef7e8}
.cand small{color:var(--ink-muted)}
.note{background:#fff8e6;border:1px solid #f0d48a;border-radius:var(--r-sm);padding:12px 16px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:16px}}
@media (max-width:760px){.app{flex-direction:column}nav.rail{flex-direction:row;flex:none;padding:8px;overflow-x:auto}.rail .brand,.rail .spacer,.rail .who{display:none}.rail button{flex:1;min-width:72px}}
@media print{nav.rail,.noprint,.toast{display:none!important}main{padding:0}body{background:#fff;font-size:12px}.card{box-shadow:none;padding:0;margin-bottom:12px;break-inside:avoid}
 table.grid{font-size:11px;min-width:0}table.grid thead th{background:#ddd;color:#000}td.cell.empty{background:#fff}td.cell .lk{display:none}}
</style>
</head>
<body>
<div id="root"><div class="loading">טוען…</div></div>
<script src="engine.js"></script>
<script>
const CFG={url:'https://onocjgbtensczpdbeanf.supabase.co',key:'sb_publishable_JpV-E-qPnV9ZdnRnY9Kv8Q_TaRzCnyc'};
async function rpc(fn,args){
  const r=await fetch(CFG.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const m=(j&&j.message)||t;throw new Error(/no_access/.test(m)?'no_access':/conflict/.test(m)?'conflict':m)}
  return j;
}
const T=window.Toranut, D=T.DAYS;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root=document.getElementById('root');
let toastT;function toast(m){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3200)}

/* ---------- state ---------- */
const S={phone:null,me:null,view:'sum',tt:{},data:null,at:null,cfg:null,R:null,C:null,shiftTab:'b1',staffFilter:'all',q:'',modal:null,busy:false,ruleFilter:'all'};
try{S.phone=localStorage.getItem('milui_phone')}catch(e){}

function config(){
  const c=JSON.parse(JSON.stringify(T.DEFAULT_CONFIG));
  const ov=S.data.stations||{};
  c.stations=c.stations.filter(st=>!(ov[st.id]&&ov[st.id].off)).map(st=>Object.assign(st,ov[st.id]&&ov[st.id].prio?{prio:+ov[st.id].prio}:{}));
  const so=S.data.shifts||{};
  c.shifts.forEach(sh=>{if(so[sh.id]&&Array.isArray(so[sh.id].days))sh.days=so[sh.id].days});
  c.rules=S.data.rules||[];
  return c;
}
function recompute(){S.cfg=config();S.C=T.compile(S.cfg.rules,S.data.staff);S.R=T.report(S.cfg,S.data.staff,S.tt,S.data.plan.assign||{})}

/* גרסה 2: הכללים יושבים ב־data.rules ולא על אנשי הצוות */
function migrate(){
  const d=S.data;
  if(d.version>=2&&d.rules&&d.staff)return false;
  const old={};(d.staff||[]).forEach(s=>old[s.name]=s);
  const fresh=T.buildStaff(d.formRows||[],S.tt);
  fresh.forEach(s=>{const o=old[s.name];if(o)s.id=o.id});
  d.staff=fresh;d.rules=T.defaultRules(fresh);d.version=2;d.rulesFrom='גיליון "כללים" · 6.11.2026';
  return true;
}
async function load(){
  const r=await rpc('toranut_load',{p_phone:S.phone});
  S.me=r.me;S.tt=r.tt||{};S.data=r.data||{};S.at=r.updated_at;
  if(!S.data.plan)S.data.plan={assign:{},locked:{}};
  if(!S.data.plan.locked)S.data.plan.locked={};
  if(migrate())await save(true);
  recompute();
}
let saveT;
async function save(now){
  clearTimeout(saveT);
  const go=async()=>{try{S.at=await rpc('toranut_save',{p_phone:S.phone,p_data:S.data,p_expect:S.at})}catch(e){
    if(e.message==='conflict'){toast('מישהו אחר עדכן בינתיים — טוען מחדש');await load();render()}else toast('השמירה נכשלה: '+e.message)}};
  if(now)return go();saveT=setTimeout(go,700);
}

/* ---------- helpers ---------- */
const byId=()=>{const m={};S.data.staff.forEach(s=>m[s.id]=s);return m};
const shiftOf=id=>S.cfg.shifts.find(x=>x.id===id);
const stOf=id=>T.DEFAULT_CONFIG.stations.find(x=>x.id===id);
const ruleOf=id=>(S.data.rules||[]).find(r=>r.id===id);
const prof=id=>S.C.P[id];
const roleName={teacher:'מורה',aide:'סייע/ת',admin:'מנהלה',other:'אחר'};
const dayList=a=>a&&a.length?a.map(d=>D[d]).join(', '):'—';
const SRC={sheet:['גיליון','#e8eef5'],form:['שאלון','#eef7e8'],personal:['חריג אישי','#fff4e0'],site:['נוסף באתר','#f1e9fb']};
const srcChip=r=>{const s=SRC[r.src]||SRC.site;return '<span class="chip" style="background:'+s[1]+'">'+s[0]+'</span>'};
function kpi(cls,title,sub,n){return '<div class="kpi '+cls+'"><div><b>'+title+'</b><span>'+sub+'</span></div><div class="n">'+n+'</div></div>'}
const ICON={sum:'<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>',board:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16M15 4v16"/>',staff:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.6c1.7.8 2.7 2.6 3 5.4"/>',rules:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',st:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>'};
const icon=k=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[k]+'</svg>';
const runBtn=(cls)=>'<button class="btn'+(cls||'')+'" data-act="run"'+(S.busy?' disabled':'')+'>'+(S.busy?'מריץ…':'הרצת שיבוץ')+'</button>';

function render(){
  if(!S.phone)return renderLogin();
  if(!S.data){root.innerHTML='<div class="loading">טוען…</div>';return}
  const nav=[['sum','איפה תקוע'],['board','לוח'],['staff','צוות'],['rules','כללים'],['st','עמדות']];
  const body={sum:viewSum,board:viewBoard,staff:viewStaff,rules:viewRules,st:viewStations}[S.view]();
  const sy=window.scrollY,my=document.querySelector('.modal .mbody');const mScroll=my?my.scrollTop:0;
  root.innerHTML='<div class="app"><nav class="rail" aria-label="ניווט"><div class="brand">תורנויות<br>חצר</div>'+
    nav.map(n=>'<button type="button" data-act="nav" data-v="'+n[0]+'"'+(S.view===n[0]?' aria-current="page"':'')+'>'+icon(n[0])+n[1]+'</button>').join('')+
    '<div class="spacer"></div><div class="who">'+esc(S.me||'')+'<br><button type="button" class="link" data-act="logout" style="color:var(--rail-ink);font-size:13px;padding:4px">יציאה</button></div></nav><main>'+body+'</main></div>'+(S.modal?renderModal():'');
  const m2=document.querySelector('.modal .mbody');if(m2&&S.modal&&S.modal.keepScroll)m2.scrollTop=mScroll;
}
function renderLogin(err){
  root.innerHTML='<div class="login"><form class="card" id="loginForm"><h1>תורנויות חצר</h1><div class="muted">כנפי רוח · כניסה לצוות הניהול</div>'+
   '<label for="ph" style="font-weight:600">מספר טלפון</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" required autofocus>'+
   (err?'<div class="err">'+esc(err)+'</div>':'')+'<button class="btn" type="submit">כניסה</button></form></div>';
}

/* ---------- איפה תקוע ---------- */
function viewSum(){
  const R=S.R,st=R.stats,ran=!!S.data.plan.at;
  const short=st.demand-st.supply;
  let h='<div class="card topbar"><div><h1>איפה זה נתקע</h1><div class="muted small">'+(ran?'הרצה אחרונה: '+new Date(S.data.plan.at).toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'}):'עוד לא הורץ')+(S.data.rulesFrom?' · כללים: '+esc(S.data.rulesFrom):'')+'</div></div>'+
    '<div class="row noprint">'+runBtn()+'<button class="btn sec sm" data-act="import">עדכון מהשאלון</button></div></div>';
  h+='<div class="kpis">'+kpi('k-blue','עמדות בשבוע','בוקר, הפסקות וסוף יום',st.demand)+kpi('k-green','שובצו','',st.filled)+kpi(st.open?'k-red':'k-green','חסרות','עמדות בלי תורן',st.open)+kpi(short>0?'k-orange':'k-green','היצע לפי הכללים','סך התורנויות שהכללים דורשים',st.supply)+'</div>';
  if(!ran||S.data.plan.stale)h+='<div class="note noprint">'+(ran?'הכללים או הצוות השתנו מאז ההרצה האחרונה. ':'')+'לחצו "הרצת שיבוץ" כדי לראות את התוצאה.</div>';
  if(!ran)return h;
  // 1. היצע מול ביקוש
  h+='<div class="card"><h2>1. היצע מול ביקוש</h2>';
  if(short>0)h+='<p>יש <b>'+st.demand+'</b> עמדות בשבוע, והכללים מאפשרים לדרוש <b>'+st.supply+'</b> תורנויות. <b>חסרות '+short+'</b> עוד לפני כל אילוץ.</p>'+levers();
  else h+='<p>הכללים מאפשרים <b>'+st.supply+'</b> תורנויות מול <b>'+st.demand+'</b> עמדות — יש מרווח של '+(-short)+'. '+(st.open?'החוסרים נובעים מאילוצי ימים ושעות.':'הכול מכוסה.')+'</p>';
  h+='</div>';
  // 2. משבצות חסרות
  const cells=Object.values(R.cells).filter(c=>c.unfilled.length);
  h+='<div class="card"><h2>2. איפה בדיוק חסר</h2>';
  if(!cells.length)h+='<p style="color:var(--green);font-weight:600">כל העמדות מאוישות.</p>';
  else{
    h+='<div class="tablewrap"><table class="grid"><thead><tr><th>משמרת</th>'+[0,1,2,3,4,5].map(d=>'<th>'+D[d]+'</th>').join('')+'</tr></thead><tbody>'+
    S.cfg.shifts.map(sh=>'<tr><th class="st">'+esc(sh.label)+'</th>'+[0,1,2,3,4,5].map(d=>{
      const c=R.cells[sh.id+'@'+d];if(!c)return '<td class="cell off"></td>';
      if(!c.unfilled.length)return '<td style="color:var(--green)">✓ '+c.filled+'/'+c.demand+'</td>';
      return '<td style="background:#fdecea"><b style="color:var(--red)">חסרים '+c.unfilled.length+'</b><div class="small">'+c.unfilled.map(p=>esc(p.st.name.split(' (')[0])).join('<br>')+'</div><div class="small muted">זמינים בשעה הזו: '+c.possible+(c.freeButIneligible?', '+c.freeButIneligible+' פנויים אבל לא מתאימים לעמדה':' — כולם כבר משובצים או במכסה')+'</div></td>'}).join('')+'</tr>').join('')+
    '</tbody></table></div>';
  }
  h+='</div>';
  // 3. החלטות פתוחות
  const R2=R.people.reduce((m,p)=>(m[p.id]=p,m),{});
  const out=S.data.staff.filter(s=>prof(s.id).excluded);
  const obst=S.data.staff.filter(s=>!prof(s.id).excluded&&s.obstacle);
  const noForm=S.data.staff.filter(s=>!s.form);
  const noTT=S.data.staff.filter(s=>s.form&&!s.tt&&s.role==='teacher'&&!prof(s.id).excluded);
  const under=R.people.filter(p=>p.status==='in'&&p.got<p.target);

function canPlace(s,shId,d,stId){
  const p=prof(s.id),sh=shiftOf(shId),st=S.cfg.stations.find(x=>x.id===stId);
  if(!sh||!st||!sh.days.includes(d))return 'אין משמרת';
  const f=T.formAllows(s,sh,d,p);if(f)return f;
  const pr=T.presence(s,sh,d,S.tt);if(!pr.ok)return pr.why;
  if(!T.stationOk(s,p,st,T.stationLayer(S.cfg,st,sh,d)))return p.ahmash==='only'?'אחמ"ש בלבד':st.ahmash?'לא אחמ"ש':p.stations==='ownFloor'?'רק בקומת השכבה':p.stations==='seat'?'רק עמדה עם ישיבה':'לא מתאים לעמדה';
  return null;
}
function mySlotAt(id,shId,d){const A=S.data.plan.assign||{};return Object.keys(A).find(k=>A[k]===id&&k.startsWith(shId+'@'+d+'@'))}
function ruleSummary(s){
  const p=prof(s.id),L=[];
  L.push('<span><b>מכסה:</b> '+p.target+'</span>');
  L.push('<span><b>מתכונת:</b> '+esc(({day:'יום מרוכז',spread:'פריסה',free:'חופשי'})[p.pattern])+'</span>');
  if(p.ahmash!=='no')L.push('<span><b>אחמ"ש:</b> '+esc(T.AHMASH[p.ahmash])+'</span>');
  if(p.stations!=='any')L.push('<span><b>עמדות:</b> '+esc(T.STATIONS[p.stations])+'</span>');
  Object.keys(p.max).forEach(g=>L.push('<span>עד '+p.max[g]+' ב'+esc(T.SHIFT_NAME[g])+'</span>'));
  Object.keys(p.min).forEach(g=>L.push('<span>לפחות '+p.min[g]+' ב'+esc(T.SHIFT_NAME[g])+'</span>'));
  if(p.only.length)L.push('<span><b>רק:</b> '+esc(T.slotsText(p.only))+'</span>');
  if(p.never.length)L.push('<span><b>לא:</b> '+esc(T.slotsText(p.never))+'</span>');
  if(s.pref.length)L.push('<span><b>ימים מועדפים:</b> '+dayList(s.pref)+'</span>');
  return '<div class="kv">'+L.join('')+'</div>';
}

function commitRule(nr,choice){
  let rules=S.data.rules.slice();
  const pos=S.modal&&S.modal.edit?rules.findIndex(r=>r.id===nr.id):-1;
  if(pos>=0)rules.splice(pos,1);
  const cs=T.conflicts(rules,nr,S.data.staff);
  if(!cs.length&&pos>=0){rules.splice(pos,0,nr)}
  else rules=T.addRule(rules,nr,S.data.staff,choice||'keep');
  S.data.rules=rules;S.data.plan.stale=true;S.modal=null;recompute();save(true);render();
  toast(choice==='replace'?'הכלל הוחלף':'הכלל נשמר');
}
function trySaveRule(){
  const M=S.modal,nr=JSON.parse(JSON.stringify(M.r));

  else nr.who={ids:nr.who.ids};
  if(nr.type==='exclude')nr.v=nr.v!==false&&nr.v!=='false';
  const base=S.data.rules.filter(r=>r.id!==nr.id);
  const cs=T.conflicts(base,nr,S.data.staff);
  if(!cs.some(c=>c.rel!=='sup')){const k=cs.length;commitRule(nr,'keep');if(k)toast('הכלל נשמר · '+k+' חריגים ספציפיים קיימים נשארו בתוקף');return}
  S.modal={kind:'conflict',r:nr,cs,edit:M.edit};render();
}

    const r=T.solve(config(),S.data.staff,S.tt,{iterations:40,locked:S.data.plan.locked||{},seed:Date.now()%997});
    S.data.plan.assign=r.assign;S.data.plan.at=new Date().toISOString();S.data.plan.stats=r.stats;delete S.data.plan.stale;
    S.busy=false;recompute();save(true);render();toast('השיבוץ הסתיים: '+r.stats.filled+' מתוך '+r.stats.demand+' עמדות');
  },30);
}

async function importSheet(){
  const id=S.data.sheet;let values=null;
  try{
    const url='https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:json&sheet='+encodeURIComponent('תגובות לטופס 1')+'&headers=0';
    const t=await (await fetch(url)).text();const j=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
    values=j.table.rows.map(r=>(r.c||[]).map(c=>c?(c.f!=null&&typeof c.v!=='string'?c.f:c.v):''));
    const cols=j.table.cols.map(c=>c.label||'');if(cols.some(Boolean))values.unshift(cols);
  }catch(e){values=null}
  if(!values){const txt=prompt('לא הצלחתי לקרוא את הגיליון ישירות.\nהעתיקו את כל הגיליון "תגובות לטופס 1" (Ctrl+A, Ctrl+C) והדביקו כאן:');if(!txt)return;values=txt.split(/\r?\n/).map(l=>l.split('\t'))}
  const rows=T.parseSheet(values);
  if(!rows.length){toast('לא נמצאו תשובות בגיליון');return}
  const fresh=T.buildStaff(rows,S.tt);
  const old={};S.data.staff.forEach(s=>old[s.name]=s);
  let added=0;
  fresh.forEach(s=>{const o=old[s.name];if(o)s.id=o.id;else{added++;s.id='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}});
  S.data.formRows=rows;S.data.staff=fresh;S.data.plan.stale=true;recompute();await save(true);render();
  toast('עודכן מהשאלון: '+rows.length+' תשובות'+(added?', '+added+' חדשים':''));
}
function setPersonal(id,type,values){
  S.data.rules=T.setPersonal(S.data.rules,id,type,null);
  // אם הקבוצה כבר נותנת את אותו ערך — אין צורך בחריג
  const C=T.compile(S.data.rules,S.data.staff).P[id];
  const same=type==='exclude'?C.excluded===values.v:type==='ahmash'?C.ahmash===values.v:type==='quota'?C.target===values.n:false;
  if(!same)S.data.rules=T.setPersonal(S.data.rules,id,type,values);
  S.data.plan.stale=true;recompute();save();render();
}
function rf(el){
  const M=S.modal,r=M.r,f=el.dataset.rf;M.keepScroll=true;
  if(f==='type'){M.r=defaultsFor(el.value,r);return}
  if(f.startsWith('who.')){const k=f.slice(4),a=new Set(r.who[k]||[]);el.checked?a.add(el.value):a.delete(el.value);r.who[k]=[...a];return}
  if(f==='slot'){const a=new Set(r.slots||[]);el.checked?a.add(el.value):a.delete(el.value);r.slots=[...a];return}
  if(f==='hard'){r.hard=el.checked;return}
  if(f==='n'||f==='w'){r[f]=+el.value;return}
  if(f==='v'&&r.type==='exclude'){r.v=el.value==='true';return}
  r[f]=el.value;
}

  else if(a==='print'){const t=S.shiftTab;S.shiftTab='all';render();setTimeout(()=>{window.print();S.shiftTab=t;render()},50)}
  else if(a==='csv')csv();
  else if(a==='sf'){S.staffFilter=b.dataset.f;render()}
  else if(a==='rf'){S.ruleFilter=b.dataset.f;render()}
  else if(a==='cell'){S.modal={k:b.dataset.k,all:false,q:''};render()}
  else if(a==='place'){S.modal={kind:'place',sh:b.dataset.sh,d:+b.dataset.d};render()}
  else if(a==='placeAt'){if(!b.disabled)placeFocus(b.dataset.k)}
  else if(a==='unfocus'){S.focus=null;render()}
  else if(a==='focusPrev'||a==='focusNext'){const L=S.data.staff.filter(s=>!prof(s.id).excluded).sort((x,y)=>x.name.localeCompare(y.name,'he'));const i=L.findIndex(s=>s.id===S.focus);S.focus=L[(i+(a==='focusNext'?1:-1)+L.length)%L.length].id;render()}
  else if(a==='focus'){S.focus=b.dataset.id;S.view='board';render();window.scrollTo(0,0)}
  else if(a==='close'){if(e.target===b||b.tagName==='BUTTON'){S.modal=null;render()}}
  else if(a==='mall'){S.modal.all=b.checked;render()}
  else if(a==='pick'){const k=S.modal.k;S.data.plan.assign[k]=b.dataset.id;S.data.plan.locked[k]=b.dataset.id;S.modal=null;recompute();save();render();toast('נשמר ונעול')}
  else if(a==='clear'){const k=S.modal.k;delete S.data.plan.assign[k];delete S.data.plan.locked[k];S.modal=null;recompute();save();render()}
  else if(a==='unlock'){delete S.data.plan.locked[S.modal.k];S.modal=null;save();render()}
  else if(a==='radd'){S.modal={kind:'rule',r:blankRule(),whoMode:'group'};render()}
  else if(a==='redit'){const r=JSON.parse(JSON.stringify(ruleOf(b.dataset.r)));r.who=Object.assign({roles:[],dcats:[],options:[],ids:[]},r.who);S.modal={kind:'rule',r,edit:true,whoMode:r.who.ids.length?'ids':'group'};render()}
  else if(a==='rwho'){S.modal.whoMode=b.dataset.m;if(b.dataset.m==='group')S.modal.r.who.ids=[];render()}
  else if(a==='rsave')trySaveRule();
  else if(a==='rconfirm')commitRule(S.modal.r,b.dataset.c);
  else if(a==='rdel'){const r=ruleOf(b.dataset.r);S.modal={kind:'confirm',title:'מחיקת כלל',text:T.describe(r,S.data.staff),yes:'למחוק',fn:()=>{S.data.rules=S.data.rules.filter(x=>x.id!==r.id)}};render()}
  else if(a==='rreset'){S.modal={kind:'confirm',title:'איפוס לכללי הגיליון',text:'כל הכללים שנוספו באתר והחריגים האישיים יימחקו. להמשיך?',yes:'לאפס',fn:()=>{S.data.rules=T.defaultRules(S.data.staff);S.data.rulesFrom='גיליון "כללים" · 6.11.2026'}};render()}
  else if(a==='cyes'){S.modal.fn();S.modal=null;S.data.plan.stale=true;recompute();save(true);render();toast('בוצע')}
});
root.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.rf&&S.modal&&S.modal.r){if(/^(n|note|text)$/.test(el.dataset.rf))return;rf(el);render();return}
  const ch=el.dataset.ch;if(!ch)return;
  if(ch==='focus'){S.focus=el.value||null;render();return}
  if(ch==='release'){S.modal.release=el.value;return}
  if(el.dataset.id){const id=el.dataset.id,s=S.data.staff.find(x=>x.id===id);
    if(ch==='status')setPersonal(id,'exclude',{v:el.value==='out'});
    else if(ch==='ahmash')setPersonal(id,'ahmash',{v:el.value});
    else if(ch==='target')setPersonal(id,'quota',{n:Math.max(0,+el.value||0)});
    toast('נשמר כחריג אישי: '+s.name);return}
  if(ch==='ron'){const r=ruleOf(el.dataset.r);r.on=el.checked;S.data.plan.stale=true;recompute();save();render();return}
  if(ch==='prio'||ch==='off'){const o=(S.data.stations=S.data.stations||{});o[el.dataset.st]=o[el.dataset.st]||{};
    if(ch==='prio')o[el.dataset.st].prio=+el.value;else o[el.dataset.st].off=el.value==='1';S.data.plan.stale=true;recompute();save();render();return}
  if(ch==='sday'){const so=(S.data.shifts=S.data.shifts||{});const cur=shiftOf(el.dataset.sh).days.slice();const d=+el.dataset.d;
    so[el.dataset.sh]={days:el.checked?[...cur,d].sort():cur.filter(x=>x!==d)};S.data.plan.stale=true;recompute();save();render();return}
});
root.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='q'||id==='mq'||id==='pq'){
    const v=e.target.value,pos=e.target.selectionStart;
    if(id==='q')S.q=v;else if(id==='mq')S.modal.q=v;else{S.modal.pq=v;S.modal.keepScroll=false}
    render();const el=document.getElementById(id);el.focus();el.setSelectionRange(pos,pos);return}
  // שדות טקסט/מספר בכלל — מעדכנים בלי לרנדר (כדי לא לאבד פוקוס)
  if(e.target.dataset.rf&&S.modal&&S.modal.r&&/^(n|note|text)$/.test(e.target.dataset.rf)){rf(e.target);const pv=document.querySelector('.modal .note');if(pv){const n=S.modal.r.type==='note'?null:T.setOf(S.modal.r,S.data.staff).length;pv.innerHTML='<b>תצוגה מקדימה:</b> '+esc(T.describe(S.modal.r,S.data.staff))+(n!=null?' <span class="muted">· חל על '+n+' אנשים</span>':'')}
    const sv=document.querySelector('[data-act=rsave]');if(sv&&S.modal.r.type==='note')sv.disabled=!(S.modal.r.text||'').trim()}
});
root.addEventListener('submit',async e=>{
  e.preventDefault();if(e.target.id!=='loginForm')return;
  const ph=e.target.querySelector('#ph').value;
  try{const n=await rpc('milui_login',{p_phone:ph});if(!n){renderLogin('המספר הזה לא מורשה להיכנס.');return}
    S.phone=ph;try{localStorage.setItem('milui_phone',ph)}catch(x){}render();await load();render()}catch(x){renderLogin('אין חיבור לשרת. נסו שוב.')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render()}});

(async()=>{render();if(!S.phone)return;try{await load();render()}catch(e){if(e.message==='no_access'){S.phone=null;renderLogin('המספר הזה לא מורשה להיכנס.')}else root.innerHTML='<div class="loading">שגיאה בטעינה: '+esc(e.message)+'</div>'}})();
</script>
</body>
</html>
