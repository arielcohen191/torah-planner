<style>

.cand{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:right;background:var(--card-muted);border:1.5px solid transparent;border-radius:var(--r-sm);padding:10px 14px;font-size:16px}

@media (max-width:760px){.app{flex-direction:column}nav.rail{flex-direction:row;flex:none;padding:8px;overflow-x:auto}.rail .brand,.rail .spacer,.rail .who{display:none}.rail button{flex:1;min-width:72px}}
.yt{border-collapse:collapse;width:100%;font-size:14px;min-width:900px}
.yt th,.yt td{border:1px solid #9aa5b1;padding:4px 6px;text-align:center;vertical-align:middle}
.yt thead th{background:var(--rail);color:#fff;font-weight:600}
.yt thead tr:nth-child(2) th{background:#3a4756;font-weight:500;font-size:13px}
.yt th.brk{background:var(--rail);color:#fff;width:70px;font-size:13px}
.yt th.yn{background:var(--card-muted);text-align:right;font-weight:600;min-width:170px}
.yt td.ly{font-weight:700;cursor:pointer;min-width:38px}

.yt tr.ahm td,.yt tr.ahm th.yn{background:#eef2f6;font-style:italic}

.yt tr.sep td,.yt tr.sep th{border-top:3px solid var(--rail)}
.L-א{background:#ffd9d9}.L-ב{background:#ffe6c4}.L-ג{background:#fff3a8}.L-ד{background:#d4f0c9}.L-ה{background:#cfe5ff}.L-ו{background:#e4d8ff}.L-multi{background:linear-gradient(135deg,#ffd9d9 50%,#ffe6c4 50%)}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:13px}.legend span{padding:2px 10px;border-radius:6px;border:1px solid #c9d1db}
.ver{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.preview-bar{background:#2b2f6b;color:#fff;border-radius:var(--r-md);padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.preview-bar .btn.sec{background:#fff}
.printonly{display:none}@media print{.printonly{display:block;margin-top:6px;font-size:10px;color:#555}}
td.cell.merged{background:#eef2f6;color:var(--ink-muted);font-size:12px;cursor:default}
html.print-yards main>*:not(#yardsCard){display:none!important}
html.print-yards #yardsCard{padding:0}
@media print{html.print-yards body{font-size:10px}html.print-yards .yt{font-size:11px;min-width:0}html.print-yards .yt th.yn{min-width:0;width:160px;font-size:11px}html.print-yards .yt td.nm{min-width:0;font-size:11px}html.print-yards .yt td.ly{font-size:12.5px}html.print-yards .yt tr{break-inside:avoid}html.print-yards #yardsCard{break-inside:auto}
 html.print-yards #yardsCard h1{font-size:16px;margin:0 0 4px}html.print-yards .yt th,html.print-yards .yt td{padding:3px 3px}html.print-yards .legend{font-size:12px}
 html.print-yards *{-webkit-print-color-adjust:exact;print-color-adjust:exact}html.print-yards .tablewrap{overflow:visible}}
@media print{nav.rail,.noprint,.toast{display:none!important}main{padding:0}body{background:#fff;font-size:12px}.card{box-shadow:none;padding:0;margin-bottom:12px;break-inside:avoid}
 table.grid{font-size:11px;min-width:0}table.grid thead th{background:#ddd;color:#000}td.cell.empty{background:#fff}td.cell .lk{display:none}}

<body>
<div id="root"><div class="loading">טוען…</div></div>
<script src="engine.js"></script>
<script>
const CFG={url:'https://onocjgbtensczpdbeanf.supabase.co',key:'sb_publishable_JpV-E-qPnV9ZdnRnY9Kv8Q_TaRzCnyc'};
async function rpc(fn,args){
  const r=await fetch(CFG.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const m=(j&&j.message)||t;throw new Error(/no_access/.test(m)?'no_access':/conflict/.test(m)?'conflict':m)}
  return j;
}
const T=window.Toranut, D=T.DAYS;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root=document.getElementById('root');
let toastT;function toast(m){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3200)}

/* ---------- state ---------- */
const S={phone:null,me:null,view:'sum',tt:{},data:null,at:null,cfg:null,R:null,C:null,shiftTab:'b1',staffFilter:'all',q:'',modal:null,busy:false,ruleFilter:'all'};
try{S.phone=localStorage.getItem('milui_phone')}catch(e){}

function config(){
  const c=JSON.parse(JSON.stringify(T.DEFAULT_CONFIG));
  const ov=S.data.stations||{};
  c.stations=c.stations.filter(st=>!(ov[st.id]&&ov[st.id].off)).map(st=>Object.assign(st,ov[st.id]&&ov[st.id].prio?{prio:+ov[st.id].prio}:{}));
  const so=S.data.shifts||{};
  c.shifts.forEach(sh=>{if(so[sh.id]&&Array.isArray(so[sh.id].days))sh.days=so[sh.id].days});
  const src=S.preview?S.preview.snap:S.data;
  if(S.preview){c.rules=src.rules||[]}else c.rules=S.data.rules||[];
  const yd=(S.preview?src.yards:null)||S.data.yards;if(yd)c.yards=yd;
  c.skip={};c.mergeInto={};(S.data.merges||[]).forEach(m=>{if(m.until&&m.until<ymd(Date.now()))return;c.skip[m.key]=true;(c.mergeInto[m.into]=c.mergeInto[m.into]||[]).push(m.key)});
  return c;
}
function curAssign(){return S.preview?((S.preview.snap.plan||{}).assign||{}):(S.data.plan.assign||{})}
function recompute(){_brk=null;S.cfg=config();S.C=T.compile(S.cfg.rules,S.data.staff);S.R=T.report(S.cfg,S.data.staff,S.tt,curAssign())}

/* גרסה 2: הכללים יושבים ב־data.rules ולא על אנשי הצוות */
function migrate(){
  const d=S.data;
  if(d.version>=2&&d.rules&&d.staff)return false;
  const old={};(d.staff||[]).forEach(s=>old[s.name]=s);
  const fresh=T.buildStaff(d.formRows||[],S.tt);
  fresh.forEach(s=>{const o=old[s.name];if(o)s.id=o.id});
  d.staff=fresh;d.rules=T.defaultRules(fresh);d.version=2;d.rulesFrom='גיליון "כללים" · 6.11.2026';
  return true;
}
async function load(){
  const r=await rpc('toranut_load',{p_phone:S.phone});
  S.me=r.me;S.tt=r.tt||{};S.data=r.data||{};S.at=r.updated_at;S.abs=r.absences||[];S.phones=r.phones||{};_brk=null;
  if(!S.data.plan)S.data.plan={assign:{},locked:{}};
  if(!S.data.plan.locked)S.data.plan.locked={};
  if(migrate())await save(true);
  recompute();
}
let saveT;
async function save(now){
  clearTimeout(saveT);
  const go=async()=>{try{S.at=await rpc('toranut_save',{p_phone:S.phone,p_data:S.data,p_expect:S.at})}catch(e){
    if(e.message==='conflict'){toast('מישהו אחר עדכן בינתיים — טוען מחדש');await load();render()}else toast('השמירה נכשלה: '+e.message)}};
  if(now)return go();saveT=setTimeout(go,700);
}

/* ---------- helpers ---------- */
const byId=()=>{const m={};S.data.staff.forEach(s=>m[s.id]=s);return m};
const shiftOf=id=>S.cfg.shifts.find(x=>x.id===id);
const stOf=id=>T.DEFAULT_CONFIG.stations.find(x=>x.id===id);
const ruleOf=id=>(S.data.rules||[]).find(r=>r.id===id);
const prof=id=>S.C.P[id];
const roleName={teacher:'מורה',aide:'סייע/ת',admin:'מנהלה',other:'אחר'};
const dayList=a=>a&&a.length?a.map(d=>D[d]).join(', '):'—';
const SRC={sheet:['גיליון','#e8eef5'],form:['שאלון','#eef7e8'],personal:['חריג אישי','#fff4e0'],site:['נוסף באתר','#f1e9fb']};
const srcChip=r=>{const s=SRC[r.src]||SRC.site;return '<span class="chip" style="background:'+s[1]+'">'+s[0]+'</span>'};
function kpi(cls,title,sub,n,act,go){
  const inner='<div><b>'+title+'</b><span>'+sub+'</span>'+(go?'<span class="go">'+go+' ←</span>':'')+'</div><div class="n">'+n+'</div>';
  return act?'<button type="button" class="kpi '+cls+'" data-act="'+act+'">'+inner+'</button>':'<div class="kpi '+cls+'">'+inner+'</div>';
}
const fbtn=(id,label,cls)=>'<button type="button" class="'+(cls||'lnk')+'" data-act="focus" data-id="'+id+'" title="הצגה בלוח">'+label+'</button>';
function emptyKeys(){const A=S.data.plan.assign||{};return S.R.unfilled.filter(k=>!A[k])}
const ICON={sum:'<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>',board:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16M15 4v16"/>',staff:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.6c1.7.8 2.7 2.6 3 5.4"/>',yards:'<path d="M3 20h18M5 20V9l7-5 7 5v11"/><path d="M9 20v-6h6v6"/>',hist:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',abs:'<circle cx="10" cy="8" r="3.5"/><path d="M3.5 20c.7-3.5 3.3-5.5 6.5-5.5 1.3 0 2.5.3 3.5.9"/><path d="M16 15l5 5M21 15l-5 5"/>',tt:'<rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 3v3M16 3v3M12 13v4M10 15h4"/>',rules:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',st:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>'};
const icon=k=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[k]+'</svg>';
const runBtn=(cls)=>'<button class="btn'+(cls||'')+'" data-act="run"'+(S.busy?' disabled':'')+'>'+(S.busy?'מריץ…':'הרצת שיבוץ')+'</button>';

function render(){
  if(!S.phone)return renderLogin();
  if(!S.data){root.innerHTML='<div class="loading">טוען…</div>';return}
  const nav=[['sum','איפה תקוע'],['board','לוח'],['yards','חצרות'],['staff','צוות'],['rules','כללים'],['st','עמדות'],['abs','היעדרויות'],['tt','מערכת'],['hist','גרסאות']];

function canPlace(s,shId,d,stId){
  const p=prof(s.id),sh=shiftOf(shId),st=S.cfg.stations.find(x=>x.id===stId);
  if(!sh||!st||!sh.days.includes(d))return 'אין משמרת';
  const f=T.formAllows(s,sh,d,p);if(f)return f;
  const pr=T.presence(s,sh,d,S.tt);if(!pr.ok)return pr.why;
  if(!T.stationOk(s,p,st,T.stationLayer(S.cfg,st,sh,d)))return p.ahmash==='only'?'אחמ"ש בלבד':st.ahmash?'לא אחמ"ש':p.stations==='ownFloor'?'רק בקומת השכבה':p.stations==='seat'?'רק עמדה עם ישיבה':'לא מתאים לעמדה';
  return null;
}
function mySlotAt(id,shId,d){const A=S.data.plan.assign||{};return Object.keys(A).find(k=>A[k]===id&&k.startsWith(shId+'@'+d+'@'))}
function ruleSummary(s){
  const p=prof(s.id),L=[];
  L.push('<span><b>מכסה:</b> '+p.target+'</span>');
  L.push('<span><b>מתכונת:</b> '+esc(({day:'יום מרוכז',spread:'פריסה',free:'חופשי'})[p.pattern])+'</span>');
  if(p.ahmash!=='no')L.push('<span><b>אחמ"ש:</b> '+esc(T.AHMASH[p.ahmash])+'</span>');
  if(p.stations!=='any')L.push('<span><b>עמדות:</b> '+esc(T.STATIONS[p.stations])+'</span>');
  Object.keys(p.max).forEach(g=>L.push('<span>עד '+p.max[g]+' ב'+esc(T.SHIFT_NAME[g])+'</span>'));
  Object.keys(p.min).forEach(g=>L.push('<span>לפחות '+p.min[g]+' ב'+esc(T.SHIFT_NAME[g])+'</span>'));
  if(p.only.length)L.push('<span><b>רק:</b> '+esc(T.slotsText(p.only))+'</span>');
  if(p.never.length)L.push('<span><b>לא:</b> '+esc(T.slotsText(p.never))+'</span>');
  if(s.pref.length)L.push('<span><b>ימים מועדפים:</b> '+dayList(s.pref)+'</span>');
  return '<div class="kv">'+L.join('')+'</div>';
}

function commitRule(nr,choice){
  let rules=S.data.rules.slice();
  const pos=S.modal&&S.modal.edit?rules.findIndex(r=>r.id===nr.id):-1;
  if(pos>=0)rules.splice(pos,1);
  const cs=T.conflicts(rules,nr,S.data.staff);
  if(!cs.length&&pos>=0){rules.splice(pos,0,nr)}
  else rules=T.addRule(rules,nr,S.data.staff,choice||'keep');
  S.data.rules=rules;S.data.plan.stale=true;S.modal=null;recompute();save(true);render();
  toast(choice==='replace'?'הכלל הוחלף':'הכלל נשמר');
}
function trySaveRule(){
  const M=S.modal,nr=JSON.parse(JSON.stringify(M.r));
  if(nr.type==='soft'||nr.type==='note')nr.who={};
  if(M.whoMode==='group'||!(nr.who.ids&&nr.who.ids.length))nr.who.ids=[];
  else nr.who={ids:nr.who.ids};
  if(nr.type==='exclude')nr.v=nr.v!==false&&nr.v!=='false';
  const base=S.data.rules.filter(r=>r.id!==nr.id);
  const cs=T.conflicts(base,nr,S.data.staff);
  if(!cs.some(c=>c.rel!=='sup')){const k=cs.length;commitRule(nr,'keep');if(k)toast('הכלל נשמר · '+k+' חריגים ספציפיים קיימים נשארו בתוקף');return}
  S.modal={kind:'conflict',r:nr,cs,edit:M.edit};render();
}

const FIELDS=[['teacher','שם המורה',/מורה|שם|teacher/i,true],['tid','מזהה מורה (אם יש)',/מזהה|ת\.?\s?ז|קוד מורה|^id$|teacher.?id/i,false],['day','יום',/יום|day/i,true],['hour','שעה / מספר שיעור',/שעה|שיעור\s*מס|מס.?\s*שיעור|period|hour|lesson/i,true],['subject','מקצוע',/מקצוע|subject|נושא|תוכן/i,false],['cls','כיתה / קבוצה',/כית|class|קבוצ/i,false]];

const DAYW=[['ראשון','א',"א'",'1','sun'],['שני','ב',"ב'",'2','mon'],['שלישי','ג',"ג'",'3','tue'],['רביעי','ד',"ד'",'4','wed'],['חמישי','ה',"ה'",'5','thu'],['שישי','ו',"ו'",'6','fri']];
function parseDay(v){let t=String(v||'').trim().toLowerCase().replace(/^יום\s*/,'').replace(/[׳"]/g,"'");if(!t)return null;
  for(let i=0;i<6;i++)if(DAYW[i].some(w=>t===w||(w.length>2&&t.startsWith(w))))return i;return null}
function parseHour(v){const m=String(v||'').match(/\d+/);if(!m)return null;const n=+m[0];return n>=1&&n<=10?n:null}
function kindOf(sub){const t=String(sub||'');return /שהי/.test(t)?'שהייה':/פרטנ/.test(t)?'פרטני':/חלון/.test(t)?'חלון':/תפקיד|ריכוז|ניהול|רכז/.test(t)?'תפקיד':'שיעור'}
const KCH={'שיעור':'L','שיעור משותף':'L','פרטני':'P','שהייה':'S','תפקיד':'T','חלון':'C'};
function buildNewTT(rows,head,map){
  const T2={},bad={day:[],hour:[],teacher:0};let ok=0,total=0;
  rows.slice(head+1).forEach(r=>{if(!r||!r.some(c=>String(c).trim()))return;total++;
    const name=String(r[map.teacher]||'').replace(/\s+/g,' ').trim(),d=parseDay(r[map.day]),h=parseHour(r[map.hour]);
    if(!name){bad.teacher++;return}if(d==null){if(bad.day.length<4)bad.day.push(r[map.day]);return}if(h==null){if(bad.hour.length<4)bad.hour.push(r[map.hour]);return}
    ok++;const sub=map.subject!=null?String(r[map.subject]||'').trim():'',cls=map.cls!=null?String(r[map.cls]||'').split(/[,;\/]/).map(x=>x.trim()).filter(Boolean):[];
    const x=T2[name]||(T2[name]={tid:map.tid!=null?String(r[map.tid]||'').trim():'',slots:[],p:['........','........','........','........','........','........']});
    const kind=kindOf(sub);x.slots.push({day:d,hour:h,kind,subject:sub||null,classes:cls,detail:null});
    if(h<=8){const a=x.p[d].split('');if(a[h-1]==='.'||a[h-1]==='C')a[h-1]=KCH[kind]||'L';x.p[d]=a.join('')}});
  return {T2,ok,total,bad};
}
function ttDiff(T2){
  const old=Object.keys(S.tt),ids=S.data.ttIds||{},used=new Set(),match={},pairs=[],fresh=[];
  const nn=s=>String(s).replace(/^הרב\s+/,'').replace(/[`'"׳״]/g,'').replace(/\s+/g,' ').trim().split(' ').sort().join(' ');
  Object.keys(T2).forEach(n=>{
    const viaId=T2[n].tid&&ids['#'+T2[n].tid],viaName=ids[n];
    let o=(viaId&&S.tt[viaId]&&viaId)||(viaName&&S.tt[viaName]&&viaName)||old.find(x=>!used.has(x)&&nn(x)===nn(n));
    if(o){match[n]=o;used.add(o);return}
    const c=old.filter(x=>!used.has(x)&&(T.sameName(n,x)||T.sameName(x,n)));
    if(c.length===1){pairs.push({n,o:c[0],ok:true});used.add(c[0]);return}
    fresh.push(n);
  });
  const missing=old.filter(o=>!used.has(o));
  const changed=[],same=[];
  const all=Object.assign({},match);pairs.forEach(p=>all[p.n]=p.o);
  Object.keys(all).forEach(n=>{const o=all[n];(JSON.stringify(S.tt[o].p)!==JSON.stringify(T2[n].p)?changed:same).push({n,o})});
  return {match,pairs,fresh,missing,changed,same};
}

function ttParse(){

  if(miss.length){I.err='חסר שיוך לעמודה: '+miss.join(', ');render();return}
  const r=buildNewTT(I.rows,I.head,I.map);
  if(!r.ok||r.ok<r.total*0.85){I.err='רק '+r.ok+' מתוך '+r.total+' שורות נקראו תקין.'+(r.bad.day.length?' ימים שלא זוהו: '+r.bad.day.map(esc).join(', ')+'.':'')+(r.bad.hour.length?' שעות שלא זוהו: '+r.bad.hour.map(esc).join(', ')+'.':'')+' בדקו את שיוך העמודות או שזה הקובץ הנכון.';render();return}
  if(Object.keys(r.T2).length<3){I.err='נמצאו פחות מ־3 מורים בקובץ.';render();return}
  I.T2=r.T2;I.diff=ttDiff(r.T2);I.step='diff';render();
}
async function ttApply(){
  const I=S.imp,X=I.diff,P=byId(),upsert=[],deactivate=[],absAdd=[],staffAdd=[],ruleAdd=[];
  S.data.ttIds=S.data.ttIds||{};
  const pairsOk=X.pairs.filter(p=>p.ok),pairsNo=X.pairs.filter(p=>!p.ok);
  pairsOk.forEach(p=>{S.data.ttIds[p.n]=p.o;if(I.T2[p.n].tid)S.data.ttIds['#'+I.T2[p.n].tid]=p.o});
  Object.keys(X.match).forEach(n=>{if(I.T2[n].tid)S.data.ttIds['#'+I.T2[n].tid]=X.match[n]});
  X.changed.forEach(c=>{if(X.pairs.some(p=>p.n===c.n&&!p.ok))return;upsert.push({name:c.o,slots:I.T2[c.n].slots})});
  const missing=X.missing.concat(pairsNo.map(p=>p.o)),fresh=X.fresh.concat(pairsNo.map(p=>p.n));
  missing.forEach(o=>{const c=I.miss[o]||{v:'temp'};const s=S.data.staff.find(x=>x.tt===o);
    if(c.v==='left'){deactivate.push(o);if(s)ruleAdd.push([s.id,'עזב/ה (עדכון מערכת)'])}
    else if(c.v==='temp'){absAdd.push(o)}});
  fresh.forEach(n=>{const c=I.fresh[n]||{v:'skip'};if(c.v==='skip')return;
    upsert.push({name:n,slots:I.T2[n].slots});
    const p=I.T2[n].p,days=p.map((x,i)=>/[^.]/.test(x)?i:-1).filter(i=>i>=0),parts=n.replace(/^הרב\s+/,'').split(' ');
    const lay=[...new Set(I.T2[n].slots.flatMap(x=>x.classes).map(c=>c[0]).filter(ch=>'אבגדהו'.includes(ch)))].join('').slice(0,2)||'*';
    const rec={id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:(parts.slice(1).join(' ')+' '+parts[0]).trim(),tt:n,role:'teacher',layers:lay,days,dcat:days.length>=4?'45':days.length===3?'3':'12',option:'N',pref:[],noMorning:[],noEnd:[],obstacle:'',note:'',form:false,flag:c.v==='temp'?'מחליף/ה זמני/ת (עדכון מערכת)':'חדש/ה מעדכון מערכת — לא מילא/ה שאלון'};
    if(c.v==='temp'){const ws=S.data.staff.find(x=>x.tt===c.for);rec.temp={for:ws?ws.id:null};ruleAdd.push([rec.id,'מחליף/ה זמני/ת — לא בלוח הקבוע'])}
    staffAdd.push(rec)});
  try{
    toast('מעדכן…');
    const batch=(upsert.length||deactivate.length)?await rpc('toranut_tt_apply',{p_phone:S.phone,p:{upsert,deactivate}}):null;
    S.data.staff=S.data.staff.concat(staffAdd);
    ruleAdd.forEach(([id,note])=>{S.data.rules=T.setPersonal(S.data.rules,id,'exclude',{v:true,note})});
    if(batch){S.data.ttBatches=(S.data.ttBatches||[]).concat([{batch,at:Date.now(),by:S.me,file:I.name}]).slice(-10)}
    S.data.plan.stale=true;await save(true);S.imp=null;
    await reloadKeep();
    const opened=openFixPlan('עדכון מערכת');
    const noAbs=absAdd.filter(n=>!(S.abs||[]).some(a=>a.name===n));
    if(noAbs.length)setTimeout(()=>toast('לא לשכוח: להזין במילוי מקום היעדרות עבור '+noAbs.join(', ')),opened?400:0);
    else if(!opened)toast('המערכת עודכנה. הלוח לא הושפע.');
  }catch(e){toast('העדכון נכשל: '+e.message)}
}

function parseCSV(t){
  const sep=(t.split('\n')[0].match(/\t/g)||[]).length>(t.split('\n')[0].match(/,/g)||[]).length?'\t':',';
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;
    else if(c===sep){row.push(cell);cell=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=c}
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows;
}

  const fresh=T.buildStaff(rows,S.tt);

    render();const el=document.getElementById(id);el.focus();el.setSelectionRange(pos,pos);return}
  // שדות טקסט/מספר בכלל — מעדכנים בלי לרנדר (כדי לא לאבד פוקוס)
  if(e.target.dataset.rf&&S.modal&&S.modal.r&&/^(n|note|text)$/.test(e.target.dataset.rf)){rf(e.target);const pv=document.querySelector('.modal .note');if(pv){const n=S.modal.r.type==='note'?null:T.setOf(S.modal.r,S.data.staff).length;pv.innerHTML='<b>תצוגה מקדימה:</b> '+esc(T.describe(S.modal.r,S.data.staff))+(n!=null?' <span class="muted">· חל על '+n+' אנשים</span>':'')}
    const sv=document.querySelector('[data-act=rsave]');if(sv&&S.modal.r.type==='note')sv.disabled=!(S.modal.r.text||'').trim()}
});
root.addEventListener('submit',async e=>{
  e.preventDefault();if(e.target.id!=='loginForm')return;
  const ph=e.target.querySelector('#ph').value;
  try{const n=await rpc('milui_login',{p_phone:ph});if(!n){renderLogin('המספר הזה לא מורשה להיכנס.');return}
    S.phone=ph;try{localStorage.setItem('milui_phone',ph)}catch(x){}render();await load();render()}catch(x){renderLogin('אין חיבור לשרת. נסו שוב.')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render()}});

(async()=>{render();if(!S.phone)return;try{await load();render()}catch(e){if(e.message==='no_access'){S.phone=null;renderLogin('המספר הזה לא מורשה להיכנס.')}else root.innerHTML='<div class="loading">שגיאה בטעינה: '+esc(e.message)+'</div>'}})();
</script>
</body>
</html>
