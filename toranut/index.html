<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תורנויות חצר · כנפי רוח</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;400;500;600;700&display=swap">
<style>
:root{--ground:#eef1f5;--card:#fff;--card-muted:#f5f7fa;--line:#dfe4ea;--ink:#1f2a37;--ink-muted:#5b6878;--rail:#26323f;--rail-ink:#c9d3de;
--brand:#2f7fd6;--brand-dark:#1f5fa6;--blue:#4a8ec9;--green:#4f9a2a;--orange:#c77700;--red:#c62a20;--active:#2fbf71;--r-sm:6px;--r-md:10px;--r-lg:14px;--shadow:0 1px 3px rgba(31,42,55,.10)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:Heebo,system-ui,sans-serif;font-size:17px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.app{display:flex;min-height:100vh}
nav.rail{flex:0 0 104px;background:var(--rail);display:flex;flex-direction:column;gap:8px;padding:24px 8px}
.rail .brand{color:#fff;font-weight:700;font-size:15px;text-align:center;padding-bottom:16px;border-bottom:1px solid #3a4756;margin-bottom:4px}
.rail button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:var(--r-md);background:none;border:0;color:var(--rail-ink);font-size:14px}
.rail button svg{width:26px;height:26px}
.rail button[aria-current="page"]{background:var(--active);color:#fff;font-weight:600}
.rail .spacer{flex:1}.rail .who{color:var(--rail-ink);font-size:13px;text-align:center}
main{flex:1;min-width:0;padding:24px 32px 48px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow);padding:20px 24px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:26px;font-weight:700}h2{margin:0 0 12px;font-size:20px;font-weight:600}h3{margin:0 0 8px;font-size:17px;font-weight:600}
.muted{color:var(--ink-muted)}.small{font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 24px;border-radius:var(--r-md);border:0;background:var(--brand);color:#fff;font-size:18px;font-weight:600}
.btn:hover{background:var(--brand-dark)}.btn.sec{background:#fff;color:var(--ink);border:1.5px solid #c9d1db}.btn.sec:hover{background:var(--card-muted)}
.btn.sm{min-height:44px;padding:0 16px;font-size:16px}.btn[disabled]{opacity:.6;cursor:wait}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{border-radius:var(--r-lg);padding:18px 22px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:104px}
.kpi b{display:block;font-size:19px;font-weight:600}.kpi span{font-size:14px;opacity:.95}.kpi .n{font-size:56px;line-height:56px;font-weight:200}
.k-red{background:var(--red)}.k-orange{background:var(--orange)}.k-green{background:var(--green)}.k-blue{background:var(--blue)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card-muted);border-radius:var(--r-sm);border-right:6px solid var(--line);padding:12px 16px}
.item.red{border-right-color:var(--red)}.item.orange{border-right-color:var(--orange)}.item.green{border-right-color:var(--green)}
.item b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:14px}
.chip.warn{background:#fff4e0;border-color:#f0c27a}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:collapse;width:100%;font-size:15px;min-width:760px}
table.grid th,table.grid td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:right}
table.grid thead th{background:var(--rail);color:#fff;font-weight:600;position:sticky;top:0}
table.grid th.st{background:var(--card-muted);color:var(--ink);font-weight:500;min-width:170px}
td.cell{cursor:pointer;min-width:110px}
td.cell:hover{background:#eaf3fd}
td.cell.empty{background:#fdecea}
td.cell.empty::before{content:'חסר';color:var(--red);font-weight:600}
td.cell.off{background:repeating-linear-gradient(45deg,#f5f7fa,#f5f7fa 6px,#eceff3 6px,#eceff3 12px);cursor:default}
td.cell .lk{font-size:12px;color:var(--brand)}
td.cell .ly{display:block;font-size:12px;color:var(--ink-muted)}
.lay{display:inline-block;min-width:22px;text-align:center;font-size:12px;border-radius:4px;background:#e8eef5;margin-inline-start:4px}
table.staff{border-collapse:collapse;width:100%;font-size:15px;min-width:980px}
table.staff th,table.staff td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:right;vertical-align:top}
table.staff th{font-weight:600;color:var(--ink-muted);font-size:14px}
table.staff tr.out td{opacity:.55}
table.staff select,table.staff input{min-height:38px;border:1.5px solid #c9d1db;border-radius:8px;padding:0 6px;font-size:15px;background:#fff}
table.staff input.n{width:56px}
.load{font-weight:600}.load.lo{color:var(--red)}.load.ok{color:var(--green)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{border:1.5px solid #c9d1db;background:#fff;border-radius:999px;padding:6px 16px;font-size:16px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
input[type=tel],input[type=search],textarea,.fsel{border:1.5px solid #c9d1db;border-radius:var(--r-md);padding:10px 14px;font-size:17px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #9cc3ef;outline-offset:1px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
.err{color:var(--red);font-weight:600}
.loading{padding:40px;text-align:center;color:var(--ink-muted)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:var(--r-md);z-index:60}
.overlay{position:fixed;inset:0;background:rgba(20,28,38,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;background:#fff;border-radius:var(--r-lg);overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .mhead{background:var(--brand);color:#fff;padding:16px 22px;font-size:19px;font-weight:600}
.modal .mbody{padding:18px 22px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.modal .mfoot{display:flex;gap:10px;padding:14px 22px;border-top:1px solid var(--line)}
.cand{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:right;background:var(--card-muted);border:1.5px solid transparent;border-radius:var(--r-sm);padding:10px 14px;font-size:16px}
.cand:hover{border-color:var(--brand)}.cand.cur{border-color:var(--green);background:#eef7e8}
.cand small{color:var(--ink-muted)}
.note{background:#fff8e6;border:1px solid #f0d48a;border-radius:var(--r-sm);padding:12px 16px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:16px}}
@media (max-width:760px){.app{flex-direction:column}nav.rail{flex-direction:row;flex:none;padding:8px;overflow-x:auto}.rail .brand,.rail .spacer,.rail .who{display:none}.rail button{flex:1;min-width:72px}}
@media print{nav.rail,.noprint,.toast{display:none!important}main{padding:0}body{background:#fff;font-size:12px}.card{box-shadow:none;padding:0;margin-bottom:12px;break-inside:avoid}
 table.grid{font-size:11px;min-width:0}table.grid thead th{background:#ddd;color:#000}td.cell.empty{background:#fff}td.cell .lk{display:none}}
</style>
</head>
<body>
<div id="root"><div class="loading">טוען…</div></div>
<script src="engine.js"></script>
<script>
const CFG={url:'https://onocjgbtensczpdbeanf.supabase.co',key:'sb_publishable_JpV-E-qPnV9ZdnRnY9Kv8Q_TaRzCnyc'};
async function rpc(fn,args){
  const r=await fetch(CFG.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const m=(j&&j.message)||t;throw new Error(/no_access/.test(m)?'no_access':/conflict/.test(m)?'conflict':m)}
  return j;
}
const T=window.Toranut, D=T.DAYS;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root=document.getElementById('root');
let toastT;function toast(m){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3200)}

/* ---------- state ---------- */
const S={phone:null,me:null,view:'sum',tt:{},data:null,at:null,cfg:null,R:null,shiftTab:'b1',staffFilter:'all',q:'',modal:null,busy:false};
try{S.phone=localStorage.getItem('milui_phone')}catch(e){}

function config(){
  const c=JSON.parse(JSON.stringify(T.DEFAULT_CONFIG));
  const ov=S.data.stations||{};
  c.stations=c.stations.filter(st=>!(ov[st.id]&&ov[st.id].off)).map(st=>Object.assign(st,ov[st.id]&&ov[st.id].prio?{prio:+ov[st.id].prio}:{}));
  const so=S.data.shifts||{};
  c.shifts.forEach(sh=>{if(so[sh.id]&&Array.isArray(so[sh.id].days))sh.days=so[sh.id].days});
  if(S.data.quota)Object.assign(c.quota,S.data.quota);
  return c;
}
function recompute(){S.cfg=config();S.R=T.report(S.cfg,S.data.staff,S.tt,S.data.plan.assign||{})}

async function load(){
  const r=await rpc('toranut_load',{p_phone:S.phone});
  S.me=r.me;S.tt=r.tt||{};S.data=r.data||{};S.at=r.updated_at;
  if(!S.data.plan)S.data.plan={assign:{},locked:{}};
  if(!S.data.staff){S.data.staff=T.applyDefaults(T.buildStaff(S.data.formRows||[],S.tt));await save(true)}
  recompute();
}
let saveT;
async function save(now){
  clearTimeout(saveT);
  const go=async()=>{try{S.at=await rpc('toranut_save',{p_phone:S.phone,p_data:S.data,p_expect:S.at})}catch(e){
    if(e.message==='conflict'){toast('מישהו אחר עדכן בינתיים — טוען מחדש');await load();render()}else toast('השמירה נכשלה: '+e.message)}};
  if(now)return go();saveT=setTimeout(go,700);
}

/* ---------- helpers ---------- */
const byId=()=>{const m={};S.data.staff.forEach(s=>m[s.id]=s);return m};
const shiftOf=id=>S.cfg.shifts.find(x=>x.id===id);
const stOf=id=>T.DEFAULT_CONFIG.stations.find(x=>x.id===id);
const roleName={teacher:'מורה',aide:'סייע/ת',admin:'מנהלה',other:'אחר'};
const dayList=a=>a&&a.length?a.map(d=>D[d]).join(', '):'—';
function kpi(cls,title,sub,n){return '<div class="kpi '+cls+'"><div><b>'+title+'</b><span>'+sub+'</span></div><div class="n">'+n+'</div></div>'}
const ICON={sum:'<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>',board:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16M15 4v16"/>',staff:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.6c1.7.8 2.7 2.6 3 5.4"/>',st:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>'};
const icon=k=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[k]+'</svg>';

function render(){
  if(!S.phone)return renderLogin();
  if(!S.data){root.innerHTML='<div class="loading">טוען…</div>';return}
  const nav=[['sum','איפה תקוע'],['board','לוח'],['staff','צוות'],['st','עמדות']];
  const body={sum:viewSum,board:viewBoard,staff:viewStaff,st:viewStations}[S.view]();
  root.innerHTML='<div class="app"><nav class="rail" aria-label="ניווט"><div class="brand">תורנויות<br>חצר</div>'+
    nav.map(n=>'<button type="button" data-act="nav" data-v="'+n[0]+'"'+(S.view===n[0]?' aria-current="page"':'')+'>'+icon(n[0])+n[1]+'</button>').join('')+
    '<div class="spacer"></div><div class="who">'+esc(S.me||'')+'<br><button type="button" class="link" data-act="logout" style="color:var(--rail-ink);font-size:13px;padding:4px">יציאה</button></div></nav><main>'+body+'</main></div>'+(S.modal?renderModal():'');
}
function renderLogin(err){
  root.innerHTML='<div class="login"><form class="card" id="loginForm"><h1>תורנויות חצר</h1><div class="muted">כנפי רוח · כניסה לצוות הניהול</div>'+
   '<label for="ph" style="font-weight:600">מספר טלפון</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" required autofocus>'+
   (err?'<div class="err">'+esc(err)+'</div>':'')+'<button class="btn" type="submit">כניסה</button></form></div>';
}

/* ---------- איפה תקוע ---------- */
function viewSum(){
  const R=S.R,st=R.stats,ran=!!S.data.plan.at;
  const short=st.demand-st.supply;
  let h='<div class="card topbar"><div><h1>איפה זה נתקע</h1><div class="muted small">'+(ran?'הרצה אחרונה: '+new Date(S.data.plan.at).toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'}):'עוד לא הורץ')+'</div></div>'+
    '<div class="row noprint"><button class="btn" data-act="run"'+(S.busy?' disabled':'')+'>'+(S.busy?'מריץ…':'הרצת שיבוץ')+'</button><button class="btn sec sm" data-act="import">עדכון מהשאלון</button></div></div>';
  h+='<div class="kpis">'+kpi('k-blue','עמדות בשבוע','בוקר, הפסקות וסוף יום',st.demand)+kpi('k-green','שובצו','',st.filled)+kpi(st.open?'k-red':'k-green','חסרות','עמדות בלי תורן',st.open)+kpi('k-orange','היצע לפי הכללים','סך התורנויות שאפשר לדרוש',st.supply)+'</div>';
  if(!ran)return h+'<div class="card"><p>הנתונים נטענו: '+st.staffIn+' אנשי צוות בשיבוץ, '+st.staffOut+' מוחרגים. לחצו "הרצת שיבוץ".</p></div>';
  // 1. פער כולל
  h+='<div class="card"><h2>1. הפער הגדול: אין מספיק תורנויות</h2>';
  if(short>0)h+='<p>יש <b>'+st.demand+'</b> עמדות בשבוע, ולפי הכללים (יום תורנות + הפסקת 10 למי שעובד 4–5 ימים, יום תורנות ל־3 ימים, שתי הפסקות ל־1–2 ימים, עד שתיים לסייעות) הצוות יכול לכסות רק <b>'+st.supply+'</b>. כלומר <b>חסרות '+short+' תורנויות</b> עוד לפני כל אילוץ.</p>';
  else h+='<p>ההיצע ('+st.supply+') מכסה את הביקוש ('+st.demand+'). החוסרים נובעים מאילוצים של ימים ושעות.</p>';
  h+=levers()+'</div>';
  // 2. משבצות חסרות — טבלה אחת
  const cells=Object.values(R.cells).filter(c=>c.unfilled.length);
  h+='<div class="card"><h2>2. איפה בדיוק חסר</h2>';
  if(!cells.length)h+='<p>הכול מכוסה.</p>';
  else{
    h+='<div class="tablewrap"><table class="grid"><thead><tr><th>משמרת</th>'+[0,1,2,3,4,5].map(d=>'<th>'+D[d]+'</th>').join('')+'</tr></thead><tbody>'+
    S.cfg.shifts.map(sh=>'<tr><th class="st">'+esc(sh.label)+'</th>'+[0,1,2,3,4,5].map(d=>{
      const c=R.cells[sh.id+'@'+d];if(!c)return '<td class="cell off"></td>';
      if(!c.unfilled.length)return '<td style="color:var(--green)">✓ '+c.filled+'/'+c.demand+'</td>';
      return '<td style="background:#fdecea"><b style="color:var(--red)">חסרים '+c.unfilled.length+'</b><div class="small">'+c.unfilled.map(p=>esc(p.st.name.split(' (')[0])).join('<br>')+'</div><div class="small muted">זמינים בשעה הזו: '+c.possible+' — כולם כבר משובצים או במכסה</div></td>'}).join('')+'</tr>').join('')+
    '</tbody></table></div>';
    const why={};cells.forEach(c=>Object.entries(c.why||{}).forEach(([k,v])=>why[k]=(why[k]||0)+v));
    h+='<p class="small">בכל המשבצות החסרות <b>אין אף אחד פנוי</b>: מי שנמצא בבית הספר באותה שעה כבר מילא את המכסה. העמדות שנשארות ריקות הן אלה בעדיפות הנמוכה (מסך "עמדות").</p>';
  }
  h+='</div>';
  // 3. החלטות פתוחות
  const R2=R.people.reduce((m,p)=>(m[p.id]=p,m),{});
  const out=S.data.staff.filter(s=>s.status!=='in');
  const obst=S.data.staff.filter(s=>s.status==='in'&&s.obstacle);
  const noForm=S.data.staff.filter(s=>!s.form);
  const noTT=S.data.staff.filter(s=>s.form&&!s.tt&&s.role==='teacher'&&s.status==='in');
  h+='<div class="card"><h2>3. החלטות שמחכות להנהלה</h2><div class="list">'+
    '<div class="item orange"><b>כתבו מניעה, ועדיין בשיבוץ ('+obst.length+')</b><div class="small muted">להחריג או להשאיר? (מסך "צוות")</div><div class="list" style="margin-top:8px">'+
      obst.map(s=>'<div class="small"><b>'+esc(s.name)+'</b> <span class="muted">('+roleName[s.role]+', '+R2[s.id].got+' תורנויות)</span> — '+esc(s.obstacle)+'</div>').join('')+'</div></div>'+
    '<div class="item"><b>מוחרגים כרגע ('+out.length+')</b><div class="chips">'+out.map(s=>'<span class="chip">'+esc(s.name)+' · '+esc(s.flag||'הוחרג/ה')+'</span>').join('')+'</div></div>'+
    (noForm.length?'<div class="item orange"><b>במערכת השעות אבל לא מילאו שאלון</b><div class="chips">'+noForm.map(s=>'<span class="chip">'+esc(s.name)+(s.ahmash==='only'?' (אחמ"ש)':'')+'</span>').join('')+'</div></div>':'')+
    (noTT.length?'<div class="item orange"><b>מילאו שאלון אבל לא נמצאו במערכת השעות</b><div class="chips">'+noTT.map(s=>'<span class="chip">'+esc(s.name)+'</span>').join('')+'</div><div class="small muted">שובצו לפי הימים שכתבו, בלי בדיקת שעות.</div></div>':'')+
    '</div></div>';
  // 4. דפוס
  const noPat=R.people.filter(p=>p.status==='in'&&p.target===3&&p.got>=2&&!p.pattern);
  if(noPat.length)h+='<div class="card"><h2>4. בלי יום תורנות מרוכז</h2><p class="small">קיבלו תורנויות בודדות ולא "יום תורנות" (בדרך כלל בגלל אילוצים שלהם):</p><div class="chips">'+noPat.map(p=>'<span class="chip">'+esc(p.name)+'</span>').join('')+'</div></div>';
  return h;
}
function levers(){
  // מה כל צעד נותן — חישוב מהיר
  const c=S.cfg,st=S.R.stats,L=[];
  const concr=c.stations.find(x=>x.id==='concr');
  if(concr){const n=c.shifts.filter(sh=>concr.shifts.includes(sh.id)).reduce((a,sh)=>a+sh.days.length,0);L.push('לוותר על <b>ספסלי הבטון (חדש)</b> — חוסך '+n+' עמדות')}
  const e2=c.shifts.find(x=>x.id==='e2');if(e2)L.push('סיום 13:35 — '+e2.days.length*c.stations.filter(x=>x.shifts.includes('e2')).length+' עמדות בשבוע; אפשר עמדה אחת במקום שתיים');
  const t45=S.R.people.filter(p=>p.status==='in'&&p.target===3).length;L.push('הפסקה נוספת לכל מי שעובד 4–5 ימים (מכסה 4 במקום 3) — מוסיף עד '+t45+' תורנויות');
  const aides=S.R.people.filter(p=>p.status==='in'&&p.role==='aide').length;L.push('שלוש הפסקות לסייעות במקום שתיים — מוסיף עד '+aides);
  const flagged=S.data.staff.filter(s=>s.status==='in'&&s.flag&&/מניעה/.test(s.flag));
  const fu=flagged.reduce((a,s)=>a+T.targetOf(c,s),0);
  if(flagged.length)L.push('<span style="color:var(--red)">ובכיוון ההפוך:</span> '+flagged.length+' אנשים כתבו מניעה ועדיין בפנים ('+fu+' תורנויות). כל החרגה מגדילה את החוסר');
  return '<h3>אפשרויות לסגור את הפער</h3><ul>'+L.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
}

/* ---------- לוח ---------- */
function viewBoard(){
  const P=byId(),A=S.data.plan.assign||{},LK=S.data.plan.locked||{};
  const tabs=S.cfg.shifts.map(sh=>'<button data-act="tab" data-t="'+sh.id+'" aria-pressed="'+(S.shiftTab===sh.id)+'">'+esc(sh.label)+'</button>').join('')+'<button data-act="tab" data-t="all" aria-pressed="'+(S.shiftTab==='all')+'">הכול (להדפסה)</button>';
  const show=S.shiftTab==='all'?S.cfg.shifts:[shiftOf(S.shiftTab)||S.cfg.shifts[0]];
  let h='<div class="card topbar noprint"><div><h1>לוח תורנויות</h1><div class="muted small">לחיצה על משבצת: החלפת תורן. שיבוץ ידני ננעל ונשמר בהרצה הבאה.</div></div><div class="row"><button class="btn sec sm" data-act="print">הדפסה</button><button class="btn sec sm" data-act="csv">הורדה לאקסל</button></div></div>'+
    '<div class="tabs noprint">'+tabs+'</div>';
  show.forEach(sh=>{
    const sts=S.cfg.stations.filter(st=>st.shifts.includes(sh.id));
    h+='<div class="card"><h2>'+esc(sh.label)+'</h2><div class="tablewrap"><table class="grid"><thead><tr><th>עמדה</th>'+[0,1,2,3,4,5].map(d=>'<th>'+D[d]+'</th>').join('')+'</tr></thead><tbody>'+
     sts.map(st=>'<tr><th class="st">'+esc(st.name)+'</th>'+[0,1,2,3,4,5].map(d=>{
       if(!sh.days.includes(d))return '<td class="cell off"></td>';
       const k=sh.id+'@'+d+'@'+st.id,sid=A[k],ly=T.stationLayer(S.cfg,st,sh,d);
       return '<td class="cell'+(sid?'':' empty')+'" data-act="cell" data-k="'+k+'">'+(sid&&P[sid]?esc(P[sid].name)+(LK[k]?' <span class="lk">●</span>':''):'')+(ly&&!st.floor?'<span class="ly">שכבה '+esc(ly)+'</span>':'')+'</td>'}).join('')+'</tr>').join('')+
     '</tbody></table></div></div>';
  });
  return h;
}

/* ---------- צוות ---------- */
function viewStaff(){
  const R2=S.R.people.reduce((m,p)=>(m[p.id]=p,m),{});
  const f=S.staffFilter,q=S.q.trim();
  const list=S.data.staff.filter(s=>(f==='all'||(f==='flag'&&s.flag)||(f==='out'&&s.status!=='in')||(f==='lo'&&s.status==='in'&&R2[s.id].got<R2[s.id].target)||(f===s.role))&&(!q||s.name.includes(q)));
  let h='<div class="card topbar"><div><h1>צוות</h1><div class="muted small">'+S.data.staff.length+' אנשים · שינוי כאן נשמר מיד; כדי לראות את ההשפעה — "הרצת שיבוץ"</div></div><div class="row noprint"><button class="btn sm" data-act="run"'+(S.busy?' disabled':'')+'>'+(S.busy?'מריץ…':'הרצת שיבוץ')+'</button></div></div>';
  h+='<div class="row noprint"><div class="tabs">'+[['all','כולם'],['flag','לבדיקה'],['lo','מתחת למכסה'],['out','מוחרגים'],['teacher','מורים'],['aide','סייעות']].map(x=>'<button data-act="sf" data-f="'+x[0]+'" aria-pressed="'+(f===x[0])+'">'+x[1]+'</button>').join('')+'</div><input type="search" id="q" placeholder="חיפוש שם" value="'+esc(S.q)+'" style="max-width:240px"></div>';
  h+='<div class="card tablewrap"><table class="staff"><thead><tr><th>שם</th><th>תפקיד</th><th>שכבות</th><th>ימים</th><th>משובץ/ת</th><th>אחמ"ש</th><th>מכסה</th><th>שובץ</th><th>לא בוקר</th><th>לא סוף יום</th><th>מה כתב/ה</th></tr></thead><tbody>'+
   list.map(s=>{const p=R2[s.id];
     return '<tr class="'+(s.status!=='in'?'out':'')+'"><td><b>'+esc(s.name)+'</b>'+(s.flag?'<div class="small" style="color:var(--orange)">'+esc(s.flag)+'</div>':'')+(s.tt?'':'<div class="small muted">לא במערכת השעות</div>')+'</td>'+
     '<td>'+roleName[s.role]+'</td><td>'+esc(s.layers)+'</td><td class="small">'+dayList(s.days)+'</td>'+
     '<td><select data-ch="status" data-id="'+s.id+'"><option value="in"'+(s.status==='in'?' selected':'')+'>כן</option><option value="out"'+(s.status!=='in'?' selected':'')+'>מוחרג/ת</option></select></td>'+
     '<td><select data-ch="ahmash" data-id="'+s.id+'">'+[['no','לא'],['can','גם'],['only','רק אחמ"ש']].map(o=>'<option value="'+o[0]+'"'+(s.ahmash===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></td>'+
     '<td><input class="n" type="number" min="0" max="8" data-ch="target" data-id="'+s.id+'" value="'+(s.target!=null&&s.target!==''?s.target:'')+'" placeholder="'+T.targetOf(S.cfg,Object.assign({},s,{target:null}))+'"></td>'+
     '<td><span class="load '+(p.got<p.target?'lo':'ok')+'">'+p.got+'/'+p.target+'</span>'+(p.slots.length?'<div class="small muted">'+p.slots.map(k=>{const a=k.split('@');return D[+a[1]]+' '+(shiftOf(a[0])||{label:a[0]}).label.split(' ')[0]+(a[0]==='b1'?' 10':a[0]==='b2'?' 12':'')}).join(' · ')+'</div>':'')+'</td>'+
     '<td class="small">'+dayList(s.noMorning)+'</td><td class="small">'+dayList(s.noEnd)+'</td>'+
     '<td class="small">'+esc([s.obstacle,s.note].filter(Boolean).join(' · '))+(s.pref&&s.pref.length?'<div class="muted">עדיפות: '+dayList(s.pref)+'</div>':'')+'</td></tr>'}).join('')+
   '</tbody></table></div>';
  return h;
}

/* ---------- עמדות ---------- */
function viewStations(){
  const ov=S.data.stations||{};
  let h='<div class="card"><h1>עמדות</h1><p class="muted small">עדיפות 1 = ממלאים קודם. כשאין מספיק אנשים, עמדות בעדיפות 3 נשארות ריקות ראשונות. "לא פעילה" מוציאה את העמדה מהלוח.</p></div>';
  h+='<div class="card tablewrap"><table class="staff"><thead><tr><th>עמדה</th><th>משמרות</th><th>עדיפות</th><th>פעילה</th></tr></thead><tbody>'+
   T.DEFAULT_CONFIG.stations.map(st=>{const o=ov[st.id]||{},pr=o.prio||st.prio||2;
     return '<tr class="'+(o.off?'out':'')+'"><td><b>'+esc(st.name)+'</b>'+(st.floor?' <span class="lay">'+st.layer+'</span>':'')+(st.yard?'<div class="small muted">שכבה לפי חלוקת החצרות: '+esc(st.yard)+'</div>':'')+'</td><td class="small">'+st.shifts.map(id=>esc((T.DEFAULT_CONFIG.shifts.find(x=>x.id===id)||{}).label)).join('<br>')+'</td>'+
     '<td><select data-ch="prio" data-st="'+st.id+'">'+[1,2,3].map(n=>'<option'+(pr===n?' selected':'')+'>'+n+'</option>').join('')+'</select></td>'+
     '<td><select data-ch="off" data-st="'+st.id+'"><option value="0">פעילה</option><option value="1"'+(o.off?' selected':'')+'>לא פעילה</option></select></td></tr>'}).join('')+'</tbody></table></div>';
  h+='<div class="card"><h2>ימי פעילות לכל משמרת</h2><div class="list">'+T.DEFAULT_CONFIG.shifts.map(sh=>{const cur=shiftOf(sh.id).days;
    return '<div class="row"><b style="min-width:200px">'+esc(sh.label)+'</b>'+[0,1,2,3,4,5].map(d=>'<label class="chip"><input type="checkbox" data-ch="sday" data-sh="'+sh.id+'" data-d="'+d+'"'+(cur.includes(d)?' checked':'')+'> '+D[d]+'</label>').join('')+'</div>'}).join('')+'</div></div>';
  h+='<div class="card"><h2>מכסות</h2><div class="row">'+[['45','4–5 ימים'],['3','3 ימים'],['12','1–2 ימים'],['aide','סייעות'],['ahmash','אחמ"ש בלבד']].map(([k,l])=>'<label class="chip">'+l+' <input class="n" type="number" min="0" max="8" data-ch="quota" data-k="'+k+'" value="'+S.cfg.quota[k]+'" style="width:52px;min-height:32px"></label>').join('')+'</div></div>';
  return h;
}

/* ---------- מודאל החלפת תורן ---------- */
function renderModal(){
  const M=S.modal,[sid,dd,stid]=M.k.split('@'),sh=shiftOf(sid),st=stOf(stid),d=+dd;
  const A=S.data.plan.assign,cur=A[M.k];
  const R2=S.R.people.reduce((m,p)=>(m[p.id]=p,m),{});
  const busy={};Object.keys(A).forEach(k=>{if(k.startsWith(sid+'@'+d+'@')&&k!==M.k)busy[A[k]]=1});
  const cands=S.data.staff.filter(s=>s.status==='in').map(s=>{
    const f=T.formAllows(s,sh,d),pr=T.presence(s,sh,d,S.tt);
    const ok=!f&&pr.ok&&!busy[s.id];const p=R2[s.id];
    return {s,ok,why:f||(!pr.ok&&pr.why)||(busy[s.id]&&'כבר משובץ/ת בעמדה אחרת באותו זמן')||'',p,free:p.got<p.target};
  }).filter(c=>c.ok||M.all).sort((a,b)=>(b.ok-a.ok)||(b.free-a.free)||(a.p.got-b.p.got));
  return '<div class="overlay" data-act="close"><div class="modal" role="dialog" aria-modal="true" data-act="noop"><div class="mhead">'+esc(st.name)+' · '+esc(sh.label)+' · '+D[d]+'</div><div class="mbody">'+
   '<div class="row"><input type="search" id="mq" placeholder="חיפוש" value="'+esc(M.q||'')+'"><label class="small"><input type="checkbox" data-act="mall"'+(M.all?' checked':'')+'> להציג גם מי שלא זמין/ה</label></div>'+
   cands.filter(c=>!M.q||c.s.name.includes(M.q)).map(c=>'<button type="button" class="cand'+(c.s.id===cur?' cur':'')+'" data-act="pick" data-id="'+c.s.id+'"><span><b>'+esc(c.s.name)+'</b> <small>'+roleName[c.s.role]+' · '+esc(c.s.layers)+'</small>'+(c.why?'<br><small style="color:var(--red)">'+esc(c.why)+'</small>':'')+'</span><small>'+c.p.got+'/'+c.p.target+'</small></button>').join('')+
   '</div><div class="mfoot"><button class="btn sec sm" data-act="clear">לרוקן משבצת</button>'+(S.data.plan.locked[M.k]?'<button class="btn sec sm" data-act="unlock">לבטל נעילה</button>':'')+'<button class="btn sm" data-act="close">סגירה</button></div></div></div>';
}

/* ---------- פעולות ---------- */
function run(){
  if(S.busy)return;S.busy=true;render();
  setTimeout(()=>{
    const r=T.solve(config(),S.data.staff,S.tt,{iterations:40,locked:S.data.plan.locked||{},seed:Date.now()%997});
    S.data.plan.assign=r.assign;S.data.plan.at=new Date().toISOString();S.data.plan.stats=r.stats;
    S.busy=false;recompute();save(true);render();toast('השיבוץ הסתיים: '+r.stats.filled+' מתוך '+r.stats.demand+' עמדות');
  },30);
}
function csv(){
  const P=byId(),A=S.data.plan.assign,rows=[['משמרת','עמדה',...D]];
  S.cfg.shifts.forEach(sh=>S.cfg.stations.filter(st=>st.shifts.includes(sh.id)).forEach(st=>rows.push([sh.label,st.name,...[0,1,2,3,4,5].map(d=>sh.days.includes(d)?((P[A[sh.id+'@'+d+'@'+st.id]]||{}).name||'חסר'):'')])));
  const blob=new Blob(['﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='תורנויות-חצר.csv';a.click();
}
async function importSheet(){
  const id=S.data.sheet;let values=null;
  try{
    const url='https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:json&sheet='+encodeURIComponent('תגובות לטופס 1')+'&headers=0';
    const t=await (await fetch(url)).text();const j=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
    values=j.table.rows.map(r=>(r.c||[]).map(c=>c?(c.f!=null&&typeof c.v!=='string'?c.f:c.v):''));
    const cols=j.table.cols.map(c=>c.label||'');if(cols.some(Boolean))values.unshift(cols);
  }catch(e){values=null}
  if(!values){S.modal=null;const txt=prompt('לא הצלחתי לקרוא את הגיליון ישירות.\nהעתיקו את כל הגיליון "תגובות לטופס 1" (Ctrl+A, Ctrl+C) והדביקו כאן:');if(!txt)return;values=txt.split(/\r?\n/).map(l=>l.split('\t'))}
  const rows=T.parseSheet(values);
  if(!rows.length){toast('לא נמצאו תשובות בגיליון');return}
  const fresh=T.applyDefaults(T.buildStaff(rows,S.tt));
  const old={};S.data.staff.forEach(s=>old[s.name]=s);
  const KEEP=['status','ahmash','target','only','noShift','seat','wantsMorning','wantsEnd','prefB2'];
  let added=0;
  fresh.forEach(s=>{const o=old[s.name];if(o){KEEP.forEach(k=>s[k]=o[k]);s.id=o.id;if(o.flag&&!s.flag)s.flag=o.flag}else{added++;s.id='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}});
  S.data.formRows=rows;S.data.staff=fresh;recompute();await save(true);render();
  toast('עודכן מהשאלון: '+rows.length+' תשובות'+(added?', '+added+' חדשים':''));
}

root.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='nav'){S.view=b.dataset.v;render();window.scrollTo(0,0)}
  else if(a==='logout'){try{localStorage.removeItem('milui_phone')}catch(x){}S.phone=null;S.data=null;render()}
  else if(a==='run')run();
  else if(a==='import')importSheet();
  else if(a==='tab'){S.shiftTab=b.dataset.t;render()}
  else if(a==='print'){const t=S.shiftTab;S.shiftTab='all';render();setTimeout(()=>{window.print();S.shiftTab=t;render()},50)}
  else if(a==='csv')csv();
  else if(a==='sf'){S.staffFilter=b.dataset.f;render()}
  else if(a==='cell'){S.modal={k:b.dataset.k,all:false,q:''};render()}
  else if(a==='close'){S.modal=null;render()}
  else if(a==='mall'){S.modal.all=b.checked;render()}
  else if(a==='pick'){const k=S.modal.k;S.data.plan.assign[k]=b.dataset.id;S.data.plan.locked[k]=b.dataset.id;S.modal=null;recompute();save();render();toast('נשמר ונעול')}
  else if(a==='clear'){const k=S.modal.k;delete S.data.plan.assign[k];delete S.data.plan.locked[k];S.modal=null;recompute();save();render()}
  else if(a==='unlock'){delete S.data.plan.locked[S.modal.k];S.modal=null;save();render()}
});
root.addEventListener('change',e=>{
  const el=e.target,ch=el.dataset.ch;if(!ch)return;
  if(el.dataset.id){const s=S.data.staff.find(x=>x.id===el.dataset.id);
    if(ch==='status')s.status=el.value;else if(ch==='ahmash')s.ahmash=el.value;else if(ch==='target')s.target=el.value===''?null:+el.value;
    recompute();save();render();toast('נשמר: '+s.name);return}
  if(ch==='prio'||ch==='off'){const o=(S.data.stations=S.data.stations||{});o[el.dataset.st]=o[el.dataset.st]||{};
    if(ch==='prio')o[el.dataset.st].prio=+el.value;else o[el.dataset.st].off=el.value==='1';recompute();save();render();return}
  if(ch==='sday'){const so=(S.data.shifts=S.data.shifts||{});const cur=shiftOf(el.dataset.sh).days.slice();const d=+el.dataset.d;
    so[el.dataset.sh]={days:el.checked?[...cur,d].sort():cur.filter(x=>x!==d)};recompute();save();render();return}
  if(ch==='quota'){S.data.quota=S.data.quota||{};S.data.quota[el.dataset.k]=+el.value;recompute();save();render();return}
});
root.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById('q');q.focus();q.setSelectionRange(pos,pos)}
  if(e.target.id==='mq'){S.modal.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById('mq');q.focus();q.setSelectionRange(pos,pos)}
});
root.addEventListener('submit',async e=>{
  e.preventDefault();if(e.target.id!=='loginForm')return;
  const ph=e.target.querySelector('#ph').value;
  try{const n=await rpc('milui_login',{p_phone:ph});if(!n){renderLogin('המספר הזה לא מורשה להיכנס.');return}
    S.phone=ph;try{localStorage.setItem('milui_phone',ph)}catch(x){}render();await load();render()}catch(x){renderLogin('אין חיבור לשרת. נסו שוב.')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render()}});

(async()=>{render();if(!S.phone)return;try{await load();render()}catch(e){if(e.message==='no_access'){S.phone=null;renderLogin('המספר הזה לא מורשה להיכנס.')}else root.innerHTML='<div class="loading">שגיאה בטעינה: '+esc(e.message)+'</div>'}})();
</script>
